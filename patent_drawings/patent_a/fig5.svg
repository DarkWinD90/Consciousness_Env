<text x="239" y="690" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">ENERGY FORMULAS:</text>
<text x="239" y="708" font-family="Arial, sans-serif" font-size="14" fill="black">Harvest = 0.20 + (0.09 x spikes) mWh/step</text>
<text x="239" y="723" font-family="Arial, sans-serif" font-size="14" fill="black">Cost = 0.225 + (0.006 x s) + (0.0003 x s^2) mWh/step</text>
<text x="239" y="738" font-family="Arial, sans-serif" font-size="14" fill="black">Net Energy = Harvest - Cost (positive above crossover)</text>

