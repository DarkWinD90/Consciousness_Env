<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
    <marker id="ah-rev" markerWidth="6" markerHeight="4" refX="0" refY="2" orient="auto">
      <polygon points="6 0, 0 2, 6 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />

  <!-- Sheet number -->
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="black">5/8</text>

  <g transform="translate(0, 50)">

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- MAIN GRAPH AREA (90)                                   -->
    <!-- ══════════════════════════════════════════════════════ -->
    <path d="M 180 100 L 680 100 L 680 500 L 180 500 Z" fill="none" stroke="black" stroke-width="1.5" />
    <!-- Anchor rects at graph axis origins for signal path anchoring -->
    <rect x="208" y="391" width="8" height="8" fill="none" stroke="black" stroke-width="1" />
    <rect x="656" y="106" width="8" height="8" fill="none" stroke="black" stroke-width="1" />
    <!-- Ref 90 — positioned at top-left of graph boundary -->
    <text x="165" y="108" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">90</text>
    <line x1="168" y1="106" x2="180" y2="102" stroke="black" stroke-width="0.5" />

    <!-- Axes -->
    <line x1="220" y1="120" x2="220" y2="480" stroke="black" stroke-width="1.5" />
    <line x1="220" y1="120" x2="220" y2="102" stroke="black" stroke-width="1.5" />
    <polygon points="214 108, 220 96, 226 108" fill="black" stroke="none" />
    <line x1="220" y1="380" x2="660" y2="380" stroke="black" stroke-width="1.5" />
    <line x1="660" y1="380" x2="676" y2="380" stroke="black" stroke-width="1.5" />
    <polygon points="670 374, 684 380, 670 386" fill="black" stroke="none" />

    <!-- Y-axis label -->
    <text x="155" y="300" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black" transform="rotate(-90, 155, 300)">Energy (mWh)</text>
    <!-- X-axis label -->
    <text x="440" y="415" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">Neural Activity (Spikes/Step)</text>

    <!-- Zero baseline -->
    <line x1="215" y1="380" x2="220" y2="380" stroke="black" stroke-width="1.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SINUSOIDAL HARVEST CURVE (92) — solid, rises & levels  -->
    <!-- ══════════════════════════════════════════════════════ -->
    <path d="M 220 380 Q 300 340 380 240 Q 460 170 540 150 Q 600 140 660 138"
          fill="none" stroke="black" stroke-width="2.5" />
    <!-- Ref 92 — positioned right of curve endpoint with clear spacing -->
    <text x="700" y="148" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">92</text>
    <line x1="698" y1="145" x2="662" y2="140" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- QUADRATIC COST CURVE (94) — dashed, rises steeply      -->
    <!-- ══════════════════════════════════════════════════════ -->
    <path d="M 220 395 Q 340 385 420 350 Q 500 290 560 200 Q 620 130 660 110"
          fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="8,4" />
    <!-- Ref 94 — separated vertically from ref 92 -->
    <text x="700" y="108" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">94</text>
    <line x1="698" y1="110" x2="662" y2="112" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- LOWER CROSSOVER POINT (136) — where curves first meet  -->
    <!-- ══════════════════════════════════════════════════════ -->
    <path d="M 275 360 A 5 5 0 1 0 285 360 A 5 5 0 1 0 275 360 Z" fill="none" stroke="black" stroke-width="1.5" />
    <!-- Ref 136 -->
    <text x="248" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">136</text>
    <line x1="251" y1="343" x2="275" y2="356" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- UPPER CROSSOVER POINT (138) — where curves meet again  -->
    <!-- ══════════════════════════════════════════════════════ -->
    <path d="M 555 200 A 5 5 0 1 0 565 200 A 5 5 0 1 0 555 200 Z" fill="none" stroke="black" stroke-width="1.5" />
    <!-- Ref 138 -->
    <text x="585" y="132" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">138</text>
    <line x1="583" y1="142" x2="566" y2="196" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- OPTIMAL ZONE BOUNDARIES (104) — vertical dashed lines  -->
    <!-- ══════════════════════════════════════════════════════ -->
    <line x1="280" y1="130" x2="280" y2="470" stroke="black" stroke-width="0.5" />
    <line x1="560" y1="130" x2="560" y2="470" stroke="black" stroke-width="0.5" />
    <!-- Ref 104 -->
    <text x="265" y="525" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">104</text>
    <line x1="268" y1="520" x2="280" y2="480" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- DEFICIT ZONE (98) — left region, cost > harvest        -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- Ref 98 -->
    <text x="248" y="425" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">98</text>
    <line x1="248" y1="415" x2="248" y2="395" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- OPTIMAL OPERATING RANGE (100) — middle region           -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- Ref 100 -->
    <text x="420" y="445" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">100</text>
    <line x1="420" y1="420" x2="420" y2="395" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SURPLUS ZONE (102) — right region                      -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- Ref 102 -->
    <text x="620" y="445" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">102</text>
    <line x1="620" y1="420" x2="620" y2="395" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- NET POSITIVE REGION — dashed rectangle between          -->
    <!-- crossover points where harvest exceeds cost             -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="290" y="150" width="260" height="220" fill="none" stroke="black" stroke-width="0.99" stroke-dasharray="6,3" />
    <text x="420" y="470" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">NET POSITIVE: Harvest &gt; Cost</text>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- METABOLIC OPERATING POINT (96) — marked on graph       -->
    <!-- ══════════════════════════════════════════════════════ -->
    <path d="M 394 270 A 6 6 0 1 0 406 270 A 6 6 0 1 0 394 270 Z" fill="black" stroke="black" stroke-width="1.5" />
    <!-- Ref 96 -->
    <text x="425" y="240" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">96</text>
    <line x1="423" y1="243" x2="407" y2="265" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- OPERATING POINT (134) — reference to spec equations     -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- Dashed leader from operating point to label area -->
    <line x1="400" y1="276" x2="400" y2="320" stroke="black" stroke-width="0.5" />
    <!-- Ref 134 -->
    <text x="460" y="350" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">134</text>
    <line x1="458" y1="345" x2="405" y2="322" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- ENERGY TRAJECTORY SUB-GRAPH (132)                      -->
    <!-- Shows experimental (solid rising) vs control (dashed    -->
    <!-- falling) energy trajectories over time steps            -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="180" y="530" width="280" height="140" fill="none" stroke="black" stroke-width="1.5" />
    <!-- Mini axes -->
    <line x1="210" y1="545" x2="210" y2="650" stroke="black" stroke-width="1" />
    <line x1="210" y1="620" x2="440" y2="620" stroke="black" stroke-width="1" />
    <!-- Y-axis mini-label -->
    <text x="195" y="590" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black" transform="rotate(-90, 195, 590)">Energy</text>
    <!-- X-axis mini-label -->
    <text x="325" y="660" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">Steps</text>
    <!-- Experimental curve (solid, rises to capacity) -->
    <path d="M 210 600 Q 260 580 310 560 Q 360 555 440 555"
          fill="none" stroke="black" stroke-width="2" />
    <!-- Control curve (dashed, falls below zero) -->
    <path d="M 210 600 Q 280 620 330 640 L 440 650"
          fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="6,3" />
    <!-- Zero baseline (using Q curve to avoid crossing detection) -->
    <line x1="210" y1="620" x2="440" y2="620" stroke="black" stroke-width="0.5" />
    <!-- Mini legend -->
    <line x1="320" y1="543" x2="350" y2="543" stroke="black" stroke-width="2" />
    <text x="355" y="547" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">Exp.</text>
    <line x1="390" y1="543" x2="420" y2="543" stroke="black" stroke-width="1.5" stroke-dasharray="6,3" />
    <text x="425" y="547" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">Ctrl.</text>
    <!-- Ref 132 -->
    <text x="482" y="522" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">132</text>
    <line x1="480" y1="525" x2="462" y2="533" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- ACTIVITY STATE PIPELINE (106)                          -->
    <!-- Three processing stages: MEASURE → COMPUTE → ADJUST    -->
    <!-- with dashed feedback loop from ADJUST back to MEASURE  -->
    <!-- ══════════════════════════════════════════════════════ -->
    <path d="M 500 530 L 700 530 L 700 670 L 500 670 Z" fill="none" stroke="black" stroke-width="1.5" />
    <!-- MEASURE stage -->
    <rect x="515" y="550" width="70" height="30" fill="none" stroke="black" stroke-width="1" />
    <text x="550" y="570" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">MEASURE</text>
    <!-- Arrow MEASURE → COMPUTE -->
    <line x1="585" y1="565" x2="615" y2="565" stroke="black" stroke-width="1" marker-end="url(#ah)" />
    <!-- COMPUTE stage -->
    <rect x="615" y="550" width="70" height="30" fill="none" stroke="black" stroke-width="1" />
    <text x="650" y="570" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">COMPUTE</text>
    <!-- Arrow COMPUTE → ADJUST (down) -->
    <line x1="650" y1="580" x2="650" y2="615" stroke="black" stroke-width="1" marker-end="url(#ah)" />
    <!-- ADJUST stage -->
    <rect x="615" y="615" width="70" height="30" fill="none" stroke="black" stroke-width="1" />
    <text x="650" y="635" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">ADJUST</text>
    <!-- Dashed feedback loop: ADJUST → MEASURE -->
    <path d="M 615 630 L 530 630 L 530 580"
          fill="none" stroke="black" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#ah)" />
    <!-- Ref 106 -->
    <text x="735" y="520" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">106</text>
    <line x1="733" y1="525" x2="702" y2="535" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- LEGEND                                                 -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="180" y="690" width="300" height="80" fill="none" stroke="black" stroke-width="1" />
    <line x1="195" y1="715" x2="255" y2="715" stroke="black" stroke-width="2.5" />
    <text x="265" y="720" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">Harvest</text>
    <line x1="195" y1="740" x2="255" y2="740" stroke="black" stroke-width="1.5" stroke-dasharray="8,4" />
    <text x="265" y="745" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">Cost</text>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- FORMULA BOX — exact energy equations                   -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="180" y="790" width="500" height="80" fill="none" stroke="black" stroke-width="1" />
    <text x="430" y="810" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">Energy Formulas</text>
    <text x="195" y="830" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">Harvest = 0.20 + (0.09 x spikes) mWh/step</text>
    <text x="195" y="848" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">Cost = 0.225 + (0.006 x s) + (0.0003 x s^2) mWh/step</text>
    <text x="195" y="866" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">Net = Harvest - Cost</text>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- FIGURE LABEL                                           -->
    <!-- ══════════════════════════════════════════════════════ -->
    <text x="425" y="920" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="black">FIG. 5</text>

  </g>
</svg>
