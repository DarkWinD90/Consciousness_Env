<text x="120" y="590" font-family="Arial" font-size="10" font-weight="bold" fill="#000">ENERGY FORMULAS:</text>
<text x="120" y="608" font-family="Arial" font-size="10" fill="#000">Harvest = 0.20 + (0.09 x spikes) mWh/step</text>
<text x="120" y="623" font-family="Arial" font-size="10" fill="#000">Cost = 0.225 + (0.006 x s) + (0.0003 x s^2) mWh/step</text>
<text x="120" y="638" font-family="Arial" font-size="10" fill="#000">Net Energy = Harvest - Cost (positive above crossover)</text>
