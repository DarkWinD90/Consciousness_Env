<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
    <marker id="ah-rev" markerWidth="6" markerHeight="4" refX="0" refY="2" orient="auto">
      <polygon points="6 0, 0 2, 6 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />

  <!-- Sheet number -->
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="black">1/8</text>

  <g transform="translate(0, 50)">

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- ENVIRONMENT (100) — cloud shape at top                -->
    <!-- ══════════════════════════════════════════════════════ -->
    <path d="M 330 108
             Q 310 108, 315 90
             Q 318 68, 350 68
             Q 355 48, 385 55
             Q 400 42, 425 52
             Q 450 42, 465 55
             Q 495 48, 500 68
             Q 532 68, 535 90
             Q 540 108, 520 108
             Z"
          fill="none" stroke="black" stroke-width="1.5" />
    <text x="425" y="93" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="black">ENVIRONMENT</text>
    <!-- Ref numeral 100 with leader -->
    <text x="548" y="88" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">100</text>
    <line x1="546" y1="88" x2="537" y2="90" stroke="black" stroke-width="0.5" />

    <!-- Arrow: Environment → L1 -->
    <line x1="425" y1="108" x2="425" y2="142" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- L1: PRINTED MEMBRANE (102)                            -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="300" y="142" width="250" height="52" fill="none" stroke="black" stroke-width="1.5" />
    <text x="425" y="163" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">L1: Printed Membrane</text>
    <text x="425" y="183" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">ThermochromicMixin</text>
    <!-- Ref 102 -->
    <text x="560" y="163" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">102</text>
    <line x1="558" y1="163" x2="552" y2="168" stroke="black" stroke-width="0.5" />

    <!-- Arrow: L1 → L2 -->
    <line x1="425" y1="194" x2="425" y2="212" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- L2: SENSING PADS (104)                                -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="300" y="212" width="250" height="52" fill="none" stroke="black" stroke-width="1.5" />
    <text x="425" y="233" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">L2: Sensing Pads</text>
    <text x="425" y="253" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">light_intensity, membrane_temp</text>
    <!-- Ref 104 -->
    <text x="560" y="233" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">104</text>
    <line x1="558" y1="233" x2="552" y2="238" stroke="black" stroke-width="0.5" />

    <!-- Arrow: L2 → L3 -->
    <line x1="425" y1="264" x2="425" y2="282" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- L3: OPTICAL TRANSMISSION (106)                        -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="300" y="282" width="250" height="52" fill="none" stroke="black" stroke-width="1.5" />
    <text x="425" y="303" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">L3: Optical Transmission</text>
    <text x="425" y="323" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">signal_voltage = light/1000 x 5.0</text>
    <!-- Ref 106 -->
    <text x="560" y="303" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">106</text>
    <line x1="558" y1="303" x2="552" y2="308" stroke="black" stroke-width="0.5" />

    <!-- Arrow: L3 → L4 -->
    <line x1="425" y1="334" x2="425" y2="352" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- L4: NEUROMORPHIC CPU / SNN (108)                      -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="300" y="352" width="250" height="62" fill="none" stroke="black" stroke-width="2" />
    <text x="425" y="368" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">L4: Neuromorphic CPU (SNN)</text>
    <text x="425" y="384" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">+ L8 reflection input</text>
    <text x="425" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">BaseSNN (LIF neurons)</text>
    <!-- Neuron circles inside L4 -->
    <circle cx="360" cy="410" r="3" fill="black" stroke="black" stroke-width="1" />
    <circle cx="385" cy="410" r="3" fill="black" stroke="black" stroke-width="1" />
    <circle cx="410" cy="410" r="3" fill="black" stroke="black" stroke-width="1" />
    <circle cx="435" cy="410" r="3" fill="black" stroke="black" stroke-width="1" />
    <circle cx="460" cy="410" r="3" fill="black" stroke="black" stroke-width="1" />
    <!-- Ref 108 -->
    <text x="560" y="383" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">108</text>
    <line x1="558" y1="383" x2="552" y2="383" stroke="black" stroke-width="0.5" />

    <!-- Arrow: L4 → L5 -->
    <line x1="425" y1="414" x2="425" y2="436" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- L5: SERVO ACTUATION (110)                             -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="300" y="436" width="250" height="52" fill="none" stroke="black" stroke-width="1.5" />
    <text x="425" y="457" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">L5: Servo Actuation</text>
    <text x="425" y="477" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">target_angle = clip(output x 180)</text>
    <!-- Ref 110 -->
    <text x="560" y="457" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">110</text>
    <line x1="558" y1="457" x2="552" y2="462" stroke="black" stroke-width="0.5" />

    <!-- Arrow: L5 → L6 -->
    <line x1="425" y1="488" x2="425" y2="510" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
    <text x="438" y="502" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">movement</text>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- L6: ENERGY HARVESTING (112)                           -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="300" y="510" width="250" height="52" fill="none" stroke="black" stroke-width="1.5" />
    <text x="425" y="531" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">L6: Energy Harvesting</text>
    <text x="425" y="551" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">piezo (friction) + thermal</text>
    <!-- Ref 112 -->
    <text x="560" y="531" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">112</text>
    <line x1="558" y1="531" x2="552" y2="536" stroke="black" stroke-width="0.5" />

    <!-- Arrow: L6 → L7 -->
    <line x1="425" y1="562" x2="425" y2="584" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- L7: GROUND REFERENCE (114)                            -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="300" y="584" width="250" height="52" fill="none" stroke="black" stroke-width="1.5" />
    <text x="425" y="605" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">L7: Ground Reference</text>
    <text x="425" y="625" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">noise floor / baseline</text>
    <!-- Ref 114 -->
    <text x="560" y="605" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">114</text>
    <line x1="558" y1="605" x2="552" y2="610" stroke="black" stroke-width="0.5" />

    <!-- Arrow: L7 → L8 -->
    <line x1="425" y1="636" x2="425" y2="658" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- L8: RECURSIVE REFLECTION (116)                        -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="300" y="658" width="250" height="52" fill="none" stroke="black" stroke-width="1.5" />
    <text x="425" y="679" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">L8: Recursive Reflection</text>
    <text x="425" y="699" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">snn.previous_output</text>
    <!-- Ref 116 -->
    <text x="560" y="679" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">116</text>
    <line x1="558" y1="679" x2="552" y2="684" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- THERMAL CROSS-LINK (118) — dashed: L1 → L6            -->
    <!-- ══════════════════════════════════════════════════════ -->
    <path d="M 300 168 L 200 168 L 200 536 L 300 536"
          fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="6,3"
          marker-end="url(#ah)" />
    <!-- Ref 118 -->
    <text x="155" y="350" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">118</text>
    <line x1="168" y1="350" x2="198" y2="350" stroke="black" stroke-width="0.5" />
    <text x="107" y="368" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">thermal</text>
    <text x="107" y="386" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">cross-link</text>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- REFLECTION FEEDBACK (120) — dotted: L8 → L4            -->
    <!-- ══════════════════════════════════════════════════════ -->
    <path d="M 550 684 L 630 684 L 630 383 L 550 383"
          fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="2,3"
          marker-end="url(#ah)" />
    <!-- Ref 120 -->
    <text x="642" y="530" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">120</text>
    <line x1="640" y1="530" x2="632" y2="530" stroke="black" stroke-width="0.5" />
    <text x="642" y="548" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">reflection</text>
    <text x="642" y="566" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">feedback</text>

    <!-- "THE LOOP CLOSES HERE" annotation -->
    <text x="680" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black" transform="rotate(90, 680, 400)">THE LOOP CLOSES</text>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- LEGEND                                                 -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="120" y="770" width="610" height="100" fill="none" stroke="black" stroke-width="1" />
    <text x="135" y="793" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">SIGNAL PATHWAYS:</text>

    <!-- Main spine -->
    <line x1="135" y1="812" x2="195" y2="812" stroke="black" stroke-width="1.5" />
    <text x="205" y="817" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">Main spine (L1 through L8 to L4)</text>

    <!-- Thermal cross-link -->
    <line x1="135" y1="835" x2="195" y2="835" stroke="black" stroke-width="1.5" stroke-dasharray="6,3" />
    <text x="205" y="840" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">Thermal cross-link (L1 temp to L6)</text>

    <!-- Reflection feedback -->
    <line x1="135" y1="858" x2="195" y2="858" stroke="black" stroke-width="1.5" stroke-dasharray="2,3" />
    <text x="205" y="863" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">Reflection feedback (L8 to L4)</text>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- FIGURE LABEL                                           -->
    <!-- ══════════════════════════════════════════════════════ -->
    <text x="425" y="920" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="black">FIG. 1</text>

  </g>
</svg>
