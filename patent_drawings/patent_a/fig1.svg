<svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792">
  <rect width="100%" height="100%" fill="#fff" />

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>

  <text x="306" y="50" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">Sheet 1 of 8</text>

  <!-- System boundary 100 -->
  <rect x="58" y="80" width="496" height="520" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="8,4" />
  <text x="534" y="77" font-family="Arial" font-size="14" fill="#000">100</text>

  <!-- SENSOR 102 — center (130,175) r=18 -->
  <g transform="translate(130 175)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#000" stroke-width="1.5" />
    <path d="M-10 0h20M0-10v20" stroke="#000" stroke-width="1" />
    <text x="0" y="32" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">SENSOR</text>
    <text x="0" y="44" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">102</text>
  </g>

  <!-- SNN 104 — rect (210,140) to (365,210) -->
  <g transform="translate(210 140)">
    <rect width="155" height="70" fill="none" stroke="#000" stroke-width="2" />
    <text x="78" y="18" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">SNN</text>
    <text x="78" y="30" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">(LIF Neurons)</text>
    <circle cx="28" cy="50" r="5" fill="#000" stroke="#000" />
    <circle cx="53" cy="50" r="5" fill="#000" stroke="#000" />
    <circle cx="78" cy="50" r="5" fill="#000" stroke="#000" />
    <circle cx="103" cy="50" r="5" fill="#000" stroke="#000" />
    <circle cx="128" cy="50" r="5" fill="#000" stroke="#000" />
    <path d="M33 50l15 0M58 50l15 0M83 50l15 0M108 50l15 0" stroke="#000" stroke-width="1" />
    <text x="78" y="-8" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">104</text>
  </g>

  <!-- MOTOR 106 — rect (405,145) to (500,205) -->
  <g transform="translate(405 145)">
    <rect width="95" height="60" fill="none" stroke="#000" stroke-width="1.5" />
    <text x="48" y="22" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">MOTOR</text>
    <path d="M24 44c0-20 48-20 48 0" fill="none" stroke="#000" stroke-width="1.2" />
    <path d="M66 39l6 5-6 5" fill="none" stroke="#000" stroke-width="1.2" />
    <text x="48" y="-8" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">106</text>
  </g>

  <!-- POWER MGT 108 — rect (110,285) to (195,345) -->
  <g transform="translate(110 285)">
    <rect width="85" height="60" fill="none" stroke="#000" stroke-width="1.5" />
    <text x="42" y="24" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">POWER</text>
    <text x="42" y="36" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">MGT</text>
    <text x="42" y="74" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">108</text>
  </g>

  <!-- THERMAL 110 — rect (225,280) to (310,335) -->
  <g transform="translate(225 280)">
    <rect width="85" height="55" fill="none" stroke="#000" stroke-width="1.5" />
    <text x="42" y="18" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">THERMAL</text>
    <circle cx="42" cy="38" r="8" stroke="#000" fill="none" />
    <text x="42" y="68" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">110</text>
  </g>

  <!-- PIEZO 112 — center (385,310) r=30 -->
  <g transform="translate(385 310)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#000" stroke-width="1.5" />
    <circle cx="0" cy="0" r="16" fill="none" stroke="#000" stroke-width="1" />
    <text x="0" y="-3" font-family="Arial" font-size="9" text-anchor="middle" fill="#000">PIEZO</text>
    <text x="0" y="9" font-family="Arial" font-size="8" text-anchor="middle" fill="#000">27mm</text>
    <text x="0" y="48" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">112</text>
  </g>

  <!-- GND 114 — at (460,295) -->
  <g transform="translate(460 295)">
    <path d="M0 0h35M5 6h25M10 12h15" stroke="#000" stroke-width="1.5" />
    <text x="17" y="28" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">GND</text>
    <text x="17" y="42" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">114</text>
  </g>

  <!-- CTRL LOGIC 116 — diamond center (270,440) half=30 -->
  <g transform="translate(270 440)">
    <path d="M0-30l30 30-30 30-30-30z" fill="none" stroke="#000" stroke-width="1.5" />
    <text x="0" y="-3" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">CTRL</text>
    <text x="0" y="9" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">LOGIC</text>
    <text x="0" y="48" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">116</text>
  </g>

  <!-- ENERGY STORE 118 — rect (355,415) to (420,465) -->
  <g transform="translate(355 415)">
    <rect width="65" height="50" fill="none" stroke="#000" stroke-width="1.5" />
    <text x="32" y="22" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">ENERGY</text>
    <text x="32" y="34" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">STORE</text>
    <text x="32" y="64" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">118</text>
  </g>

  <!-- SIGNAL ARROWS -->

  <!-- 1. SENSOR → SNN : "input" -->
  <path d="M148 175h62" stroke="#000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
  <text x="179" y="167" font-family="Arial" font-size="9" text-anchor="middle" fill="#000">input</text>

  <!-- 2. SNN → MOTOR : "spikes" -->
  <path d="M365 175h40" stroke="#000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
  <text x="385" y="167" font-family="Arial" font-size="9" text-anchor="middle" fill="#000">spikes</text>

  <!-- 3. MOTOR → PIEZO : "vibration" -->
  <path d="M453 205v55h-68v20" stroke="#000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
  <text x="463" y="240" font-family="Arial" font-size="9" fill="#000">vibration</text>

  <!-- 4. SNN → THERMAL : "heat" -->
  <path d="M267 210v70" stroke="#000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
  <text x="280" y="250" font-family="Arial" font-size="9" fill="#000">heat</text>

  <!-- 5. THERMAL → CTRL LOGIC -->
  <path d="M267 335v40h3v35" stroke="#000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />

  <!-- 6. PIEZO → ENERGY STORE : "energy" -->
  <path d="M385 340v50h3v25" stroke="#000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
  <text x="400" y="380" font-family="Arial" font-size="9" fill="#000">energy</text>

  <!-- 7. ENERGY STORE → POWER MGT -->
  <path d="M355 440h-50v35h-153v-130" stroke="#000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />

  <!-- 8. POWER MGT → SNN : "power" -->
  <path d="M152 285v-90h58" stroke="#000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
  <text x="165" y="250" font-family="Arial" font-size="9" fill="#000">power</text>

  <!-- 9. CTRL LOGIC → ENERGY STORE -->
  <path d="M300 440h55" stroke="#000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />

  <!-- 10. GND → PIEZO : ground ref (dashed) -->
  <path d="M460 301h-46" stroke="#000" stroke-width="1" stroke-dasharray="3,2" fill="none" marker-end="url(#arrow)" />

  <!-- 11. Reflection: CTRL LOGIC → SNN (L8 dashed) -->
  <path d="M240 440h-160v-325h150v25" stroke="#000" stroke-width="1.5" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)" />
  <text x="87" y="395" font-family="Arial" font-size="12" fill="#000">120</text>
  <text x="87" y="408" font-family="Arial" font-size="9" fill="#000">reflection</text>

  <!-- LEGEND -->
  <rect x="58" y="625" width="496" height="55" fill="none" stroke="#000" stroke-width="0.8" />
  <text x="70" y="640" font-family="Arial" font-size="10" font-weight="bold" fill="#000">SIGNAL PATHWAYS:</text>
  <path d="M70 653h40" stroke="#000" stroke-width="1.2" />
  <text x="115" y="656" font-family="Arial" font-size="10" fill="#000">Main signal flow</text>
  <path d="M225 653h40" stroke="#000" stroke-width="1.5" stroke-dasharray="5,5" />
  <text x="270" y="656" font-family="Arial" font-size="10" fill="#000">Reflection feedback (L8)</text>
  <path d="M410 653h40" stroke="#000" stroke-width="1" stroke-dasharray="3,2" />
  <text x="455" y="656" font-family="Arial" font-size="10" fill="#000">Ground ref</text>
  <text x="70" y="673" font-family="Arial" font-size="10" fill="#000">LOOP: SNN drives motor, motor generates energy, energy powers SNN</text>

  <text x="306" y="710" font-family="Arial" font-size="18" text-anchor="middle" fill="#000">FIG. 1</text>
</svg>