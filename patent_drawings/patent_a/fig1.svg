<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />

  <!-- Sheet number -->
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="black">1/8</text>

  <g transform="translate(0, 50)">

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- ENVIRONMENT BOUNDARY (10) — dashed enclosure           -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="100" y="80" width="650" height="730" rx="8" fill="none" stroke="black" stroke-width="1" stroke-dasharray="8,4" />
    <text x="105" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">ENVIRONMENT</text>
    <!-- Ref 10 -->
    <text x="715" y="100" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">10</text>
    <line x1="713" y1="100" x2="700" y2="92" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- ENVIRONMENT INPUT ARROW (sense)                         -->
    <!-- ══════════════════════════════════════════════════════ -->
    <line x1="420" y1="115" x2="420" y2="148" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SENSOR (12)                                            -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="340" y="148" width="160" height="52" fill="none" stroke="black" stroke-width="1.5" />
    <text x="420" y="180" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="black">SENSOR</text>
    <!-- Ref 12 -->
    <text x="515" y="158" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">12</text>
    <line x1="513" y1="161" x2="502" y2="168" stroke="black" stroke-width="0.5" />

    <!-- Arrow: Sensor → SNN -->
    <line x1="420" y1="200" x2="420" y2="230" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SPIKING NEURAL NETWORK (14)                            -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="330" y="230" width="180" height="70" fill="none" stroke="black" stroke-width="2" />
    <text x="420" y="262" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="black">SPIKING NEURAL</text>
    <text x="420" y="282" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="black">NETWORK</text>
    <!-- Ref 14 -->
    <text x="525" y="240" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">14</text>
    <line x1="523" y1="243" x2="512" y2="250" stroke="black" stroke-width="0.5" />

    <!-- Arrow: SNN → Motor -->
    <line x1="420" y1="300" x2="420" y2="338" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- MOTOR (16)                                             -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="350" y="338" width="140" height="50" fill="none" stroke="black" stroke-width="1.5" />
    <text x="420" y="370" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="black">MOTOR</text>
    <!-- Ref 16 -->
    <text x="505" y="348" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">16</text>
    <line x1="503" y1="351" x2="492" y2="358" stroke="black" stroke-width="0.5" />

    <!-- Branches: Motor → Thermal (left) and Motor → Piezo (right) -->
    <path d="M 380 388 L 380 412 L 240 412 L 240 432" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
    <path d="M 460 388 L 460 412 L 600 412 L 600 432" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- THERMAL HARVESTER (20)                                 -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="170" y="432" width="140" height="60" fill="none" stroke="black" stroke-width="1.5" />
    <text x="240" y="456" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">THERMAL</text>
    <text x="240" y="476" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">HARVESTER</text>
    <!-- Ref 20 -->
    <text x="155" y="430" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">20</text>
    <line x1="158" y1="433" x2="172" y2="442" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- PIEZOELECTRIC ELEMENT (22)                             -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="530" y="432" width="140" height="60" fill="none" stroke="black" stroke-width="1.5" />
    <text x="600" y="456" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">PIEZOELECTRIC</text>
    <text x="600" y="476" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">ELEMENT</text>
    <!-- Ref 22 -->
    <text x="685" y="430" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">22</text>
    <line x1="683" y1="433" x2="672" y2="442" stroke="black" stroke-width="0.5" />

    <!-- Both harvesters → junction → Energy Store -->
    <path d="M 240 492 L 240 528 L 420 528" fill="none" stroke="black" stroke-width="1.5" />
    <path d="M 600 492 L 600 528 L 420 528" fill="none" stroke="black" stroke-width="1.5" />
    <circle cx="420" cy="528" r="3" fill="black" stroke="black" stroke-width="1" />
    <line x1="420" y1="528" x2="420" y2="555" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- ENERGY STORE (28)                                      -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="340" y="555" width="160" height="55" fill="none" stroke="black" stroke-width="1.5" />
    <text x="420" y="588" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="black">ENERGY STORE</text>
    <!-- Ref 28 -->
    <text x="515" y="565" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">28</text>
    <line x1="513" y1="568" x2="502" y2="575" stroke="black" stroke-width="0.5" />

    <!-- Energy Store → Power Management (left-down branch) -->
    <path d="M 360 610 L 360 638 L 240 638 L 240 660" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- Energy Store → Control Logic (right-down branch, monitoring) -->
    <path d="M 480 610 L 480 638 L 600 638 L 600 660" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- POWER MANAGEMENT (18)                                  -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="170" y="660" width="140" height="55" fill="none" stroke="black" stroke-width="1.5" />
    <text x="240" y="685" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">POWER</text>
    <text x="240" y="705" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">MANAGEMENT</text>
    <!-- Ref 18 -->
    <text x="155" y="660" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">18</text>
    <line x1="158" y1="663" x2="172" y2="670" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- CONTROL LOGIC (26)                                     -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="530" y="660" width="140" height="55" fill="none" stroke="black" stroke-width="1.5" />
    <text x="600" y="685" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">CONTROL</text>
    <text x="600" y="705" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">LOGIC</text>
    <!-- Ref 26 -->
    <text x="685" y="660" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">26</text>
    <line x1="683" y1="663" x2="672" y2="670" stroke="black" stroke-width="0.5" />

    <!-- Power Management → SNN (long energy return path, dashed, up left corridor x=130) -->
    <path d="M 170 685 L 130 685 L 130 250 L 330 250" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ah)" />

    <!-- Control Logic → SNN (modulation path, dashed, up right corridor x=700) -->
    <path d="M 670 685 L 700 685 L 700 290 L 510 290" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- REFLECTION FEEDBACK PATH (30) — self-loop on SNN        -->
    <!-- Both endpoints on SNN right edge (x=510, y in 230..300) -->
    <!-- ══════════════════════════════════════════════════════ -->
    <path d="M 510 270 L 730 270 L 730 240 L 510 240" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#ah)" />
    <!-- Ref 30 -->
    <text x="740" y="258" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">30</text>
    <line x1="738" y1="258" x2="730" y2="255" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- GROUND REFERENCE (24) — schematic ground symbol         -->
    <!-- Attached to Power Management bottom edge                -->
    <!-- ══════════════════════════════════════════════════════ -->
    <line x1="240" y1="715" x2="240" y2="745" stroke="black" stroke-width="1.5" />
    <line x1="220" y1="745" x2="260" y2="745" stroke="black" stroke-width="1.5" />
    <line x1="226" y1="752" x2="254" y2="752" stroke="black" stroke-width="1.5" />
    <line x1="232" y1="759" x2="248" y2="759" stroke="black" stroke-width="1.5" />
    <!-- Ref 24 -->
    <text x="155" y="752" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">24</text>
    <line x1="158" y1="752" x2="218" y2="752" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- LEGEND                                                 -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="120" y="830" width="610" height="65" fill="none" stroke="black" stroke-width="1" />
    <text x="135" y="852" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">SIGNAL PATHWAYS:</text>

    <line x1="135" y1="872" x2="195" y2="872" stroke="black" stroke-width="1.5" />
    <text x="205" y="877" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">Main signal</text>

    <line x1="320" y1="872" x2="380" y2="872" stroke="black" stroke-width="1.5" stroke-dasharray="6,3" />
    <text x="390" y="877" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">Energy loop</text>

    <line x1="500" y1="872" x2="560" y2="872" stroke="black" stroke-width="1.5" stroke-dasharray="3,3" />
    <text x="570" y="877" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">Reflection</text>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- FIGURE LABEL                                           -->
    <!-- ══════════════════════════════════════════════════════ -->
    <text x="425" y="945" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="black">FIG. 1</text>

  </g>
</svg>
