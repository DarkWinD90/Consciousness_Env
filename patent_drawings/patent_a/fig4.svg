<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />

  <!-- Sheet number -->
  <text x="425" y="100" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="black">4/8</text>

  <g transform="translate(0, 50)">

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- CIRCUIT BOUNDARY (70) — dashed enclosure               -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="130" y="100" width="590" height="530" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="8,4" />
    <!-- Ref 70 -->
    <text x="745" y="108" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">70</text>
    <line x1="743" y1="110" x2="722" y2="108" stroke="black" stroke-width="1" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- PIEZOELECTRIC ELEMENT (22) — top left                  -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- Standard piezoelectric crystal symbol: top electrode, crystal body, bottom electrode -->
    <line x1="210" y1="155" x2="250" y2="155" stroke="black" stroke-width="1.5" />
    <rect x="215" y="160" width="30" height="30" fill="none" stroke="black" stroke-width="1.5" />
    <line x1="210" y1="195" x2="250" y2="195" stroke="black" stroke-width="1.5" />
    <!-- Lead wire from crystal right edge to arrow connection point -->
    <line x1="245" y1="175" x2="265" y2="175" stroke="black" stroke-width="1.5" />
    <!-- Ref 22 -->
    <text x="200" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">22</text>
    <line x1="200" y1="123" x2="210" y2="140" stroke="black" stroke-width="1" />

    <!-- Arrow: Piezo → AC Signal (start within piezo circle bbox) -->
    <line x1="265" y1="175" x2="340" y2="175" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- AC SIGNAL (72)                                         -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="340" y="140" width="120" height="70" fill="none" stroke="black" stroke-width="1.5" />
    <text x="400" y="182" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">AC SIGNAL</text>
    <!-- Ref 72 -->
    <text x="478" y="128" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">72</text>
    <line x1="478" y1="131" x2="460" y2="145" stroke="black" stroke-width="1" />

    <!-- Arrow: AC Signal → Inductor -->
    <line x1="460" y1="175" x2="500" y2="175" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- INDUCTOR (74)                                          -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- Standard inductor coil symbol: 4 semicircular arcs -->
    <!-- Lead wire from AC Signal arrow to coil start -->
    <line x1="500" y1="175" x2="510" y2="175" stroke="black" stroke-width="1.5" />
    <path d="M 510 175 A 12.5 12.5 0 0 1 535 175 A 12.5 12.5 0 0 1 560 175 A 12.5 12.5 0 0 1 585 175 A 12.5 12.5 0 0 1 610 175" fill="none" stroke="black" stroke-width="1.5" />
    <!-- Vertical lead from coil center bottom to downward arrow -->
    <line x1="560" y1="175" x2="560" y2="210" stroke="black" stroke-width="1.5" />
    <!-- Ref 74 -->
    <text x="638" y="128" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">74</text>
    <line x1="638" y1="131" x2="620" y2="145" stroke="black" stroke-width="1" />

    <!-- Arrow: Inductor → Full-Bridge Rectifier (down) -->
    <line x1="560" y1="210" x2="560" y2="270" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- FULL-BRIDGE RECTIFIER (76)                             -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- Outer diamond -->
    <polygon points="560 270, 630 305, 560 340, 490 305" fill="none" stroke="black" stroke-width="1.5" />
    <!-- Four diode symbols inside the diamond (triangle + cathode bar, base diode points right) -->
    <!-- D1: top-right side — anode at top, cathode at right (angle ≈ +26.6°) -->
    <g transform="translate(595,287.5) rotate(26.6)">
      <polygon points="-6,-4 -6,4 2,0" fill="black" />
      <line x1="2" y1="-5" x2="2" y2="5" stroke="black" stroke-width="1.5" />
    </g>
    <!-- D2: bottom-right side — anode at bottom, cathode at right (angle ≈ −26.6°) -->
    <g transform="translate(595,322.5) rotate(-26.6)">
      <polygon points="-6,-4 -6,4 2,0" fill="black" />
      <line x1="2" y1="-5" x2="2" y2="5" stroke="black" stroke-width="1.5" />
    </g>
    <!-- D3: top-left side — anode at left, cathode at top (angle ≈ −26.6°) -->
    <g transform="translate(525,287.5) rotate(-26.6)">
      <polygon points="-6,-4 -6,4 2,0" fill="black" />
      <line x1="2" y1="-5" x2="2" y2="5" stroke="black" stroke-width="1.5" />
    </g>
    <!-- D4: bottom-left side — anode at bottom, cathode at left (angle ≈ +26.6°) -->
    <g transform="translate(525,322.5) rotate(206.6)">
      <polygon points="-6,-4 -6,4 2,0" fill="black" />
      <line x1="2" y1="-5" x2="2" y2="5" stroke="black" stroke-width="1.5" />
    </g>
    <!-- Ref 76 -->
    <text x="670" y="280" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">76</text>
    <line x1="668" y1="283" x2="642" y2="300" stroke="black" stroke-width="1" />

    <!-- Arrow: Rectifier → Smoothing Capacitor (down) -->
    <line x1="560" y1="340" x2="560" y2="400" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- Dashed feedback arrow: Rectifier → Inductor (per spec) -->
    <path d="M 490 280 Q 465 255 475 230 Q 485 215 500 210"
          fill="none" stroke="black" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SMOOTHING CAPACITOR (78)                               -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- Standard electrolytic capacitor symbol: straight positive plate + curved negative plate -->
    <!-- Top lead wire: from rectifier arrow endpoint down to positive plate junction -->
    <line x1="560" y1="400" x2="560" y2="415" stroke="black" stroke-width="1.5" />
    <line x1="555" y1="415" x2="560" y2="415" stroke="black" stroke-width="1.5" />
    <!-- Positive plate (straight vertical line) -->
    <line x1="555" y1="415" x2="555" y2="455" stroke="black" stroke-width="1.5" />
    <!-- Negative plate (curved arc) -->
    <path d="M 565 415 Q 573 435 565 455" fill="none" stroke="black" stroke-width="1.5" />
    <!-- "+" marker near positive plate -->
    <text x="543" y="422" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">+</text>
    <!-- Left connection wire: from positive plate midpoint to boost converter arrow start -->
    <line x1="480" y1="435" x2="555" y2="435" stroke="black" stroke-width="1.5" />
    <!-- Ref 78 -->
    <text x="660" y="390" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">78</text>
    <line x1="658" y1="393" x2="642" y2="408" stroke="black" stroke-width="1" />

    <!-- Arrow: Smoothing Capacitor → Boost Converter (left) -->
    <line x1="480" y1="435" x2="440" y2="435" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- HEAT SINK (80) — left side, thermal path               -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="160" y="270" width="120" height="70" fill="none" stroke="black" stroke-width="1.5" />
    <text x="220" y="312" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">HEAT SINK</text>
    <!-- Ref 80 -->
    <text x="140" y="258" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">80</text>
    <line x1="143" y1="261" x2="160" y2="278" stroke="black" stroke-width="1" />

    <!-- Arrow: Heat Sink → TEG Module (down) -->
    <line x1="220" y1="340" x2="220" y2="400" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- TEG MODULE (82)                                        -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="160" y="400" width="120" height="70" fill="none" stroke="black" stroke-width="1.5" />
    <text x="220" y="432" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">TEG</text>
    <text x="220" y="450" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">MODULE</text>
    <!-- Ref 82 -->
    <text x="140" y="388" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">82</text>
    <line x1="143" y1="391" x2="160" y2="408" stroke="black" stroke-width="1" />

    <!-- Arrow: TEG → Boost Converter (right) -->
    <line x1="280" y1="435" x2="320" y2="435" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- BOOST CONVERTER (84)                                   -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="320" y="400" width="120" height="70" fill="none" stroke="black" stroke-width="1.5" />
    <text x="380" y="432" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">BOOST</text>
    <text x="380" y="450" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">CONVERTER</text>
    <!-- Ref 84 -->
    <text x="300" y="388" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">84</text>
    <line x1="303" y1="391" x2="320" y2="400" stroke="black" stroke-width="1" />

    <!-- Arrow: Boost Converter → Output Regulator (down) -->
    <line x1="380" y1="470" x2="380" y2="540" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- OUTPUT REGULATOR (86)                                  -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="320" y="540" width="120" height="70" fill="none" stroke="black" stroke-width="1.5" />
    <text x="380" y="572" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">OUTPUT</text>
    <text x="380" y="590" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">REGULATOR</text>
    <!-- Ref 86 -->
    <text x="458" y="530" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">86</text>
    <line x1="456" y1="533" x2="442" y2="548" stroke="black" stroke-width="1" />

    <!-- Arrow: Output Regulator → System Output (down) -->
    <line x1="380" y1="610" x2="380" y2="680" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SYSTEM OUTPUT (88) — dashed box indicating SNN feed    -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="310" y="680" width="140" height="60" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" />
    <text x="380" y="716" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">SYSTEM OUTPUT</text>
    <!-- Ref 88 -->
    <text x="468" y="682" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">88</text>
    <line x1="466" y1="685" x2="450" y2="698" stroke="black" stroke-width="1" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SNN (14) — destination reference (dashed, outside)     -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="310" y="770" width="140" height="50" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="8,4" />
    <text x="380" y="800" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">SNN</text>
    <!-- Ref 14 -->
    <text x="468" y="772" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">14</text>
    <line x1="466" y1="775" x2="450" y2="788" stroke="black" stroke-width="1" />

    <!-- Arrow: System Output → SNN -->
    <line x1="380" y1="740" x2="380" y2="770" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- FIGURE LABEL                                           -->
    <!-- ══════════════════════════════════════════════════════ -->
    <text x="425" y="940" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="black">FIG. 4</text>

  </g>
</svg>
