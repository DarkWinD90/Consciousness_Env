<svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792">
  <rect width="100%" height="100%" fill="#fff" />
  <text x="306" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">Sheet 4 of 8</text>
  
  <!-- 400: Energy Harvesting Circuit boundary -->
  <rect x="80" y="145" width="470" height="420" rx="8" ry="8" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="8,4" />
  <text x="535" y="165" font-family="Arial" font-size="14" font-weight="normal" fill="#000">400</text>
  
  <!-- 402: Piezo disc -->
  <g transform="translate(110 170)"><circle cx="28" cy="28" r="24" fill="none" stroke="#000" stroke-width="1.5" /><circle cx="28" cy="28" r="14" fill="none" stroke="#000" /><text x="58" y="15" font-family="Arial" font-size="14" font-weight="normal" fill="#000">402</text></g>
  
  <!-- 404: AC signal -->
  <g transform="translate(200 180)"><path d="M0 15q8-15 16 0t16 0 16 0 16 0" fill="none" stroke="#000" stroke-width="1.5" /><text x="70" y="10" font-family="Arial" font-size="14" font-weight="normal" fill="#000">404</text></g>
  
  <!-- 406: Inductor (LC resonance) -->
  <g transform="translate(200 260)"><rect width="120" height="45" rx="4" ry="4" fill="none" stroke="#000" stroke-width="1.5" /><path d="M20 22 Q35 10, 50 22 Q65 34, 80 22 Q95 10, 100 22" fill="none" stroke="#000" stroke-width="1.5" /><text x="130" y="60" font-family="Arial" font-size="14" font-weight="normal" fill="#000">406</text></g>
  
  <!-- 408: Rectifier (diamond) -->
  <g transform="translate(350 175)"><path fill="none" stroke="#000" stroke-width="1.5" d="m25 0 25 25-25 25-25-25z" /><text x="60" y="15" font-family="Arial" font-size="14" font-weight="normal" fill="#000">408</text></g>
  
  <!-- 410: Capacitor -->
  <g transform="translate(440 165)"><path stroke="#000" stroke-width="1.5" d="M4 5v40M44 5v40" /><path d="M4 25h40" stroke="#000" stroke-width="1" /><text x="55" y="15" font-family="Arial" font-size="14" font-weight="normal" fill="#000">410</text></g>
  
  <!-- 412: Heat sink -->
  <g transform="translate(110 340)"><rect width="56" height="40" fill="none" stroke="#000" stroke-width="1.5" /><path d="M14 0v40M28 0v40M42 0v40" stroke="#000" stroke-width="1" /><text x="70" y="15" font-family="Arial" font-size="14" font-weight="normal" fill="#000">412</text></g>
  
  <!-- 414: Thermoelectric module -->
  <g transform="translate(200 340)"><rect width="90" height="50" rx="4" ry="4" fill="none" stroke="#000" stroke-width="1.5" /><text x="30" y="30" font-family="Arial" font-size="10" fill="#000">TEG</text><text x="100" y="15" font-family="Arial" font-size="14" font-weight="normal" fill="#000">414</text></g>
  
  <!-- 416: Boost converter -->
  <g transform="translate(330 340)"><rect width="80" height="60" rx="4" ry="4" fill="none" stroke="#000" stroke-width="1.5" /><circle cx="40" cy="30" r="10" stroke="#000" /><path d="M30 30h20M40 20v20" stroke="#000" stroke-width="1" /><text x="85" y="15" font-family="Arial" font-size="14" font-weight="normal" fill="#000">416</text></g>
  
  <!-- 418: Output regulator -->
  <g transform="translate(440 340)"><rect width="80" height="60" rx="4" ry="4" fill="none" stroke="#000" stroke-width="1.5" /><text x="20" y="35" font-family="Arial" font-size="10" fill="#000">REG</text><text x="85" y="15" font-family="Arial" font-size="14" font-weight="normal" fill="#000">418</text></g>
  
  <!-- 420: Energy output (to SNN) -->
  <g transform="translate(200 450)"><rect width="140" height="50" rx="4" ry="4" fill="none" stroke="#000" stroke-dasharray="5,3" /><text x="20" y="30" font-family="Arial" font-size="10" fill="#000">To SNN (104)</text><text x="150" y="25" font-family="Arial" font-size="14" font-weight="normal" fill="#000">420</text></g>
  
  <!-- Arrow marker -->
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#000" /></marker></defs>
  
  <!-- Signal flow arrows (individual paths) -->
  <!-- 402 → 404 -->
  <path d="M162 198h38" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />
  <!-- 404 → 406 -->
  <path d="M260 205v55" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />
  <!-- 406 → 408 -->
  <path d="M320 280h30v-80" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />
  <!-- 408 → 410 -->
  <path d="M400 200h40" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />
  <!-- 410 → 418 (down) -->
  <path d="M464 210v130" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />
  <!-- 412 → 414 -->
  <path d="M166 360h34" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />
  <!-- 414 → 416 -->
  <path d="M290 365h40" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />
  <!-- 416 → 418 -->
  <path d="M410 370h30" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />
  <!-- 418 → 420 (output) -->
  <path d="M480 400v80h-140" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />
  <!-- Feedback from 408 to 406 -->
  <path d="M375 225v55h-55" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrow)" />
  
  <text x="306" y="700" font-family="Arial" font-size="18" font-weight="normal" text-anchor="middle" fill="#000">FIG. 4</text>
</svg>
