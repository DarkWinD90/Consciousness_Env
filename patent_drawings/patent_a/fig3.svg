<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 2550 3300">
  <!-- 300 DPI: 8.5in=2550px, 11in=3300px -->
  <!-- USPTO Margins: Top=1in(300px), Left=1in(300px), Right=5/8in(187px), Bottom=3/8in(112px) -->
  <!-- Safe drawing area: x=300..2363, y=300..3188 -->
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black" />
    </marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="18" height="18" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="black" stroke-width="2.4" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="white" />

  <!-- Margin boundary (not rendered, for reference) -->
  <!-- Safe area: 300,300 to 2363,3188 -->

  <g transform="translate(300, 300)">
    <!-- Drawing area: 2063 x 2888 -->

    <!-- Sheet number -->
    <text x="1032" y="80" font-family="Helvetica" font-size="48" text-anchor="middle" fill="black">3/8</text>

    <!-- ============================================ -->
    <!-- SNN BOUNDARY (14) -->
    <!-- ============================================ -->
    <rect x="320" y="200" width="1560" height="1100" fill="none" stroke="black" stroke-width="6" />
    <text x="1100" y="185" font-family="Helvetica" font-size="42" text-anchor="middle" fill="black">SNN</text>
    <!-- Ref 14 -->
    <text x="1920" y="230" font-family="Helvetica" font-size="42" text-anchor="start" fill="black">14</text>
    <line x1="1916" y1="232" x2="1882" y2="218" stroke="black" stroke-width="3" />

    <!-- ============================================ -->
    <!-- EXTERNAL INPUT -->
    <!-- ============================================ -->
    <line x1="200" y1="520" x2="340" y2="520" stroke="black" stroke-width="4.5" marker-end="url(#ah)" />
    <text x="180" y="528" font-family="Helvetica" font-size="42" text-anchor="end" fill="black">EXT.</text>

    <!-- ============================================ -->
    <!-- REFLECTION INPUT -->
    <!-- ============================================ -->
    <line x1="200" y1="680" x2="340" y2="680" stroke="black" stroke-width="4.5" stroke-dasharray="15,9" marker-end="url(#ah)" />
    <text x="180" y="688" font-family="Helvetica" font-size="42" text-anchor="end" fill="black">REFL.</text>

    <!-- ============================================ -->
    <!-- INPUT LAYER (52) -->
    <!-- ============================================ -->
    <rect x="340" y="300" width="340" height="460" fill="none" stroke="black" stroke-width="4.5" />
    <text x="510" y="370" font-family="Helvetica" font-size="42" text-anchor="middle" fill="black">INPUT</text>
    <text x="510" y="418" font-family="Helvetica" font-size="42" text-anchor="middle" fill="black">LAYER</text>
    <!-- Input neurons - 2x2 grid, well spaced -->
    <circle cx="450" cy="520" r="30" fill="none" stroke="black" stroke-width="4.5" />
    <circle cx="570" cy="520" r="30" fill="none" stroke="black" stroke-width="4.5" />
    <circle cx="450" cy="640" r="30" fill="none" stroke="black" stroke-width="4.5" />
    <circle cx="570" cy="640" r="30" fill="none" stroke="black" stroke-width="4.5" />
    <!-- Ref 52 - positioned clear of SNN boundary -->
    <text x="280" y="250" font-family="Helvetica" font-size="42" text-anchor="end" fill="black">52</text>
    <line x1="288" y1="258" x2="340" y2="300" stroke="black" stroke-width="3" />

    <!-- ============================================ -->
    <!-- Arrow: Input -> Weight Matrix -->
    <!-- ============================================ -->
    <line x1="680" y1="560" x2="760" y2="560" stroke="black" stroke-width="4.5" marker-end="url(#ah)" />

    <!-- ============================================ -->
    <!-- WEIGHT MATRIX (54) -->
    <!-- ============================================ -->
    <rect x="760" y="320" width="340" height="400" fill="none" stroke="black" stroke-width="4.5" />
    <text x="930" y="390" font-family="Helvetica" font-size="42" text-anchor="middle" fill="black">WEIGHT</text>
    <text x="930" y="438" font-family="Helvetica" font-size="42" text-anchor="middle" fill="black">MATRIX</text>
    <!-- Grid representation - clear of text -->
    <rect x="840" y="470" width="200" height="200" fill="none" stroke="black" stroke-width="3" />
    <line x1="840" y1="520" x2="1040" y2="520" stroke="black" stroke-width="3" />
    <line x1="840" y1="570" x2="1040" y2="570" stroke="black" stroke-width="3" />
    <line x1="840" y1="620" x2="1040" y2="620" stroke="black" stroke-width="3" />
    <line x1="890" y1="470" x2="890" y2="670" stroke="black" stroke-width="3" />
    <line x1="940" y1="470" x2="940" y2="670" stroke="black" stroke-width="3" />
    <line x1="990" y1="470" x2="990" y2="670" stroke="black" stroke-width="3" />
    <!-- Ref 54 - clear above, not colliding with Ref 52 -->
    <text x="700" y="250" font-family="Helvetica" font-size="42" text-anchor="end" fill="black">54</text>
    <line x1="708" y1="258" x2="760" y2="320" stroke="black" stroke-width="3" />

    <!-- ============================================ -->
    <!-- Arrow: Weight Matrix -> Hidden Layer -->
    <!-- ============================================ -->
    <line x1="1100" y1="560" x2="1180" y2="560" stroke="black" stroke-width="4.5" marker-end="url(#ah)" />

    <!-- ============================================ -->
    <!-- HIDDEN LAYER (56) -->
    <!-- ============================================ -->
    <rect x="1180" y="300" width="340" height="460" fill="none" stroke="black" stroke-width="4.5" />
    <text x="1350" y="370" font-family="Helvetica" font-size="42" text-anchor="middle" fill="black">HIDDEN</text>
    <text x="1350" y="418" font-family="Helvetica" font-size="42" text-anchor="middle" fill="black">LAYER</text>
    <!-- Hidden neurons - 3 circles in a row, well spaced -->
    <circle cx="1250" cy="560" r="35" fill="none" stroke="black" stroke-width="4.5" />
    <circle cx="1350" cy="560" r="35" fill="none" stroke="black" stroke-width="4.5" />
    <circle cx="1450" cy="560" r="35" fill="none" stroke="black" stroke-width="4.5" />
    <!-- "i" label centered inside middle neuron, sized to fit -->
    <text x="1350" y="572" font-family="Helvetica" font-size="36" font-style="italic" text-anchor="middle" fill="black">i</text>
    <!-- Ref 56 - positioned to right, clear of box edge -->
    <text x="1560" y="255" font-family="Helvetica" font-size="42" text-anchor="start" fill="black">56</text>
    <line x1="1555" y1="262" x2="1520" y2="300" stroke="black" stroke-width="3" />

    <!-- ============================================ -->
    <!-- Arrow: Hidden Layer -> Output Stage -->
    <!-- ============================================ -->
    <line x1="1520" y1="560" x2="1600" y2="560" stroke="black" stroke-width="4.5" marker-end="url(#ah)" />

    <!-- ============================================ -->
    <!-- OUTPUT STAGE (60) -->
    <!-- ============================================ -->
    <rect x="1600" y="360" width="240" height="340" fill="none" stroke="black" stroke-width="4.5" />
    <text x="1720" y="420" font-family="Helvetica" font-size="42" text-anchor="middle" fill="black">OUTPUT</text>
    <text x="1720" y="468" font-family="Helvetica" font-size="42" text-anchor="middle" fill="black">STAGE</text>
    <!-- Triangle symbol -->
    <path d="M 1660 530 L 1780 570 L 1660 610 Z" fill="none" stroke="black" stroke-width="4.5" />
    <!-- Ref 60 -->
    <text x="1870" y="360" font-family="Helvetica" font-size="42" text-anchor="start" fill="black">60</text>
    <line x1="1866" y1="366" x2="1842" y2="376" stroke="black" stroke-width="3" />

    <!-- ============================================ -->
    <!-- SPIKE OUTPUT routing (62) -->
    <!-- ============================================ -->
    <!-- Exit SNN boundary, route down to Spike Vector -->
    <line x1="1840" y1="570" x2="1900" y2="570" stroke="black" stroke-width="4.5" />
    <circle cx="1900" cy="570" r="8" fill="black" stroke="black" stroke-width="3" />
    <line x1="1900" y1="570" x2="1960" y2="570" stroke="black" stroke-width="4.5" />
    <line x1="1960" y1="570" x2="1960" y2="2020" stroke="black" stroke-width="4.5" />
    <line x1="1960" y1="2020" x2="1480" y2="2020" stroke="black" stroke-width="4.5" marker-end="url(#ah)" />
    <!-- Ref 62 - placed well away from routing path -->
    <text x="2000" y="560" font-family="Helvetica" font-size="42" text-anchor="start" fill="black">62</text>
    <line x1="1996" y1="566" x2="1970" y2="570" stroke="black" stroke-width="3" />

    <!-- ============================================ -->
    <!-- NEURON DETAIL (58) - inset showing LIF behavior -->
    <!-- Moved below SNN boundary to avoid collision -->
    <!-- ============================================ -->
    <rect x="340" y="1360" width="1100" height="340" fill="none" stroke="black" stroke-width="3" stroke-dasharray="15,9" />
    <!-- Connector from hidden neuron down to detail box - routes outside boxes -->
    <line x1="1350" y1="595" x2="1350" y2="760" stroke="black" stroke-width="3" />
    <line x1="1350" y1="760" x2="240" y2="760" stroke="black" stroke-width="3" />
    <line x1="240" y1="760" x2="240" y2="1500" stroke="black" stroke-width="3" />
    <line x1="240" y1="1500" x2="340" y2="1500" stroke="black" stroke-width="3" />
    <!-- LIF neuron symbol -->
    <circle cx="500" cy="1510" r="45" fill="none" stroke="black" stroke-width="4.5" />
    <line x1="460" y1="1500" x2="540" y2="1500" stroke="black" stroke-width="3" />
    <text x="660" y="1520" font-family="Helvetica" font-size="42" text-anchor="middle" fill="black">LIF</text>
    <!-- Membrane trace mini-plot -->
    <polyline points="900,1640 940,1600 980,1580 1020,1530 1040,1490 1048,1640 1088,1600 1128,1560 1168,1520 1188,1490 1196,1640 1236,1600 1280,1560"
          fill="none" stroke="black" stroke-width="4.5" />
    <!-- Ref 58 -->
    <text x="1480" y="1350" font-family="Helvetica" font-size="42" text-anchor="start" fill="black">58</text>
    <line x1="1476" y1="1358" x2="1442" y2="1370" stroke="black" stroke-width="3" />

    <!-- ============================================ -->
    <!-- MEMBRANE POTENTIAL DYNAMICS (64) -->
    <!-- ============================================ -->
    <rect x="340" y="1760" width="960" height="420" fill="none" stroke="black" stroke-width="3" stroke-dasharray="15,9" />
    <text x="820" y="1810" font-family="Helvetica" font-size="42" text-anchor="middle" fill="black">MEMBRANE POTENTIAL</text>
    <!-- Y-axis -->
    <line x1="420" y1="1840" x2="420" y2="2110" stroke="black" stroke-width="3" />
    <!-- X-axis -->
    <line x1="420" y1="2110" x2="1230" y2="2110" stroke="black" stroke-width="3" />
    <!-- Threshold line -->
    <line x1="420" y1="1880" x2="1230" y2="1880" stroke="black" stroke-width="3" stroke-dasharray="10,6" />
    <text x="1250" y="1888" font-family="Helvetica" font-size="30" text-anchor="start" fill="black">V_th</text>
    <!-- Membrane potential trace -->
    <path d="M 420 2080 Q 490 2040 540 1980 L 560 1870 L 566 2080 Q 640 2020 720 1970 L 740 1870 L 746 2080 Q 820 2040 880 1980 L 900 1870 L 906 2080 Q 980 2040 1060 1980 L 1080 1870 L 1086 2080 L 1230 2040"
          fill="none" stroke="black" stroke-width="6" />
    <!-- Ref 64 -->
    <text x="1340" y="1750" font-family="Helvetica" font-size="42" text-anchor="start" fill="black">64</text>
    <line x1="1336" y1="1758" x2="1302" y2="1772" stroke="black" stroke-width="3" />

    <!-- ============================================ -->
    <!-- SPIKE VECTOR OUTPUT (66) -->
    <!-- ============================================ -->
    <rect x="340" y="2240" width="1120" height="200" fill="none" stroke="black" stroke-width="4.5" />
    <text x="900" y="2300" font-family="Helvetica" font-size="42" text-anchor="middle" fill="black">SPIKE VECTOR OUTPUT</text>
    <!-- Raster bars (hatched) - wider bars with proper spacing to avoid collision -->
    <rect x="400" y="2320" width="36" height="90" fill="url(#hatch)" stroke="black" stroke-width="2.4" />
    <rect x="480" y="2345" width="36" height="65" fill="url(#hatch)" stroke="black" stroke-width="2.4" />
    <rect x="560" y="2330" width="36" height="80" fill="url(#hatch)" stroke="black" stroke-width="2.4" />
    <rect x="640" y="2360" width="36" height="50" fill="url(#hatch)" stroke="black" stroke-width="2.4" />
    <rect x="720" y="2315" width="36" height="95" fill="url(#hatch)" stroke="black" stroke-width="2.4" />
    <rect x="800" y="2335" width="36" height="75" fill="url(#hatch)" stroke="black" stroke-width="2.4" />
    <rect x="880" y="2320" width="36" height="90" fill="url(#hatch)" stroke="black" stroke-width="2.4" />
    <rect x="960" y="2370" width="36" height="40" fill="url(#hatch)" stroke="black" stroke-width="2.4" />
    <rect x="1040" y="2330" width="36" height="80" fill="url(#hatch)" stroke="black" stroke-width="2.4" />
    <rect x="1120" y="2345" width="36" height="65" fill="url(#hatch)" stroke="black" stroke-width="2.4" />
    <!-- Ref 66 -->
    <text x="1500" y="2280" font-family="Helvetica" font-size="42" text-anchor="start" fill="black">66</text>
    <line x1="1496" y1="2288" x2="1462" y2="2260" stroke="black" stroke-width="3" />

    <!-- ============================================ -->
    <!-- STDP LEARNING RULE BOX (68) -->
    <!-- ============================================ -->
    <rect x="1380" y="1760" width="530" height="370" fill="none" stroke="black" stroke-width="4.5" />
    <text x="1645" y="1900" font-family="Helvetica" font-size="42" text-anchor="middle" fill="black">STDP</text>
    <text x="1645" y="1950" font-family="Helvetica" font-size="42" text-anchor="middle" fill="black">LEARNING</text>
    <text x="1645" y="2000" font-family="Helvetica" font-size="42" text-anchor="middle" fill="black">RULE</text>
    <!-- Ref 68 - positioned clear of routing line at x=1960 -->
    <text x="1940" y="1750" font-family="Helvetica" font-size="42" text-anchor="start" fill="black">68</text>
    <line x1="1936" y1="1758" x2="1912" y2="1772" stroke="black" stroke-width="3" />

    <!-- ============================================ -->
    <!-- Arrow: STDP feedback to Weight Matrix (dashed) -->
    <!-- Routes clear of all elements -->
    <!-- ============================================ -->
    <path d="M 1645 1760 L 1645 1720 L 930 1720 L 930 1320 L 170 1320 L 170 560 L 320 560"
          fill="none" stroke="black" stroke-width="4.5" stroke-dasharray="15,9" />
    <line x1="930" y1="1320" x2="930" y2="720" stroke="black" stroke-width="4.5" stroke-dasharray="15,9" marker-end="url(#ah)" />

    <!-- ============================================ -->
    <!-- FIGURE LABEL -->
    <!-- ============================================ -->
    <text x="1032" y="2700" font-family="Helvetica" font-size="60" text-anchor="middle" fill="black">FIG. 3</text>

  </g>
</svg>