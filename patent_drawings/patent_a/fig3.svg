    <path d="M 478 220 A 12 12 0 1 0 502 220 A 12 12 0 1 0 478 220 Z" fill="none" stroke="black" stroke-width="1.5" />
    <path d="M 508 220 A 12 12 0 1 0 532 220 A 12 12 0 1 0 508 220 Z" fill="none" stroke="black" stroke-width="1.5" />
    <text x="520" y="225" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">i</text>
    <path d="M 538 220 A 12 12 0 1 0 562 220 A 12 12 0 1 0 538 220 Z" fill="none" stroke="black" stroke-width="1.5" />
    <!-- Ref 56 -->
    <text x="600" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">56</text>
    <line x1="598" y1="123" x2="580" y2="140" stroke="black" stroke-width="1" />

