    <rect x="208" y="730" width="12" height="18" fill="url(#hatch)" stroke="black" stroke-width="0.5" />
    <rect x="236" y="724" width="12" height="24" fill="url(#hatch)" stroke="black" stroke-width="0.5" />
    <rect x="264" y="735" width="12" height="13" fill="url(#hatch)" stroke="black" stroke-width="0.5" />
    <rect x="292" y="718" width="12" height="30" fill="url(#hatch)" stroke="black" stroke-width="0.5" />
    <rect x="320" y="726" width="12" height="22" fill="url(#hatch)" stroke="black" stroke-width="0.5" />
    <rect x="348" y="720" width="12" height="28" fill="url(#hatch)" stroke="black" stroke-width="0.5" />
    <rect x="376" y="738" width="12" height="10" fill="url(#hatch)" stroke="black" stroke-width="0.5" />
    <rect x="404" y="724" width="12" height="24" fill="url(#hatch)" stroke="black" stroke-width="0.5" />
    <rect x="432" y="730" width="12" height="18" fill="url(#hatch)" stroke="black" stroke-width="0.5" />
    <!-- Ref 66 -->
    <text x="580" y="710" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">66</text>
    <line x1="578" y1="714" x2="562" y2="720" stroke="black" stroke-width="1" />

