<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />

  <!-- Sheet number -->
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="black">3/8</text>

  <g transform="translate(0, 50)">

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SNN BOUNDARY (14) — main bounding rectangle           -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="140" y="100" width="560" height="400" rx="8" fill="none" stroke="black" stroke-width="2" />
    <text x="425" y="92" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="black">SNN</text>
    <!-- Ref 14 -->
    <text x="720" y="110" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">14</text>
    <line x1="718" y1="112" x2="702" y2="108" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- EXTERNAL INPUT — arrow entering SNN from left           -->
    <!-- ══════════════════════════════════════════════════════ -->
    <line x1="105" y1="205" x2="160" y2="205" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
    <text x="122" y="195" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">EXT.</text>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- REFLECTION INPUT — dashed arrow entering SNN from left  -->
    <!-- (L8 recursive self-observation feedback)                -->
    <!-- ══════════════════════════════════════════════════════ -->
    <line x1="105" y1="260" x2="160" y2="260" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ah)" />
    <text x="122" y="274" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">REFL.</text>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- INPUT LAYER (52)                                       -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="160" y="140" width="120" height="160" rx="4" fill="none" stroke="black" stroke-width="1.5" />
    <text x="220" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">INPUT</text>
    <text x="220" y="178" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">LAYER</text>
    <!-- Input neurons -->
    <circle cx="200" cy="210" r="10" fill="none" stroke="black" stroke-width="1.5" />
    <circle cx="240" cy="210" r="10" fill="none" stroke="black" stroke-width="1.5" />
    <circle cx="200" cy="250" r="10" fill="none" stroke="black" stroke-width="1.5" />
    <circle cx="240" cy="250" r="10" fill="none" stroke="black" stroke-width="1.5" />
    <!-- Ref 52 -->
    <text x="142" y="122" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">52</text>
    <line x1="145" y1="125" x2="160" y2="140" stroke="black" stroke-width="0.5" />

    <!-- Arrow: Input → Weight Matrix -->
    <line x1="280" y1="220" x2="310" y2="220" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- WEIGHT MATRIX (54)                                     -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="310" y="150" width="120" height="140" rx="4" fill="none" stroke="black" stroke-width="1.5" />
    <text x="370" y="172" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">WEIGHT</text>
    <text x="370" y="190" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">MATRIX</text>
    <!-- Grid representation -->
    <rect x="330" y="205" width="80" height="70" fill="none" stroke="black" stroke-width="0.8" />
    <line x1="330" y1="222" x2="410" y2="222" stroke="black" stroke-width="0.8" />
    <line x1="330" y1="240" x2="410" y2="240" stroke="black" stroke-width="0.8" />
    <line x1="330" y1="258" x2="410" y2="258" stroke="black" stroke-width="0.8" />
    <line x1="350" y1="205" x2="350" y2="275" stroke="black" stroke-width="0.8" />
    <line x1="370" y1="205" x2="370" y2="275" stroke="black" stroke-width="0.8" />
    <line x1="390" y1="205" x2="390" y2="275" stroke="black" stroke-width="0.8" />
    <!-- Ref 54 -->
    <text x="292" y="132" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">54</text>
    <line x1="295" y1="135" x2="310" y2="150" stroke="black" stroke-width="0.5" />

    <!-- Arrow: Weight Matrix → Hidden Layer -->
    <line x1="430" y1="220" x2="460" y2="220" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- HIDDEN LAYER (56)                                      -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="460" y="140" width="120" height="160" rx="4" fill="none" stroke="black" stroke-width="1.5" />
    <text x="520" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">HIDDEN</text>
    <text x="520" y="178" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">LAYER</text>
    <!-- Hidden neurons — three circles, center labeled "i" -->
    <circle cx="490" cy="220" r="12" fill="none" stroke="black" stroke-width="1.5" />
    <circle cx="520" cy="220" r="12" fill="none" stroke="black" stroke-width="1.5" />
    <text x="520" y="225" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">i</text>
    <circle cx="550" cy="220" r="12" fill="none" stroke="black" stroke-width="1.5" />
    <!-- Ref 56 -->
    <text x="595" y="132" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">56</text>
    <line x1="593" y1="135" x2="580" y2="148" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- NEURON DETAIL (58) — inset showing LIF behavior        -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- Dashed box indicating magnified neuron detail -->
    <rect x="160" y="330" width="400" height="120" rx="4" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" />
    <!-- Magnification line from hidden neuron to detail -->
    <line x1="520" y1="232" x2="520" y2="330" stroke="black" stroke-width="0.8" stroke-dasharray="3,3" />
    <!-- Neuron circle with threshold indicator -->
    <circle cx="210" cy="380" r="15" fill="none" stroke="black" stroke-width="1.5" />
    <!-- Threshold bar inside neuron -->
    <line x1="198" y1="375" x2="222" y2="375" stroke="black" stroke-width="1" stroke-dasharray="2,2" />
    <!-- LIF equation text -->
    <text x="240" y="365" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="black">V(t+1) = V(t) x leak + I</text>
    <text x="240" y="380" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="black">If V &gt;= V_th: spike</text>
    <text x="240" y="395" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="black">V_th = 0.5</text>
    <!-- Membrane trace mini-plot -->
    <path d="M 400 430 L 415 420 L 430 415 L 445 400 L 450 385 L 453 430 L 468 420 L 483 408 L 498 392 L 503 385 L 506 430 L 521 420"
          fill="none" stroke="black" stroke-width="1.5" />
    <!-- Ref 58 -->
    <text x="578" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">58</text>
    <line x1="576" y1="343" x2="562" y2="352" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- OUTPUT STAGE (60)                                      -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="600" y="160" width="80" height="120" rx="4" fill="none" stroke="black" stroke-width="1.5" />
    <text x="640" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">OUTPUT</text>
    <text x="640" y="203" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">STAGE</text>
    <!-- Aggregation triangle -->
    <path d="M 615 220 L 665 240 L 615 260 Z" fill="none" stroke="black" stroke-width="1.5" />
    <!-- Ref 60 -->
    <text x="700" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">60</text>
    <line x1="698" y1="163" x2="682" y2="168" stroke="black" stroke-width="0.5" />

    <!-- Arrow: Hidden Layer → Output Stage -->
    <line x1="580" y1="220" x2="600" y2="220" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SPIKE OUTPUT (62) — ref label at SNN exit point         -->
    <!-- (Arrow merged into route-to-spike-vector below to       -->
    <!--  eliminate overlap at (680,240)→(700,240))               -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- Ref 62 -->
    <text x="720" y="228" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">62</text>
    <line x1="718" y1="232" x2="703" y2="240" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- MEMBRANE POTENTIAL DYNAMICS (64) — inset graph          -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="160" y="520" width="340" height="150" rx="4" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" />
    <text x="330" y="545" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">MEMBRANE POTENTIAL</text>
    <!-- Mini axes -->
    <line x1="190" y1="560" x2="190" y2="650" stroke="black" stroke-width="1" />
    <line x1="190" y1="650" x2="480" y2="650" stroke="black" stroke-width="1" />
    <!-- Threshold line -->
    <line x1="190" y1="585" x2="480" y2="585" stroke="black" stroke-width="0.8" stroke-dasharray="3,3" />
    <!-- Membrane potential trace with spikes -->
    <path d="M 190 640 Q 220 620 240 600 L 245 570 L 248 640 Q 280 615 310 595 L 315 570 L 318 640 Q 350 620 370 600 L 375 570 L 378 640 Q 410 620 440 600 L 445 570 L 448 640 L 480 625"
          fill="none" stroke="black" stroke-width="2" />
    <!-- Ref 64 -->
    <text x="518" y="528" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">64</text>
    <line x1="516" y1="530" x2="502" y2="535" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SPIKE VECTOR OUTPUT (66) — raster display              -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="160" y="690" width="400" height="70" rx="4" fill="none" stroke="black" stroke-width="1.5" />
    <text x="360" y="712" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">SPIKE VECTOR OUTPUT</text>
    <!-- Raster bars -->
    <rect x="180" y="720" width="12" height="28" fill="black" />
    <rect x="208" y="730" width="12" height="18" fill="black" />
    <rect x="236" y="724" width="12" height="24" fill="black" />
    <rect x="264" y="735" width="12" height="13" fill="black" />
    <rect x="292" y="718" width="12" height="30" fill="black" />
    <rect x="320" y="726" width="12" height="22" fill="black" />
    <rect x="348" y="720" width="12" height="28" fill="black" />
    <rect x="376" y="738" width="12" height="10" fill="black" />
    <rect x="404" y="724" width="12" height="24" fill="black" />
    <rect x="432" y="730" width="12" height="18" fill="black" />
    <!-- Ref 66 -->
    <text x="580" y="710" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">66</text>
    <line x1="578" y1="714" x2="562" y2="720" stroke="black" stroke-width="0.5" />

    <!-- Arrow: Output Stage → exit SNN → route down to Spike Vector -->
    <!-- Single continuous path from Output Stage (680,240) through SNN exit to Spike Vector -->
    <line x1="680" y1="240" x2="720" y2="240" stroke="black" stroke-width="1.5" />
    <line x1="720" y1="240" x2="720" y2="730" stroke="black" stroke-width="1.5" />
    <line x1="720" y1="730" x2="560" y2="730" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
    <!-- Small arrowhead tick at SNN exit (x=700) to mark spike output -->
    <line x1="696" y1="237" x2="700" y2="240" stroke="black" stroke-width="1.5" />
    <line x1="696" y1="243" x2="700" y2="240" stroke="black" stroke-width="1.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- STDP LEARNING RULE BOX (68)                            -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="530" y="520" width="190" height="130" rx="4" fill="none" stroke="black" stroke-width="1.5" />
    <text x="625" y="540" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="black">STDP LEARNING RULE</text>
    <text x="625" y="558" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">If post fires:</text>
    <text x="625" y="572" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">W += A+ x pre_trace (LTP)</text>
    <text x="625" y="590" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">If pre fires:</text>
    <text x="625" y="604" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">W -= A- x post_trace (LTD)</text>
    <text x="625" y="622" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">A- &gt; A+ (stability bias)</text>
    <text x="625" y="638" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">Weight bounds: [0.0, 0.5]</text>
    <!-- Ref 68 -->
    <text x="738" y="532" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">68</text>
    <line x1="736" y1="536" x2="722" y2="540" stroke="black" stroke-width="0.5" />

    <!-- Arrow: STDP feedback to Weight Matrix (dashed) -->
    <!-- Seg 1a: STDP box top → approach SNN bottom boundary -->
    <line x1="625" y1="520" x2="625" y2="507" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" />
    <!-- Bridge arc over SNN bottom boundary at y=500 (MPEP 608.02(V)) -->
    <path d="M 625 507 A 7 7 0 0 1 625 493" fill="none" stroke="black" stroke-width="1.5" />
    <!-- Seg 1b: Inside SNN → horizontal turn -->
    <line x1="625" y1="493" x2="625" y2="470" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" />
    <!-- Seg 2: horizontal to Weight Matrix column -->
    <line x1="625" y1="470" x2="370" y2="470" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" />
    <!-- Seg 3: down into Weight Matrix -->
    <line x1="370" y1="470" x2="370" y2="290" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- FIGURE LABEL                                           -->
    <!-- ══════════════════════════════════════════════════════ -->
    <text x="425" y="920" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="black">FIG. 3</text>

  </g>
</svg>
