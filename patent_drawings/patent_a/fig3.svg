    <line x1="330" y1="222" x2="410" y2="222" stroke="black" stroke-width="1" />
    <line x1="330" y1="240" x2="410" y2="240" stroke="black" stroke-width="1" />
    <line x1="330" y1="258" x2="410" y2="258" stroke="black" stroke-width="1" />
    <line x1="350" y1="205" x2="350" y2="275" stroke="black" stroke-width="1" />
