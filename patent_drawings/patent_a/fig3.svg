<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />

  <!-- Sheet number. Absolute y=60 puts it in the header exemption window
       (margin_validator header_cutoff=60). Matches fig1.svg convention. -->
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">3/8</text>

  <g transform="translate(0, 50)">

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SNN BOUNDARY (14) — outer frame, regression test anchor -->
    <!-- Kept as <rect> primitive per tests/test_patent_diagram  -->
    <!-- _regressions.py::test_fig3_snn_boundary_uses_rect_primitive -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="107" y="67" width="520" height="367" fill="none" stroke="black" stroke-width="2" />
    <text x="160" y="85" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="black">SPIKING NEURAL NETWORK</text>
    <!-- Ref 14 -->
    <text x="612" y="85" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">14</text>
    <line x1="610" y1="83" x2="598" y2="75" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- EXTERNAL INPUT arrow into input layer -->
    <!-- ══════════════════════════════════════════════════════ -->
    <text x="145" y="185" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">EXT.</text>
    <line x1="125" y1="200" x2="175" y2="200" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- REFLECTION INPUT arrow (dashed) -->
    <text x="145" y="263" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">REFL.</text>
    <line x1="125" y1="280" x2="175" y2="280" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- INPUT LAYER (52) — 2x2 input neurons -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="175" y="115" width="90" height="210" fill="none" stroke="black" stroke-width="1.5" />
    <text x="220" y="133" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">INPUT</text>
    <text x="220" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">LAYER</text>
    <circle cx="200" cy="200" r="10" fill="none" stroke="black" stroke-width="1.5" />
    <circle cx="240" cy="200" r="10" fill="none" stroke="black" stroke-width="1.5" />
    <circle cx="200" cy="280" r="10" fill="none" stroke="black" stroke-width="1.5" />
    <circle cx="240" cy="280" r="10" fill="none" stroke="black" stroke-width="1.5" />
    <!-- Ref 52 -->
    <text x="265" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">52</text>
    <line x1="263" y1="335" x2="253" y2="325" stroke="black" stroke-width="0.5" />

    <!-- Arrow: Input -> Weight Matrix (horizontal, y=220) -->
    <line x1="265" y1="220" x2="295" y2="220" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- WEIGHT MATRIX (54) — grid representation -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="295" y="130" width="100" height="180" fill="none" stroke="black" stroke-width="1.5" />
    <text x="345" y="152" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">WEIGHT</text>
    <text x="345" y="169" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">MATRIX</text>
    <!-- Internal grid (stroke-width 0.8 so geometric_validator treats as leader, not signal) -->
    <rect x="312" y="190" width="65" height="65" fill="none" stroke="black" stroke-width="0.8" />
    <line x1="312" y1="211" x2="377" y2="211" stroke="black" stroke-width="0.8" />
    <line x1="312" y1="233" x2="377" y2="233" stroke="black" stroke-width="0.8" />
    <line x1="333" y1="190" x2="333" y2="255" stroke="black" stroke-width="0.8" />
    <line x1="355" y1="190" x2="355" y2="255" stroke="black" stroke-width="0.8" />
    <!-- Ref 54 -->
    <text x="345" y="122" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">54</text>
    <line x1="345" y1="124" x2="345" y2="130" stroke="black" stroke-width="0.5" />

    <!-- Arrow: Weight Matrix -> Hidden Layer -->
    <line x1="395" y1="220" x2="425" y2="220" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- HIDDEN LAYER (56) — 3 LIF neurons -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="425" y="115" width="100" height="210" fill="none" stroke="black" stroke-width="1.5" />
    <text x="475" y="133" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">HIDDEN</text>
    <text x="475" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">LAYER</text>
    <circle cx="445" cy="225" r="11" fill="none" stroke="black" stroke-width="1.5" />
    <circle cx="475" cy="225" r="11" fill="none" stroke="black" stroke-width="1.5" />
    <circle cx="505" cy="225" r="11" fill="none" stroke="black" stroke-width="1.5" />
    <text x="475" y="229" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">i</text>
    <!-- Ref 56 -->
    <text x="532" y="113" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">56</text>
    <line x1="530" y1="115" x2="525" y2="117" stroke="black" stroke-width="0.5" />

    <!-- Arrow: Hidden Layer -> Output Stage -->
    <line x1="525" y1="220" x2="545" y2="220" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- OUTPUT STAGE (60) — thresholding triangle -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="545" y="150" width="70" height="150" fill="none" stroke="black" stroke-width="1.5" />
    <text x="580" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">OUTPUT</text>
    <text x="580" y="192" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">STAGE</text>
    <path d="M 557 212 L 602 235 L 557 258 Z" fill="none" stroke="black" stroke-width="1.5" />
    <!-- Ref 60 -->
    <text x="618" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">60</text>
    <line x1="616" y1="158" x2="612" y2="154" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SPIKE OUTPUT (62) — exits Output Stage at y=235, right edge -->
    <!--  routed inside SNN: right then down, exits right side of SNN -->
    <!--  at y=395 and continues down to Spike Vector Output box top. -->
    <!-- ══════════════════════════════════════════════════════ -->
    <path d="M 615 235 L 690 235 L 690 740 L 537 740" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
    <circle cx="690" cy="235" r="3" fill="black" />
    <!-- Ref 62 -->
    <text x="700" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">62</text>
    <line x1="698" y1="398" x2="692" y2="395" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- NEURON DETAIL (58) — dashed inset -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="110" y="470" width="260" height="110" fill="none" stroke="black" stroke-width="1" stroke-dasharray="5,3" />
    <text x="240" y="492" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">LIF NEURON DETAIL</text>
    <circle cx="150" cy="540" r="14" fill="none" stroke="black" stroke-width="1.5" />
    <text x="150" y="545" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">LIF</text>
    <polyline points="180,560 195,540 210,525 225,510 227,560 242,540 257,525 272,510 274,560 289,540 304,525 319,510 321,560 336,540"
              fill="none" stroke="black" stroke-width="1.5" />
    <!-- Ref 58 -->
    <text x="375" y="476" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">58</text>
    <line x1="373" y1="474" x2="370" y2="472" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- MEMBRANE POTENTIAL DYNAMICS (64) — V vs t plot -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="110" y="600" width="260" height="120" fill="none" stroke="black" stroke-width="1" stroke-dasharray="5,3" />
    <text x="240" y="622" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">MEMBRANE POTENTIAL V(t)</text>
    <line x1="135" y1="635" x2="135" y2="710" stroke="black" stroke-width="1" />
    <line x1="135" y1="710" x2="355" y2="710" stroke="black" stroke-width="1" />
    <line x1="135" y1="655" x2="355" y2="655" stroke="black" stroke-width="0.8" stroke-dasharray="3,2" />
    <text x="358" y="659" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">V_th</text>
    <path d="M 135 705 L 165 675 L 170 655 L 172 710 L 200 680 L 225 660 L 227 710 L 255 680 L 280 660 L 282 710 L 310 680 L 335 660 L 337 710 L 355 700"
          fill="none" stroke="black" stroke-width="1.5" />
    <!-- Ref 64 -->
    <text x="375" y="606" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">64</text>
    <line x1="373" y1="604" x2="370" y2="602" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SPIKE VECTOR OUTPUT (66) — raster bars -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="400" y="740" width="235" height="110" fill="none" stroke="black" stroke-width="1.5" />
    <text x="517" y="762" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">SPIKE VECTOR OUTPUT</text>
    <rect x="415" y="775" width="9" height="60" fill="black" stroke="black" stroke-width="0.8" />
    <rect x="435" y="790" width="9" height="45" fill="black" stroke="black" stroke-width="0.8" />
    <rect x="455" y="780" width="9" height="55" fill="black" stroke="black" stroke-width="0.8" />
    <rect x="475" y="800" width="9" height="35" fill="black" stroke="black" stroke-width="0.8" />
    <rect x="495" y="772" width="9" height="63" fill="black" stroke="black" stroke-width="0.8" />
    <rect x="515" y="788" width="9" height="47" fill="black" stroke="black" stroke-width="0.8" />
    <rect x="535" y="776" width="9" height="59" fill="black" stroke="black" stroke-width="0.8" />
    <rect x="555" y="800" width="9" height="35" fill="black" stroke="black" stroke-width="0.8" />
    <rect x="575" y="784" width="9" height="51" fill="black" stroke="black" stroke-width="0.8" />
    <rect x="595" y="792" width="9" height="43" fill="black" stroke="black" stroke-width="0.8" />
    <rect x="615" y="778" width="9" height="57" fill="black" stroke="black" stroke-width="0.8" />
    <!-- Ref 66 -->
    <text x="640" y="748" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">66</text>
    <line x1="638" y1="746" x2="635" y2="744" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- STDP LEARNING RULE BOX (68) -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="400" y="470" width="235" height="240" fill="none" stroke="black" stroke-width="1.5" />
    <text x="517" y="510" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">STDP LEARNING RULE</text>
    <text x="517" y="545" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">Δw = A+ · pre · post</text>
    <text x="517" y="570" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">if Δt &gt; 0 (LTP)</text>
    <text x="517" y="600" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">Δw = -A- · pre · post</text>
    <text x="517" y="625" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">if Δt &lt; 0 (LTD)</text>
    <!-- ASCII 'in' replaces U+2208 to avoid cairosvg/PDF font-fallback
         rendering as an empty box, which would violate 37 CFR 1.84(p)(1)
         legibility. The patent specification keeps the Greek glyph. -->
    <text x="517" y="665" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">w in [w_min, w_max]</text>
    <!-- Ref 68 -->
    <text x="640" y="478" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">68</text>
    <line x1="638" y1="476" x2="635" y2="472" stroke="black" stroke-width="0.5" />

    <!-- STDP feedback path (dashed) from STDP box top, up and across to Weight Matrix -->
    <path d="M 400 480 L 345 480 L 345 310"
          fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- FIGURE LABEL -->
    <!-- ══════════════════════════════════════════════════════ -->
    <text x="425" y="890" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="black">FIG. 3</text>

  </g>
</svg>
