    <text x="130" y="565" font-family="Courier New, monospace" font-size="14" text-anchor="middle">adjusted_input</text>
    <line x1="602" y1="580" x2="695" y2="580" stroke="black" stroke-width="1.5" marker-end="url(#ah)"/>
    <text x="620" y="565" font-family="Courier New, monospace" font-size="14">spike_vector</text>
