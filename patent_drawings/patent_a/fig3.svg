<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="4" height="4">
      <path d="M-1,1 l2,-2 M0,4 l4,-4 M3,5 l2,-2" stroke="black" stroke-width="0.8" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="white" />

  <g transform="translate(30, 60)">

    <!-- Sheet number -->
    <text x="395" y="40" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="black">3/8</text>

    <!-- SNN BOUNDARY (14) -->
    <rect x="140" y="100" width="560" height="400" fill="none" stroke="black" stroke-width="2" />
    <text x="425" y="92" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="black">SNN</text>
    <!-- Ref 14 -->
    <text x="720" y="110" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">14</text>
    <line x1="718" y1="112" x2="702" y2="108" stroke="black" stroke-width="1" />

    <!-- EXTERNAL INPUT -->
    <line x1="100" y1="205" x2="160" y2="205" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
    <text x="75" y="200" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">EXT.</text>

    <!-- REFLECTION INPUT -->
    <line x1="100" y1="260" x2="160" y2="260" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ah)" />
    <text x="75" y="265" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">REFL.</text>

    <!-- INPUT LAYER (52) -->
    <rect x="160" y="140" width="120" height="160" fill="none" stroke="black" stroke-width="1.5" />
    <text x="220" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">INPUT</text>
    <text x="220" y="178" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">LAYER</text>
    <!-- Input neurons -->
    <path d="M 190 210 A 10 10 0 1 0 210 210 A 10 10 0 1 0 190 210 Z" fill="none" stroke="black" stroke-width="1.5" />
    <path d="M 230 210 A 10 10 0 1 0 250 210 A 10 10 0 1 0 230 210 Z" fill="none" stroke="black" stroke-width="1.5" />
    <path d="M 190 250 A 10 10 0 1 0 210 250 A 10 10 0 1 0 190 250 Z" fill="none" stroke="black" stroke-width="1.5" />
    <path d="M 230 250 A 10 10 0 1 0 250 250 A 10 10 0 1 0 230 250 Z" fill="none" stroke="black" stroke-width="1.5" />
