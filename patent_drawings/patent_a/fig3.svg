    <line x1="520" y1="232" x2="520" y2="330" stroke="black" stroke-width="1" />
    <path d="M 195 380 A 15 15 0 1 0 225 380 A 15 15 0 1 0 195 380 Z" fill="none" stroke="black" stroke-width="1.5" />
