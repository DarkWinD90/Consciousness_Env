    <circle cx="700" cy="240" r="3" fill="black" stroke="black" stroke-width="1" />
    <line x1="700" y1="240" x2="740" y2="240" stroke="black" stroke-width="1.5" />
    <line x1="740" y1="240" x2="740" y2="730" stroke="black" stroke-width="1.5" />
    <line x1="740" y1="730" x2="560" y2="730" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- STDP LEARNING RULE BOX (68) -->
    <rect x="530" y="520" width="190" height="130" fill="none" stroke="black" stroke-width="1.5" />
    <text x="625" y="570" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">STDP</text>
    <text x="625" y="590" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">LEARNING</text>
    <text x="625" y="610" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">RULE</text>
    <!-- Ref 68 -->
    <text x="738" y="532" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">68</text>
    <line x1="736" y1="536" x2="722" y2="540" stroke="black" stroke-width="1" />

    <!-- Arrow: STDP feedback to Weight Matrix -->
