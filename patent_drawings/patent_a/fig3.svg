    <text x="425" y="660" font-family="Courier New, monospace" font-size="14" text-anchor="middle">W[i,i] = 0 (no self-connections)</text>
    <text x="425" y="682" font-family="Courier New, monospace" font-size="14" text-anchor="middle">N = 50 (operational), N = 20 (control)</text>
