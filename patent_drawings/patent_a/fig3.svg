<text x="294" y="600" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">STDP LEARNING RULE</text>
<text x="209" y="618" font-family="Arial, sans-serif" font-size="14" fill="black">If post fires: W += A+ x pre_trace</text>
<text x="209" y="634" font-family="Arial, sans-serif" font-size="14" fill="black">If pre fires: W -= A- x post_trace</text>
<text x="209" y="650" font-family="Arial, sans-serif" font-size="14" fill="black">A- &gt; A+ (stability bias)</text>
<text x="209" y="666" font-family="Arial, sans-serif" font-size="14" fill="black">Weight bounds: [0.0, 0.5]</text>
<text x="399" y="600" font-family="Arial, sans-serif" font-size="14" fill="black">320</text>
