    <text x="425" y="737" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">STDP Learning Rule</text>
    <text x="685" y="755" font-family="Arial, sans-serif" font-size="14" text-anchor="end">320</text>
    <text x="170" y="761" font-family="Courier New, monospace" font-size="14">Post fires: W += A+ x pre_trace (LTP)</text>
    <text x="170" y="781" font-family="Courier New, monospace" font-size="14">Pre fires:  W -= A- x post_trace (LTD)</text>
    <text x="170" y="803" font-family="Courier New, monospace" font-size="14">A- &gt; A+ (stability bias)</text>
    <text x="425" y="910" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">FIG. 3</text>
