<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792">
  <ns0:rect width="100%" height="100%" fill="#fff" />
  <ns0:text x="306" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">Sheet 7 of 8</ns0:text>

  <!-- Claims validation table 700 -->
  <ns0:g transform="translate(85 120)">
    <ns0:rect x="0" y="0" width="460" height="200" fill="none" stroke="#000" stroke-width="1.5" />
    <!-- Header row -->
    <ns0:line x1="0" y1="40" x2="460" y2="40" stroke="#000" stroke-width="1" />
    <!-- Column dividers -->
    <ns0:line x1="80" y1="0" x2="80" y2="200" stroke="#000" stroke-width="0.5" />
    <ns0:line x1="280" y1="0" x2="280" y2="200" stroke="#000" stroke-width="0.5" />
    <ns0:line x1="380" y1="0" x2="380" y2="200" stroke="#000" stroke-width="0.5" />
    <!-- Row dividers -->
    <ns0:line x1="0" y1="72" x2="460" y2="72" stroke="#000" stroke-width="0.3" />
    <ns0:line x1="0" y1="104" x2="460" y2="104" stroke="#000" stroke-width="0.3" />
    <ns0:line x1="0" y1="136" x2="460" y2="136" stroke="#000" stroke-width="0.3" />
    <ns0:line x1="0" y1="168" x2="460" y2="168" stroke="#000" stroke-width="0.3" />
    <!-- Headers -->
    <ns0:text x="40" y="28" font-family="Arial" font-size="11" text-anchor="middle" fill="#000">Claim</ns0:text>
    <ns0:text x="180" y="28" font-family="Arial" font-size="11" text-anchor="middle" fill="#000">Criterion</ns0:text>
    <ns0:text x="330" y="28" font-family="Arial" font-size="11" text-anchor="middle" fill="#000">Threshold</ns0:text>
    <ns0:text x="420" y="28" font-family="Arial" font-size="11" text-anchor="middle" fill="#000">Result</ns0:text>
    <!-- Data rows -->
    <ns0:text x="40" y="60" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">A</ns0:text>
    <ns0:text x="180" y="60" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Closed-loop continuity</ns0:text>
    <ns0:text x="330" y="60" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">2000 pts</ns0:text>
    <ns0:text x="420" y="60" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">PASS</ns0:text>

    <ns0:text x="40" y="92" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">B</ns0:text>
    <ns0:text x="180" y="92" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Boundedness</ns0:text>
    <ns0:text x="330" y="92" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">finite</ns0:text>
    <ns0:text x="420" y="92" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">PASS</ns0:text>

    <ns0:text x="40" y="124" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">C</ns0:text>
    <ns0:text x="180" y="124" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Noise robustness</ns0:text>
    <ns0:text x="330" y="124" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">std &lt;= 45</ns0:text>
    <ns0:text x="420" y="124" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">PASS</ns0:text>

    <ns0:text x="40" y="156" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">D</ns0:text>
    <ns0:text x="180" y="156" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Input-output gain</ns0:text>
    <ns0:text x="330" y="156" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">corr &gt;= 0.2</ns0:text>
    <ns0:text x="420" y="156" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">PASS</ns0:text>

    <ns0:text x="40" y="188" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">E</ns0:text>
    <ns0:text x="180" y="188" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Saturation ratio</ns0:text>
    <ns0:text x="330" y="188" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">&lt;= 0.20</ns0:text>
    <ns0:text x="420" y="188" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">PASS</ns0:text>

    <ns0:text x="475" y="15" font-family="Arial" font-size="14" font-weight="normal" fill="#000">700</ns0:text>
  </ns0:g>

  <!-- Energy comparison table 702 -->
  <ns0:g transform="translate(85 340)">
    <ns0:rect x="0" y="0" width="460" height="100" fill="none" stroke="#000" stroke-width="1.5" />
    <ns0:line x1="0" y1="35" x2="460" y2="35" stroke="#000" stroke-width="1" />
    <ns0:line x1="160" y1="0" x2="160" y2="100" stroke="#000" stroke-width="0.5" />
    <ns0:line x1="310" y1="0" x2="310" y2="100" stroke="#000" stroke-width="0.5" />
    <!-- Headers -->
    <ns0:text x="80" y="24" font-family="Arial" font-size="11" text-anchor="middle" fill="#000">Configuration</ns0:text>
    <ns0:text x="235" y="24" font-family="Arial" font-size="11" text-anchor="middle" fill="#000">Energy @ 2000</ns0:text>
    <ns0:text x="385" y="24" font-family="Arial" font-size="11" text-anchor="middle" fill="#000">Status</ns0:text>
    <!-- Data -->
    <ns0:text x="80" y="58" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Control (CLI)</ns0:text>
    <ns0:text x="235" y="58" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">-4697 mWh</ns0:text>
    <ns0:text x="385" y="58" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">DEAD</ns0:text>
    <ns0:text x="80" y="82" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Experimental (MCP)</ns0:text>
    <ns0:text x="235" y="82" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">100.0 mWh</ns0:text>
    <ns0:text x="385" y="82" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">ALIVE</ns0:text>
    <ns0:text x="475" y="15" font-family="Arial" font-size="14" font-weight="normal" fill="#000">702</ns0:text>
  </ns0:g>

  <!-- Energy trajectory graph 704 -->
  <ns0:g transform="translate(85 460)">
    <ns0:rect x="0" y="0" width="220" height="100" fill="none" stroke="#000" stroke-width="1.5" />
    <ns0:g transform="translate(25 15)">
      <ns0:line x1="0" y1="70" x2="170" y2="70" stroke="#000" stroke-width="1" />
      <ns0:line x1="0" y1="0" x2="0" y2="75" stroke="#000" stroke-width="1" />
      <!-- Control trajectory (dashed, goes down) -->
      <ns0:path d="M0,35 Q42,50 85,60 T170,68" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4,2" />
      <!-- Experimental trajectory (solid, stays up) -->
      <ns0:path d="M0,35 Q42,25 85,20 T170,10" fill="none" stroke="#000" stroke-width="2" />
    </ns0:g>
    <ns0:text x="230" y="15" font-family="Arial" font-size="14" font-weight="normal" fill="#000">704</ns0:text>
  </ns0:g>

  <!-- Legend 706 -->
  <ns0:g transform="translate(325 460)">
    <ns0:rect x="0" y="0" width="220" height="100" fill="none" stroke="#000" stroke-width="1.5" />
    <ns0:line x1="15" y1="35" x2="55" y2="35" stroke="#000" stroke-width="2" />
    <ns0:text x="65" y="40" font-family="Arial" font-size="10" fill="#000">Experimental</ns0:text>
    <ns0:line x1="15" y1="60" x2="55" y2="60" stroke="#000" stroke-width="1" stroke-dasharray="4,2" />
    <ns0:text x="65" y="65" font-family="Arial" font-size="10" fill="#000">Control</ns0:text>
    <ns0:text x="230" y="15" font-family="Arial" font-size="14" font-weight="normal" fill="#000">706</ns0:text>
  </ns0:g>

  <!-- Summary 708 -->
  <ns0:rect x="85" y="580" width="460" height="50" rx="4" ry="4" fill="none" stroke="#000" stroke-width="1.5" />
  <ns0:text x="315" y="610" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">All 5 falsifiable claims validated — System self-sustaining</ns0:text>
  <ns0:text x="555" y="595" font-family="Arial" font-size="14" font-weight="normal" fill="#000">708</ns0:text>

  <ns0:text x="306" y="700" font-family="Arial" font-size="18" font-weight="normal" text-anchor="middle" fill="#000">FIG. 7</ns0:text>
</ns0:svg>
