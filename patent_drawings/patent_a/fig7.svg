<svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792">
  <rect width="100%" height="100%" fill="#fff" />
  <text x="306" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">Sheet 7 of 8</text>

  <!-- Claims validation table 700 -->
  <g transform="translate(85 120)">
    <rect x="0" y="0" width="450" height="200" fill="none" stroke="#000" stroke-width="1.5" />
    <!-- Header row -->
    <line x1="0" y1="40" x2="450" y2="40" stroke="#000" stroke-width="1" />
    <!-- Column dividers -->
    <line x1="80" y1="0" x2="80" y2="200" stroke="#000" stroke-width="0.8" />
    <line x1="280" y1="0" x2="280" y2="200" stroke="#000" stroke-width="0.8" />
    <line x1="380" y1="0" x2="380" y2="200" stroke="#000" stroke-width="0.8" />
    <!-- Row dividers -->
    <line x1="0" y1="72" x2="450" y2="72" stroke="#000" stroke-width="0.8" />
    <line x1="0" y1="104" x2="450" y2="104" stroke="#000" stroke-width="0.8" />
    <line x1="0" y1="136" x2="450" y2="136" stroke="#000" stroke-width="0.8" />
    <line x1="0" y1="168" x2="450" y2="168" stroke="#000" stroke-width="0.8" />
    <!-- Headers -->
    <text x="40" y="28" font-family="Arial" font-size="11" text-anchor="middle" fill="#000">Claim</text>
    <text x="180" y="28" font-family="Arial" font-size="11" text-anchor="middle" fill="#000">Criterion</text>
    <text x="330" y="28" font-family="Arial" font-size="11" text-anchor="middle" fill="#000">Threshold</text>
    <text x="420" y="28" font-family="Arial" font-size="11" text-anchor="middle" fill="#000">Result</text>
    <!-- Data rows -->
    <text x="40" y="60" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">A</text>
    <text x="180" y="60" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Closed-loop continuity</text>
    <text x="330" y="60" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">2000 pts</text>
    <text x="420" y="60" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">PASS</text>

    <text x="40" y="92" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">B</text>
    <text x="180" y="92" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Boundedness</text>
    <text x="330" y="92" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">finite</text>
    <text x="420" y="92" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">PASS</text>

    <text x="40" y="124" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">C</text>
    <text x="180" y="124" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Noise robustness</text>
    <text x="330" y="124" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">std &lt;= 45</text>
    <text x="420" y="124" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">PASS</text>

    <text x="40" y="156" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">D</text>
    <text x="180" y="156" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Input-output gain</text>
    <text x="330" y="156" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">corr &gt;= 0.2</text>
    <text x="420" y="156" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">PASS</text>

    <text x="40" y="188" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">E</text>
    <text x="180" y="188" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Saturation ratio</text>
    <text x="330" y="188" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">&lt;= 0.20</text>
    <text x="420" y="188" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">PASS</text>

    <text x="425" y="15" font-family="Arial" font-size="14" font-weight="normal" fill="#000">700</text>
  </g>

  <!-- Energy comparison table 702 -->
  <g transform="translate(85 340)">
    <rect x="0" y="0" width="450" height="100" fill="none" stroke="#000" stroke-width="1.5" />
    <line x1="0" y1="35" x2="450" y2="35" stroke="#000" stroke-width="1" />
    <line x1="160" y1="0" x2="160" y2="100" stroke="#000" stroke-width="0.8" />
    <line x1="310" y1="0" x2="310" y2="100" stroke="#000" stroke-width="0.8" />
    <!-- Headers -->
    <text x="80" y="24" font-family="Arial" font-size="11" text-anchor="middle" fill="#000">Configuration</text>
    <text x="235" y="24" font-family="Arial" font-size="11" text-anchor="middle" fill="#000">Energy @ 2000</text>
    <text x="385" y="24" font-family="Arial" font-size="11" text-anchor="middle" fill="#000">Status</text>
    <!-- Data -->
    <text x="80" y="58" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Control (CLI)</text>
    <text x="235" y="58" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">-4697 mWh</text>
    <text x="385" y="58" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">DEAD</text>
    <text x="80" y="82" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Experimental (MCP)</text>
    <text x="235" y="82" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">100.0 mWh</text>
    <text x="385" y="82" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">ALIVE</text>
    <text x="425" y="15" font-family="Arial" font-size="14" font-weight="normal" fill="#000">702</text>
  </g>

  <!-- Energy trajectory graph 704 -->
  <g transform="translate(85 460)">
    <rect x="0" y="0" width="220" height="100" fill="none" stroke="#000" stroke-width="1.5" />
    <g transform="translate(25 15)">
      <line x1="0" y1="70" x2="170" y2="70" stroke="#000" stroke-width="1" />
      <line x1="0" y1="0" x2="0" y2="75" stroke="#000" stroke-width="1" />
      <!-- Control trajectory (dashed, goes down) -->
      <path d="M0,35 Q42,50 85,60 T170,68" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4,2" />
      <!-- Experimental trajectory (solid, stays up) -->
      <path d="M0,35 Q42,25 85,20 T170,10" fill="none" stroke="#000" stroke-width="2" />
    </g>
    <text x="230" y="15" font-family="Arial" font-size="14" font-weight="normal" fill="#000">704</text>
  </g>

  <!-- Legend 706 -->
  <g transform="translate(325 460)">
    <rect x="0" y="0" width="210" height="100" fill="none" stroke="#000" stroke-width="1.5" />
    <line x1="15" y1="35" x2="55" y2="35" stroke="#000" stroke-width="2" />
    <text x="65" y="40" font-family="Arial" font-size="10" fill="#000">Experimental</text>
    <line x1="15" y1="60" x2="55" y2="60" stroke="#000" stroke-width="1" stroke-dasharray="4,2" />
    <text x="65" y="65" font-family="Arial" font-size="10" fill="#000">Control</text>
    <text x="185" y="15" font-family="Arial" font-size="14" font-weight="normal" fill="#000">706</text>
  </g>

  <!-- Summary 708 -->
  <rect x="85" y="580" width="450" height="50" rx="4" ry="4" fill="none" stroke="#000" stroke-width="1.5" />
  <text x="315" y="610" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">All 5 falsifiable claims validated — System self-sustaining</text>
  <text x="510" y="595" font-family="Arial" font-size="14" font-weight="normal" fill="#000">708</text>

  <text x="306" y="700" font-family="Arial" font-size="18" font-weight="normal" text-anchor="middle" fill="#000">FIG. 7</text>
</svg>
