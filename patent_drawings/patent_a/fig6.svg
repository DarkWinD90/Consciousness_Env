<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />

  <!-- Sheet number -->
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="black">6/8</text>

  <g transform="translate(0, 50)">

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- MICROCONTROLLER (108) — central block                  -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="300" y="280" width="200" height="200" fill="none" stroke="black" stroke-width="2" />
    <text x="400" y="370" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="black">MICRO-</text>
    <text x="400" y="390" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="black">CONTROLLER</text>
    <!-- Ref 108 -->
    <text x="510" y="295" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">108</text>
    <line x1="508" y1="295" x2="502" y2="288" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- THERMISTOR (110) — top left, temperature sensing       -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- Ellipse body with top and bottom leads -->
    <line x1="205" y1="110" x2="205" y2="125" stroke="black" stroke-width="1.5" />
    <ellipse cx="205" cy="150" rx="45" ry="25" fill="none" stroke="black" stroke-width="1.5" />
    <line x1="205" y1="175" x2="205" y2="190" stroke="black" stroke-width="1.5" />
    <text x="205" y="156" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">THERMISTOR</text>
    <!-- Ref 110 -->
    <text x="145" y="135" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">110</text>
    <line x1="148" y1="135" x2="160" y2="142" stroke="black" stroke-width="0.5" />

    <!-- Arrow: Thermistor → MCU (ADC) -->
    <line x1="205" y1="190" x2="205" y2="240" stroke="black" stroke-width="1.5" />
    <line x1="205" y1="240" x2="350" y2="240" stroke="black" stroke-width="1.5" />
    <line x1="350" y1="240" x2="350" y2="280" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
    <text x="275" y="235" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">ADC</text>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- PHOTORESISTOR (114) — top right, light sensing         -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- Circle body with wavy line inside and light arrows -->
    <circle cx="600" cy="150" r="30" fill="none" stroke="black" stroke-width="1.5" />
    <!-- Wavy line inside circle -->
    <path d="M585,150 Q590,140 595,150 Q600,160 605,150 Q610,140 615,150" fill="none" stroke="black" stroke-width="1" />
    <!-- Light arrows pointing at circle -->
    <line x1="555" y1="125" x2="572" y2="138" stroke="black" stroke-width="1" marker-end="url(#ah)" />
    <line x1="555" y1="140" x2="572" y2="148" stroke="black" stroke-width="1" marker-end="url(#ah)" />
    <text x="600" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">PHOTO-</text>
    <text x="600" y="216" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">RESISTOR</text>
    <!-- Ref 114 -->
    <text x="635" y="135" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">114</text>
    <line x1="633" y1="135" x2="630" y2="140" stroke="black" stroke-width="0.5" />

    <!-- Arrow: Photoresistor → MCU (ADC) -->
    <line x1="600" y1="180" x2="600" y2="240" stroke="black" stroke-width="1.5" />
    <line x1="600" y1="240" x2="450" y2="240" stroke="black" stroke-width="1.5" />
    <line x1="450" y1="240" x2="450" y2="280" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
    <text x="530" y="235" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">ADC</text>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- MOTOR (16) — right side, driven by PWM                 -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- Rectangle with internal motor arc symbol -->
    <rect x="580" y="340" width="120" height="60" fill="none" stroke="black" stroke-width="1.5" />
    <circle cx="640" cy="370" r="22" fill="none" stroke="black" stroke-width="1" />
    <text x="640" y="376" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">MOTOR</text>
    <!-- Ref 16 -->
    <text x="705" y="355" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">16</text>
    <line x1="703" y1="355" x2="700" y2="358" stroke="black" stroke-width="0.5" />

    <!-- Arrow: MCU → Motor (PWM) -->
    <line x1="500" y1="370" x2="580" y2="370" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
    <text x="540" y="365" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">PWM</text>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- PIEZOELECTRIC ELEMENT (22) — below motor               -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- Double concentric circles for piezoelectric element -->
    <circle cx="640" cy="490" r="35" fill="none" stroke="black" stroke-width="1.5" />
    <circle cx="640" cy="490" r="25" fill="none" stroke="black" stroke-width="1.5" />
    <text x="640" y="486" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="black">PIEZO</text>
    <text x="640" y="500" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">ELEMENT</text>
    <!-- Ref 22 -->
    <text x="680" y="475" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">22</text>
    <line x1="678" y1="475" x2="675" y2="480" stroke="black" stroke-width="0.5" />

    <!-- Arrow: Motor → Piezo (mechanical coupling) -->
    <line x1="640" y1="400" x2="640" y2="455" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- AC SIGNAL (72) — from piezo to energy path             -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="380" y="460" width="120" height="60" fill="none" stroke="black" stroke-width="1.5" />
    <text x="440" y="496" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">AC SIGNAL</text>
    <!-- Ref 72 -->
    <text x="375" y="455" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">72</text>
    <line x1="378" y1="455" x2="380" y2="462" stroke="black" stroke-width="0.5" />

    <!-- Arrow: Piezo → AC Signal -->
    <line x1="605" y1="490" x2="500" y2="490" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- ENERGY STORE (28) — bottom center                      -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- Rectangle with internal parallel plate lines (capacitor bank) -->
    <rect x="220" y="580" width="150" height="60" fill="none" stroke="black" stroke-width="1.5" />
    <line x1="280" y1="590" x2="280" y2="630" stroke="black" stroke-width="2" />
    <line x1="310" y1="590" x2="310" y2="630" stroke="black" stroke-width="2" />
    <text x="295" y="616" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">ENERGY STORE</text>
    <!-- Ref 28 -->
    <text x="375" y="595" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">28</text>
    <line x1="373" y1="595" x2="370" y2="598" stroke="black" stroke-width="0.5" />

    <!-- Arrow: AC Signal → Energy Store -->
    <line x1="440" y1="520" x2="440" y2="560" stroke="black" stroke-width="1.5" />
    <line x1="440" y1="560" x2="295" y2="560" stroke="black" stroke-width="1.5" />
    <line x1="295" y1="560" x2="295" y2="580" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- Arrow: Energy Store → MCU (VSYS power) — routed at x=130 to clear LED box -->
    <line x1="220" y1="610" x2="130" y2="610" stroke="black" stroke-width="1.5" />
    <line x1="130" y1="610" x2="130" y2="380" stroke="black" stroke-width="1.5" />
    <line x1="130" y1="380" x2="300" y2="380" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
    <text x="118" y="500" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">VSYS</text>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- CONTROL LOGIC (26) — inside MCU or as sub-block        -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- Diamond shape (dashed) for control logic -->
    <polygon points="400,305 475,330 400,355 325,330" fill="none" stroke="black" stroke-width="1" stroke-dasharray="5,3" />
    <text x="400" y="335" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">CONTROL LOGIC</text>
    <!-- Ref 26 -->
    <text x="475" y="325" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">26</text>
    <line x1="473" y1="325" x2="470" y2="328" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- LED INDICATOR (112) — bottom left                      -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- Square with internal circle for LED -->
    <rect x="175" y="460" width="60" height="60" fill="none" stroke="black" stroke-width="1.5" />
    <circle cx="205" cy="490" r="22" fill="none" stroke="black" stroke-width="1" />
    <text x="205" y="496" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">LED</text>
    <!-- Ref 112 -->
    <text x="165" y="475" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">112</text>
    <line x1="168" y1="475" x2="175" y2="480" stroke="black" stroke-width="0.5" />

    <!-- Arrow: MCU → LED (GPIO) -->
    <line x1="300" y1="440" x2="205" y2="440" stroke="black" stroke-width="1.5" />
    <line x1="205" y1="440" x2="205" y2="460" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
    <text x="255" y="435" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">GPIO</text>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- LEGEND                                                 -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="200" y="700" width="400" height="80" fill="none" stroke="black" stroke-width="1" />
    <text x="215" y="725" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">CONNECTIONS:</text>
    <line x1="215" y1="745" x2="275" y2="745" stroke="black" stroke-width="1.5" />
    <text x="285" y="750" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">Signal/power</text>
    <line x1="400" y1="745" x2="460" y2="745" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" />
    <text x="470" y="750" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">Internal</text>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- FIGURE LABEL                                           -->
    <!-- ══════════════════════════════════════════════════════ -->
    <text x="425" y="920" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="black">FIG. 6</text>

  </g>
</svg>
