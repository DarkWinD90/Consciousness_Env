<svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792">
  <rect width="100%" height="100%" fill="#fff" />
  <text x="306" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">Sheet 6 of 8</text>
  
  <!-- 600: Microcontroller (Raspberry Pi Pico) -->
  <g transform="translate(230 260)"><rect width="150" height="90" rx="3" ry="3" fill="none" stroke="#000" stroke-width="1.5" /><rect x="45" y="25" width="60" height="45" rx="2" ry="2" fill="none" stroke="#000" /><text x="75" y="50" font-family="Arial" font-size="9" text-anchor="middle" fill="#000">MCU</text><text x="75" y="-10" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">600</text></g>
  
  <!-- 602: Piezo disc (sensor) -->
  <g transform="translate(100 150)"><circle cx="28" cy="28" r="24" fill="none" stroke="#000" stroke-width="1.5" /><circle cx="28" cy="28" r="14" fill="none" stroke="#000" /><text x="28" y="-10" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">602</text></g>
  
  <!-- 604: Servo motor -->
  <g transform="translate(420 150)"><rect y="8" width="50" height="32" rx="2" ry="2" fill="none" stroke="#000" stroke-width="1.5" /><circle cx="12" cy="24" r="8" fill="none" stroke="#000" stroke-width="1.5" /><text x="60" y="20" font-family="Arial" font-size="14" font-weight="normal" fill="#000">604</text></g>
  
  <!-- 606: Thermistor -->
  <g transform="translate(100 400)"><ellipse cx="18" cy="20" rx="12" ry="16" fill="none" stroke="#000" stroke-width="1.5" /><path stroke="#000" stroke-width="1.5" d="M10 36v15m16-19v19" /><text x="18" y="70" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">606</text></g>
  
  <!-- 608: LED indicator -->
  <g transform="translate(380 400)"><rect width="30" height="30" fill="none" stroke="#000" stroke-width="1.5" /><circle cx="15" cy="15" r="5" stroke="#000" /><path d="M15 20v8M10 28h10" stroke="#000" stroke-width="1" /><text x="15" y="50" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">608</text></g>
  
  <!-- 610: Photoresistor (LDR) -->
  <g transform="translate(270 400)"><circle cx="18" cy="20" r="15" fill="none" stroke="#000" stroke-width="1.5" /><path d="M8 15q5-5 10 0t10 0" fill="none" stroke="#000" stroke-width=".8" /><path d="M3 5l10 10M8 3l10 10" stroke="#000" stroke-width="0.8" /><text x="18" y="55" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">610</text></g>
  
  <!-- 612: AC signal input -->
  <g transform="translate(100 260)"><path d="M0 15q8-15 16 0t16 0 16 0 16 0" fill="none" stroke="#000" stroke-width="1.5" /><text x="32" y="45" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">612</text></g>
  
  <!-- 614: Control logic -->
  <g transform="translate(200 500)"><path fill="none" stroke="#000" stroke-width="1.5" d="m32 0 32 25-32 25-32-25z" /><text x="32" y="70" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">614</text></g>
  
  <!-- 616: Energy storage (capacitor bank) -->
  <g transform="translate(460 280)"><rect x="4" y="5" width="40" height="45" fill="none" stroke="#000" stroke-width="1.5" /><path d="M12 5v45M32 5v45" stroke="#000" stroke-width="1.5" /><text x="24" y="70" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">616</text></g>
  
  <!-- Arrow marker -->
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#000" /></marker></defs>
  
  <!-- SIGNAL FLOW ARROWS -->
  <!-- 602 → 600: Piezo ADC input (GP26) -->
  <path d="M152 178h78v82" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" fill="none" />
  <text x="175" y="195" font-family="Arial" font-size="9" fill="#000">ADC0</text>
  
  <!-- 612 → 600: AC signal input -->
  <path d="M164 275h66" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" fill="none" />
  
  <!-- 600 → 604: PWM to servo -->
  <path d="M380 290h40v-105" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" fill="none" />
  <text x="400" y="230" font-family="Arial" font-size="9" fill="#000">PWM</text>
  
  <!-- 606 → 600: Thermistor ADC input (GP27) -->
  <path d="M136 420h94v-60" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" fill="none" />
  <text x="145" y="390" font-family="Arial" font-size="9" fill="#000">ADC1</text>
  
  <!-- 610 → 600: LDR ADC input (GP28) -->
  <path d="M288 400v-40" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" fill="none" />
  <text x="295" y="385" font-family="Arial" font-size="9" fill="#000">ADC2</text>
  
  <!-- 600 → 608: LED GPIO output -->
  <path d="M350 350h30v50" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" fill="none" />
  <text x="355" y="380" font-family="Arial" font-size="9" fill="#000">GPIO</text>
  
  <!-- 616 → 600: Power supply (VSYS) -->
  <path d="M460 305h-60" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" fill="none" />
  <text x="410" y="300" font-family="Arial" font-size="9" fill="#000">VSYS</text>
  
  <!-- 614 → 600: Control feedback -->
  <path d="M232 525h-30v-155h28" stroke="#000" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrow)" fill="none" />
  
  <!-- 604 → 602: Mechanical coupling (motor to piezo) -->
  <path d="M420 182h-200v-45h-72" stroke="#000" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow)" fill="none" />
  
  <!-- Energy feedback loop -->
  <path d="M500 330v190H268" stroke="#000" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)" fill="none" />
  <text x="510" y="420" font-family="Arial" font-size="9" fill="#000">Energy</text>
  <text x="510" y="432" font-family="Arial" font-size="9" fill="#000">Loop</text>
  
  <text x="306" y="700" font-family="Arial" font-size="18" font-weight="normal" text-anchor="middle" fill="#000">FIG. 6</text>
</svg>
