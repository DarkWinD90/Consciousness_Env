<svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792">
  <rect width="100%" height="100%" fill="#fff" />
  <text x="306" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">Sheet 2 of 8</text>
  
  <!-- Y-axis (Energy) -->
  <path d="M100 150v300" stroke="#000" stroke-width="1.5" />
  <text x="85" y="145" font-family="Arial" font-size="14" font-weight="normal" fill="#000">200</text>
  
  <!-- X-axis (Time) -->
  <path d="M100 450h400" stroke="#000" stroke-width="1.5" />
  <text x="510" y="455" font-family="Arial" font-size="14" font-weight="normal" fill="#000">202</text>
  
  <!-- Zero baseline -->
  <path d="M100 300h400" stroke="#000" stroke-width="0.8" stroke-dasharray="2,2" />
  <text x="80" y="305" font-family="Arial" font-size="12" fill="#000">0</text>
  <text x="75" y="280" font-family="Arial" font-size="14" font-weight="normal" fill="#000">208</text>
  
  <!-- Experimental curve (solid, rising) - MCP path succeeds -->
  <path d="M100 300 Q 200 280, 300 200 Q 400 150, 480 140" fill="none" stroke="#000" stroke-width="2.5" />
  <text x="490" y="145" font-family="Arial" font-size="14" font-weight="normal" fill="#000">204</text>
  <text x="490" y="165" font-family="Arial" font-size="12" fill="#000">210</text>
  
  <!-- Control curve (dashed, falling) - CLI path fails -->
  <path d="M100 300 Q 200 350, 300 400 Q 400 430, 480 450" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="8,4" />
  <text x="490" y="445" font-family="Arial" font-size="14" font-weight="normal" fill="#000">212</text>
  <text x="490" y="465" font-family="Arial" font-size="12" fill="#000">218</text>
  
  <!-- Origin point -->
  <circle cx="100" cy="300" r="5" fill="none" stroke="#000" stroke-width="2" />
  <text x="110" y="320" font-family="Arial" font-size="14" font-weight="normal" fill="#000">206</text>
  
  <!-- Legend box 214: Experimental -->
  <rect x="100" y="520" width="180" height="50" fill="none" stroke="#000" stroke-width="1" />
  <path d="M115 545h50" stroke="#000" stroke-width="2.5" />
  <text x="175" y="550" font-family="Arial" font-size="11" fill="#000">Experimental (MCP)</text>
  <text x="140" y="565" font-family="Arial" font-size="10" fill="#000">+100.0 mWh @ 2000</text>
  <text x="290" y="540" font-family="Arial" font-size="14" font-weight="normal" fill="#000">214</text>
  
  <!-- Legend box 216: Control -->
  <rect x="300" y="520" width="180" height="50" fill="none" stroke="#000" stroke-width="1" />
  <path d="M315 545h50" stroke="#000" stroke-width="1.5" stroke-dasharray="8,4" />
  <text x="375" y="550" font-family="Arial" font-size="11" fill="#000">Control (CLI)</text>
  <text x="340" y="565" font-family="Arial" font-size="10" fill="#000">-4697 mWh @ 2000</text>
  <text x="490" y="540" font-family="Arial" font-size="14" font-weight="normal" fill="#000">216</text>
  
  <text x="306" y="700" font-family="Arial" font-size="18" font-weight="normal" text-anchor="middle" fill="#000">FIG. 2</text>
</svg>
