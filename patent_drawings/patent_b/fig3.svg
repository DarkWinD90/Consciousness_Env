<svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792">
  <rect width="100%" height="100%" fill="#fff" />
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>
  <text x="306" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">Sheet 3 of 6</text>

  <!-- 302: External Cognitive Control (cloud-like shape at top left) -->
  <rect x="100" y="100" width="160" height="60" rx="10" fill="none" stroke="#000" stroke-width="1.5" />
  <text x="180" y="125" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">EXTERNAL</text>
  <text x="180" y="137" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">COGNITIVE</text>
  <text x="180" y="149" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">CONTROL</text>
  <text x="270" y="115" font-family="Arial" font-size="14" font-weight="normal" fill="#000">302</text>
  <line x1="268" y1="118" x2="260" y2="125" stroke="black" stroke-width="0.5" />

  <!-- 306: Energy State Monitor (top right) -->
  <rect x="352" y="100" width="160" height="60" rx="5" fill="none" stroke="#000" stroke-width="1.5" />
  <text x="432" y="125" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">ENERGY STATE</text>
  <text x="432" y="137" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">MONITOR</text>
  <text x="432" y="152" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">(reads energy_mwh)</text>
  <text x="510" y="115" font-family="Arial" font-size="14" font-weight="normal" fill="#000">306</text>
  <line x1="510" y1="118" x2="512" y2="125" stroke="black" stroke-width="0.5" />

  <!-- Arrows down to computation block -->
  <path d="M180 160v40l26 30" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" fill="none" />
  <path d="M432 160v40l-26 30" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" fill="none" />
  <text x="115" y="175" font-family="Arial" font-size="10" fill="#000">modulation</text>
  <text x="445" y="175" font-family="Arial" font-size="10" fill="#000">energy-aware</text>

  <!-- 300: Reflection Coefficient Computation (center bold) -->
  <rect x="206" y="230" width="200" height="80" rx="5" fill="none" stroke="#000" stroke-width="2" />
  <text x="306" y="250" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">REFLECTION COEFF</text>
  <text x="306" y="265" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">COMPUTATION</text>
  <text x="306" y="285" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">r = base + mod x sens</text>
  <text x="306" y="300" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">(base=0.2, sens=0.1)</text>
  <text x="416" y="265" font-family="Arial" font-size="14" font-weight="normal" fill="#000">300</text>
  <line x1="414" y1="265" x2="406" y2="265" stroke="black" stroke-width="0.5" />

  <!-- 312: Source Priority (circle in center computation) -->
  <circle cx="306" cy="410" r="25" fill="none" stroke="#000" stroke-width="1.5" />
  <text x="306" y="407" font-family="Arial" font-size="9" text-anchor="middle" fill="#000">PRIORITY</text>
  <text x="306" y="418" font-family="Arial" font-size="9" text-anchor="middle" fill="#000">Ext &gt; Int</text>
  <text x="350" y="438" font-family="Arial" font-size="14" font-weight="normal" fill="#000">312</text>
  <line x1="345" y1="435" x2="331" y2="430" stroke="black" stroke-width="0.5" />

  <!-- 310: Output arrow -->
  <path d="M306 310v75" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="245" y="345" font-family="Arial" font-size="10" fill="#000">refl_coeff</text>
  <text x="235" y="365" font-family="Arial" font-size="14" font-weight="normal" fill="#000">310</text>
  <line x1="260" y1="358" x2="296" y2="340" stroke="black" stroke-width="0.5" />

  <!-- 314: Arrow to SNN (from priority) -->
  <path d="M306 435v30" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="320" y="455" font-family="Arial" font-size="10" fill="#000">to SNN</text>
  <text x="320" y="475" font-family="Arial" font-size="14" font-weight="normal" fill="#000">314</text>
  <line x1="320" y1="468" x2="320" y2="465" stroke="black" stroke-width="0.5" />

  <!-- 304: External Modulation Examples (bottom left dashed) -->
  <rect x="100" y="500" width="160" height="80" rx="5" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4,2" />
  <text x="180" y="520" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">External Examples</text>
  <text x="180" y="535" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">-0.5: focus outward</text>
  <text x="180" y="548" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">0.0: neutral (base)</text>
  <text x="180" y="561" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">+0.8: increase self-obs</text>
  <text x="270" y="515" font-family="Arial" font-size="14" font-weight="normal" fill="#000">304</text>
  <line x1="268" y1="515" x2="260" y2="515" stroke="black" stroke-width="0.5" />

  <!-- 308: Energy Rules (bottom right dashed) -->
  <rect x="352" y="500" width="160" height="80" rx="5" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4,2" />
  <text x="432" y="520" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Energy Rules</text>
  <text x="432" y="535" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">&lt;15 mWh: -0.4</text>
  <text x="432" y="548" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">&lt;30 mWh: -0.1</text>
  <text x="432" y="561" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">&gt;80 mWh: +0.3</text>
  <text x="432" y="574" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">else: 0.0</text>
  <text x="520" y="510" font-family="Arial" font-size="14" font-weight="normal" fill="#000">308</text>
  <line x1="518" y1="513" x2="514" y2="520" stroke="black" stroke-width="0.5" />

  <!-- Arrows from detail boxes back up -->
  <path d="M180 500v-170l26-20" stroke="#000" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)" fill="none" />
  <path d="M432 500v-170l-26-20" stroke="#000" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)" fill="none" />


  <text x="306" y="650" font-family="Arial" font-size="18" font-weight="normal" text-anchor="middle" fill="#000">FIG. 3</text>
</svg>
