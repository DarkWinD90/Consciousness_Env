<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">3/6</text>

  <!-- Title -->
  <text x="425" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">DYNAMIC MODULATION SOURCES</text>
  <text x="425" y="130" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Two Pathways Controlling Reflection Coefficient</text>

  <!-- EXTERNAL COGNITIVE CONTROL LAYER (302) - Cloud shape -->
  <path d="M200,170 Q170,150 150,170 Q130,185 140,210 Q130,235 150,250 Q170,270 200,255 H650 Q680,270 700,250 Q720,235 710,210 Q720,185 700,170 Q680,150 650,170 Q620,145 580,165 Q540,140 500,160 Q460,140 420,160 Q380,140 340,160 Q300,140 260,160 Q230,145 200,170 Z" fill="none" stroke="black" stroke-width="2"/>
  <text x="425" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">EXTERNAL COGNITIVE CONTROL LAYER</text>
  <text x="425" y="225" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Claude or other cognitive agent provides modulation</text>
  <text x="690" y="185" font-family="Arial, sans-serif" font-size="14" text-anchor="end">302</text>

  <!-- Arrow down from External to Computation -->
  <line x1="300" y1="256" x2="300" y2="320" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="315" y="292" font-family="Courier New, monospace" font-size="14" text-anchor="start">modulation (-1.0 to +1.0)</text>

  <!-- REFLECTION COEFFICIENT COMPUTATION (300) - Main box -->
  <rect x="150" y="320" width="550" height="130" rx="5" fill="none" stroke="black" stroke-width="3"/>
  <text x="425" y="355" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">REFLECTION COEFFICIENT COMPUTATION</text>
  <text x="425" y="390" font-family="Courier New, monospace" font-size="14" text-anchor="middle">reflection_coeff = base_coeff + modulation x sensitivity</text>
  <text x="425" y="420" font-family="Courier New, monospace" font-size="14" text-anchor="middle">base_coeff = 0.2, sensitivity = 0.1</text>
  <text x="690" y="335" font-family="Arial, sans-serif" font-size="14" text-anchor="end">300</text>

  <!-- Arrow up from Energy Monitor to Computation -->
  <line x1="550" y1="510" x2="550" y2="450" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="565" y="480" font-family="Courier New, monospace" font-size="14" text-anchor="start">energy-aware</text>
  <text x="565" y="497" font-family="Courier New, monospace" font-size="14" text-anchor="start">modulation</text>

  <!-- Output arrow (310) - exiting Computation box right side -->
  <line x1="700" y1="385" x2="750" y2="385" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="750" y="375" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">310</text>
  <text x="750" y="410" font-family="Courier New, monospace" font-size="14" text-anchor="middle">to SNN</text>

  <!-- ENERGY STATE MONITOR (306) -->
  <rect x="350" y="510" width="350" height="100" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="525" y="540" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ENERGY STATE MONITOR</text>
  <text x="525" y="565" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Reads energy_mwh from EnergyHarvester</text>
  <text x="525" y="590" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Applies energy-aware modulation rules</text>
  <text x="690" y="525" font-family="Arial, sans-serif" font-size="14" text-anchor="end">306</text>


  <!-- SOURCE PRIORITY (312) -->
  <rect x="150" y="510" width="180" height="100" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="240" y="540" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SOURCE PRIORITY</text>
  <text x="240" y="565" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">External overrides</text>
  <text x="240" y="590" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Internal when active</text>
  <text x="320" y="525" font-family="Arial, sans-serif" font-size="14" text-anchor="end">312</text>

  <!-- MODULATION EXAMPLES (304) -->
  <rect x="150" y="630" width="320" height="150" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="310" y="658" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">External Modulation Examples</text>
  <text x="165" y="688" font-family="Courier New, monospace" font-size="14" text-anchor="start">-0.5: Reduce self-observation</text>
  <text x="185" y="708" font-family="Arial, sans-serif" font-size="14" text-anchor="start">(focus outward)</text>
  <text x="165" y="733" font-family="Courier New, monospace" font-size="14" text-anchor="start"> 0.0: Neutral (use base coefficient)</text>
  <text x="165" y="758" font-family="Courier New, monospace" font-size="14" text-anchor="start">+0.8: Increase self-observation</text>
  <text x="460" y="645" font-family="Arial, sans-serif" font-size="14" text-anchor="end">304</text>

  <!-- ENERGY RULES (308) -->
  <rect x="490" y="630" width="210" height="150" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="595" y="658" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Energy Rules</text>
  <text x="505" y="688" font-family="Courier New, monospace" font-size="14" text-anchor="start">&lt;15 mWh: -0.4</text>
  <text x="505" y="713" font-family="Courier New, monospace" font-size="14" text-anchor="start">&lt;30 mWh: -0.1</text>
  <text x="505" y="738" font-family="Courier New, monospace" font-size="14" text-anchor="start">&gt;80 mWh: +0.3</text>
  <text x="505" y="763" font-family="Courier New, monospace" font-size="14" text-anchor="start">else: 0.0</text>
  <text x="690" y="645" font-family="Arial, sans-serif" font-size="14" text-anchor="end">308</text>

  <!-- Figure Label -->
  <text x="425" y="1020" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">FIG. 3</text>
</svg>
