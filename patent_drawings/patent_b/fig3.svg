<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />

  <!-- Sheet number -->
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="black">3/6</text>

  <g transform="translate(0, 50)">

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- EXTERNAL COGNITIVE CONTROL (42) — top left             -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- Cloud shape for external cognitive control layer -->
    <path d="M 170 180 Q 150 180 150 165 Q 150 150 165 145 Q 160 130 175 122 Q 190 114 210 118 Q 220 108 240 108 Q 260 108 270 118 Q 285 112 300 118 Q 315 124 318 138 Q 330 140 335 150 Q 340 160 335 170 Q 340 180 330 180 Z"
          fill="none" stroke="black" stroke-width="1.5" />
    <text x="250" y="148" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">COGNITIVE</text>
    <text x="250" y="164" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">CONTROL</text>
    <!-- Ref 42 -->
    <text x="355" y="140" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">42</text>
    <line x1="353" y1="140" x2="350" y2="142" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- ENERGY STATE MONITOR (46) — top right                  -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="500" y="120" width="200" height="60" fill="none" stroke="black" stroke-width="1.5" />
    <text x="600" y="148" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">ENERGY STATE</text>
    <text x="600" y="166" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">MONITOR</text>
    <!-- Ref 46 -->
    <text x="710" y="140" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">46</text>
    <line x1="708" y1="140" x2="702" y2="142" stroke="black" stroke-width="0.5" />

    <!-- Arrows: Cognitive Control → Computation -->
    <line x1="250" y1="180" x2="250" y2="220" stroke="black" stroke-width="1.5" />
    <line x1="250" y1="220" x2="350" y2="220" stroke="black" stroke-width="1.5" />
    <line x1="350" y1="220" x2="350" y2="260" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- Arrow: Energy Monitor → Computation -->
    <line x1="600" y1="180" x2="600" y2="220" stroke="black" stroke-width="1.5" />
    <line x1="600" y1="220" x2="500" y2="220" stroke="black" stroke-width="1.5" />
    <line x1="500" y1="220" x2="500" y2="260" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- REFLECTION COEFFICIENT COMPUTATION (40) — center       -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="300" y="260" width="250" height="70" fill="none" stroke="black" stroke-width="2" />
    <text x="425" y="292" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">REFLECTION COEFF</text>
    <text x="425" y="312" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">COMPUTATION</text>
    <!-- Ref 40 -->
    <text x="560" y="278" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">40</text>
    <line x1="558" y1="278" x2="552" y2="275" stroke="black" stroke-width="0.5" />

    <!-- Arrow: Computation → Source Priority -->
    <line x1="425" y1="330" x2="425" y2="380" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SOURCE PRIORITY BOX (52)                               -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="340" y="380" width="170" height="50" fill="none" stroke="black" stroke-width="1.5" />
    <text x="425" y="410" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">SOURCE PRIORITY</text>
    <!-- Ref 52 -->
    <text x="515" y="398" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">52</text>
    <line x1="513" y1="398" x2="510" y2="400" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- OUTPUT ARROW (50)                                      -->
    <!-- ══════════════════════════════════════════════════════ -->
    <line x1="425" y1="430" x2="425" y2="480" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
    <!-- Ref 50 -->
    <text x="440" y="460" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">50</text>
    <line x1="438" y1="458" x2="427" y2="455" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- OUTPUT SIGNAL (54) — to SNN                            -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="340" y="480" width="170" height="50" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" />
    <text x="425" y="510" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">OUTPUT SIGNAL</text>
    <!-- Ref 54 -->
    <text x="515" y="498" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">54</text>
    <line x1="513" y1="498" x2="510" y2="500" stroke="black" stroke-width="0.5" />

    <!-- Arrow: Output Signal → SNN -->
    <line x1="425" y1="530" x2="425" y2="570" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SNN (14) — destination reference                       -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="340" y="570" width="170" height="50" fill="none" stroke="black" stroke-width="2" />
    <text x="425" y="600" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="black">SNN</text>
    <!-- Ref 14 -->
    <text x="515" y="588" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">14</text>
    <line x1="513" y1="588" x2="510" y2="590" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- EXTERNAL MODULATION EXAMPLES (44) — bottom left        -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="150" y="680" width="200" height="60" fill="none" stroke="black" stroke-width="1" stroke-dasharray="5,3" />
    <text x="250" y="716" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">MODULATION</text>
    <!-- Ref 44 -->
    <text x="355" y="698" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">44</text>
    <line x1="353" y1="698" x2="350" y2="700" stroke="black" stroke-width="0.5" />

    <!-- Dashed arrow from Examples to Computation -->
    <line x1="250" y1="680" x2="250" y2="295" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" />
    <line x1="250" y1="295" x2="300" y2="295" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- ENERGY RULES (48) — bottom right                       -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="500" y="680" width="200" height="60" fill="none" stroke="black" stroke-width="1" stroke-dasharray="5,3" />
    <text x="600" y="716" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">ENERGY RULES</text>
    <!-- Ref 48 -->
    <text x="710" y="698" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">48</text>
    <line x1="708" y1="698" x2="702" y2="700" stroke="black" stroke-width="0.5" />

    <!-- Dashed arrow from Rules to Computation -->
    <line x1="600" y1="680" x2="600" y2="295" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" />
    <line x1="600" y1="295" x2="550" y2="295" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- FIGURE LABEL                                           -->
    <!-- ══════════════════════════════════════════════════════ -->
    <text x="425" y="920" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="black">FIG. 3</text>

  </g>
</svg>
