<svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792">
  <rect width="100%" height="100%" fill="#fff" />
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>
  <text x="306" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">Sheet 6 of 6</text>

  <!-- 600: Environmental Input (top) -->
  <rect x="200" y="100" width="212" height="40" rx="5" fill="none" stroke="#000" stroke-width="1.5" />
  <text x="306" y="125" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">ENVIRONMENTAL INPUT</text>
  <text x="420" y="125" font-family="Arial" font-size="14" font-weight="normal" fill="#000">600</text>

  <!-- Arrow down to SNN -->
  <path d="M306 140v50" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- 602: Neuromorphic Core (SNN) - bold -->
  <g transform="translate(180,180)">
    <rect width="252" height="60" rx="4" ry="4" fill="none" stroke="#000" stroke-width="2" />
    <text x="126" y="20" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">NEUROMORPHIC CORE (SNN)</text>
    <text x="126" y="35" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">V = V x leak + I_ext + I_refl</text>
    <circle cx="30" cy="42" r="4" stroke="#000" />
    <circle cx="60" cy="42" r="4" stroke="#000" />
    <circle cx="220" cy="42" r="4" stroke="#000" />
    <path d="M90 42h110" stroke="#000" stroke-dasharray="2,2" />
    <text x="260" y="-10" font-family="Arial" font-size="14" font-weight="normal" fill="#000">602</text>
  </g>

  <!-- Arrows down to 604 and 606 -->
  <path d="M306 240v60" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- 604: Self-Observation (left) -->
  <rect x="180" y="290" width="120" height="50" rx="5" fill="none" stroke="#000" stroke-width="1.5" />
  <text x="240" y="312" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">SELF-</text>
  <text x="240" y="325" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">OBSERVATION</text>
  <text x="310" y="305" font-family="Arial" font-size="14" font-weight="normal" fill="#000">604</text>

  <!-- 606: Cognitive Modulation (right) -->
  <rect x="320" y="290" width="120" height="50" rx="5" fill="none" stroke="#000" stroke-width="1.5" />
  <text x="380" y="312" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">COGNITIVE</text>
  <text x="380" y="325" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">MODULATION</text>
  <text x="450" y="350" font-family="Arial" font-size="14" font-weight="normal" fill="#000">606</text>

  <!-- Arrow connecting 604 and 606 -->
  <path d="M300 315h30" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Arrow down to 608 -->
  <path d="M380 340v60" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- 608: Motor Actuation -->
  <g transform="translate(330,390)">
    <rect width="100" height="40" rx="2" fill="none" stroke="#000" stroke-width="1.5" />
    <text x="50" y="25" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">MOTOR</text>
    <!-- Motor symbol -->
    <circle cx="20" cy="20" r="10" stroke="#000" fill="none" />
    <text x="110" y="20" font-family="Arial" font-size="14" font-weight="normal" fill="#000">608</text>
  </g>

  <!-- Arrow down to 610 -->
  <path d="M380 430v62" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- 610: Energy Harvesting (concentric circles) -->
  <g transform="translate(354,480)">
    <circle cx="26" cy="26" r="24" fill="none" stroke="#000" stroke-width="1.5" />
    <circle cx="26" cy="26" r="14" stroke="#000" />
    <text x="26" y="30" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">ENERGY</text>
    <text x="60" y="60" font-family="Arial" font-size="14" font-weight="normal" fill="#000">610</text>
  </g>

  <!-- SELF-OBS LOOP: 604 back to 602 (short dashes, bold, left side) -->
  <path d="M180 315h-40V210h50" stroke="#000" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrow)" fill="none" />
  <text x="115" y="265" font-family="Arial" font-size="10" font-weight="bold" fill="#000" transform="rotate(-90 115 265)">SELF-OBS</text>

  <!-- ENERGY LOOP: 610 back to 602 (long dashes, right side) -->
  <path d="M404 506h80V210h-62" stroke="#000" stroke-width="1.5" stroke-dasharray="8,4" marker-end="url(#arrow)" fill="none" />
  <text x="495" y="360" font-family="Arial" font-size="10" fill="#000" transform="rotate(90 495 360)">ENERGY</text>

  <!-- Feedback from 606 back (cognitive control dashed) -->
  <path d="M440 310h30V210h-48" stroke="#000" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)" fill="none" />

  <!-- Legend box -->
  <rect x="100" y="570" width="412" height="70" fill="none" stroke="#000" stroke-width="1" />
  <text x="120" y="590" font-family="Arial" font-size="10" fill="#000">Legend:</text>
  <path d="M120 605h40" stroke="#000" stroke-width="2.5" stroke-dasharray="6,3" />
  <text x="170" y="608" font-family="Arial" font-size="10" fill="#000">Self-Observation Loop (Patent B - THIS PATENT)</text>
  <path d="M120 625h40" stroke="#000" stroke-width="1.5" stroke-dasharray="8,4" />
  <text x="170" y="628" font-family="Arial" font-size="10" fill="#000">Energy Feedback Loop (Patent A)</text>


  <text x="306" y="700" font-family="Arial" font-size="18" font-weight="normal" text-anchor="middle" fill="#000">FIG. 6</text>
