<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">6/6</text>
  <g transform="translate(0, 50)">
    <text x="425" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">END-TO-END SIGNAL FLOW</text>
    <text x="425" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Self-Observation Integration</text>

    <!-- Environmental Sensors (600) -->
    <rect x="150" y="200" width="100" height="50" rx="5" fill="none" stroke="black" stroke-width="2"/>
    <text x="200" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Environmental</text>
    <text x="200" y="238" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Sensors</text>
    <text x="200" y="175" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">600</text>
    <line x1="200" y1="178" x2="200" y2="200" stroke="black" stroke-width="0.5"/>

    <!-- Arrow: Sensors to SNN -->
    <line x1="250" y1="225" x2="300" y2="225" stroke="black" stroke-width="2" marker-end="url(#ah)"/>

    <!-- Spiking Neural Network (602) - Main Hub -->
    <rect x="300" y="170" width="180" height="110" rx="5" fill="none" stroke="black" stroke-width="3"/>
    <text x="390" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Spiking Neural Network</text>
    <text x="390" y="220" font-family="Courier New, monospace" font-size="14" text-anchor="middle">V = V×leak + I</text>
    <text x="390" y="240" font-family="Courier New, monospace" font-size="14" text-anchor="middle">+ I_refl + I_syn</text>
    <text x="390" y="148" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">602</text>
    <line x1="390" y1="151" x2="390" y2="170" stroke="black" stroke-width="0.5"/>

    <!-- Arrow: SNN to Cognitive Modulation -->
    <line x1="480" y1="225" x2="530" y2="225" stroke="black" stroke-width="2" marker-end="url(#ah)"/>

    <!-- Cognitive Modulation (604) -->
    <rect x="530" y="190" width="100" height="70" rx="5" fill="none" stroke="black" stroke-width="2"/>
    <text x="580" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Cognitive</text>
    <text x="580" y="233" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Modulation</text>
    <text x="580" y="250" font-family="Courier New, monospace" font-size="14" text-anchor="middle">refl_coeff</text>
    <text x="660" y="210" font-family="Arial, sans-serif" font-size="14" text-anchor="start">604</text>
    <line x1="658" y1="210" x2="630" y2="220" stroke="black" stroke-width="0.5"/>

    <!-- Arrow: Cognitive to Motor -->
    <line x1="580" y1="260" x2="580" y2="300" stroke="black" stroke-width="2" marker-end="url(#ah)"/>

    <!-- Motor Actuator (606) -->
    <rect x="530" y="300" width="100" height="50" rx="5" fill="none" stroke="black" stroke-width="2"/>
    <text x="580" y="322" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Motor</text>
    <text x="580" y="340" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Actuator</text>
    <text x="660" y="320" font-family="Arial, sans-serif" font-size="14" text-anchor="start">606</text>
    <line x1="658" y1="318" x2="630" y2="325" stroke="black" stroke-width="0.5"/>

    <!-- Arrow: Motor to Energy Harvester -->
    <line x1="580" y1="350" x2="580" y2="390" stroke="black" stroke-width="2" marker-end="url(#ah)"/>

    <!-- Energy Harvester (608) -->
    <rect x="530" y="390" width="100" height="50" rx="5" fill="none" stroke="black" stroke-width="2"/>
    <text x="580" y="412" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Energy</text>
    <text x="580" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Harvester</text>
    <text x="660" y="410" font-family="Arial, sans-serif" font-size="14" text-anchor="start">608</text>
    <line x1="658" y1="408" x2="630" y2="415" stroke="black" stroke-width="0.5"/>

    <!-- ENERGY FEEDBACK PATH (610) - Exits LEFT of Harvester, straight up to SNN -->
    <line x1="530" y1="415" x2="460" y2="415" stroke="black" stroke-width="2"/>
    <line x1="460" y1="415" x2="460" y2="280" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
    <text x="455" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="end">ENERGY</text>
    <text x="455" y="355" font-family="Arial, sans-serif" font-size="14" text-anchor="end">FEEDBACK</text>
    <text x="455" y="370" font-family="Arial, sans-serif" font-size="14" text-anchor="end">(Patent A)</text>
    <text x="455" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="end">610</text>
    <line x1="457" y1="397" x2="480" y2="415" stroke="black" stroke-width="0.5"/>

    <!-- SELF-OBSERVATION PATH (612) - Outer loop on the left -->
    <!-- Segment 1: From SNN bottom-left corner down -->
    <line x1="320" y1="280" x2="320" y2="320" stroke="black" stroke-width="3"/>

    <!-- z^-1 delay box -->
    <rect x="295" y="320" width="50" height="35" rx="5" fill="none" stroke="black" stroke-width="2"/>
    <text x="320" y="342" font-family="Courier New, monospace" font-size="14" text-anchor="middle">z⁻¹</text>

    <!-- Segment 2: From z^-1 down, left, up, and back into SNN -->
    <line x1="320" y1="355" x2="320" y2="480" stroke="black" stroke-width="3"/>
    <line x1="320" y1="480" x2="120" y2="480" stroke="black" stroke-width="3"/>
    <line x1="120" y1="480" x2="120" y2="140" stroke="black" stroke-width="3"/>
    <line x1="120" y1="140" x2="320" y2="140" stroke="black" stroke-width="3"/>
    <line x1="320" y1="140" x2="320" y2="170" stroke="black" stroke-width="2" marker-end="url(#ah)"/>

    <!-- 612 label - LEFT of z^-1 box -->
    <text x="270" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="end">612</text>
    <line x1="272" y1="337" x2="295" y2="337" stroke="black" stroke-width="0.5"/>

    <!-- SYNAPTIC label (614) - LEFT of self-obs vertical line -->
    <text x="290" y="410" font-family="Arial, sans-serif" font-size="14" text-anchor="end">SYNAPTIC</text>
    <text x="290" y="425" font-family="Arial, sans-serif" font-size="14" text-anchor="end">614</text>
    <line x1="292" y1="415" x2="320" y2="415" stroke="black" stroke-width="0.5"/>

    <!-- SELF-OBSERVATION label - on the bottom horizontal segment -->
    <text x="220" y="500" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SELF-OBSERVATION (This patent)</text>

    <!-- Signal Pathways Legend -->
    <rect x="150" y="560" width="550" height="100" rx="5" fill="none" stroke="black" stroke-width="2"/>
    <text x="425" y="585" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Signal Pathways</text>
    <line x1="180" y1="610" x2="270" y2="610" stroke="black" stroke-width="3"/>
    <text x="280" y="615" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Self-Observation (Patent B)</text>
    <line x1="180" y1="635" x2="270" y2="635" stroke="black" stroke-width="2"/>
    <text x="280" y="640" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Energy Feedback (Patent A)</text>

    <!-- Caption -->
    <text x="425" y="710" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Self-observation pathway is architecturally</text>
    <text x="425" y="730" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">distinct from energy feedback</text>

    <text x="425" y="920" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">FIG. 6</text>
  </g>
</svg>
