<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />

  <!-- Sheet number -->
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="black">6/6</text>

  <g transform="translate(0, 50)">

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- ENVIRONMENTAL INPUT (76) — top center                 -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="280" y="120" width="240" height="60" fill="none" stroke="black" stroke-width="1.5" />
    <text x="400" y="148" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">ENVIRONMENTAL</text>
    <text x="400" y="166" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">INPUT</text>
    <!-- Ref 76 -->
    <text x="530" y="143" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">76</text>
    <line x1="528" y1="143" x2="522" y2="143" stroke="black" stroke-width="0.5" />

    <!-- Arrow: Environmental Input → SNN -->
    <line x1="400" y1="180" x2="400" y2="250" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SPIKING NEURAL NETWORK (14) — center                  -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="260" y="250" width="280" height="80" fill="none" stroke="black" stroke-width="2" />
    <text x="400" y="297" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="black">SNN</text>
    <!-- Ref 14 -->
    <text x="550" y="278" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">14</text>
    <line x1="548" y1="278" x2="542" y2="278" stroke="black" stroke-width="0.5" />

    <!-- Arrow: SNN → Motor Actuation -->
    <line x1="400" y1="330" x2="400" y2="410" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- MOTOR ACTUATION (78) — below SNN                      -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="280" y="410" width="240" height="60" fill="none" stroke="black" stroke-width="1.5" />
    <text x="400" y="438" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">MOTOR</text>
    <text x="400" y="456" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">ACTUATION</text>
    <!-- Ref 78 -->
    <text x="530" y="433" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">78</text>
    <line x1="528" y1="433" x2="522" y2="433" stroke="black" stroke-width="0.5" />

    <!-- Arrow: Motor Actuation → Energy Harvesting -->
    <line x1="400" y1="470" x2="400" y2="550" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- ENERGY HARVESTING (80) — below Motor                  -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="280" y="550" width="240" height="60" fill="none" stroke="black" stroke-width="1.5" />
    <text x="400" y="578" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">ENERGY</text>
    <text x="400" y="596" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">HARVESTING</text>
    <!-- Ref 80 -->
    <text x="530" y="573" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">80</text>
    <line x1="528" y1="573" x2="522" y2="573" stroke="black" stroke-width="0.5" />

    <!-- Energy feedback: Energy Harvesting → left side → back up to SNN -->
    <path d="M 280 580 L 180 580 L 180 290 L 260 290" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- COGNITIVE CONTROL (42) — upper right                  -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- Cloud shape for external cognitive control layer -->
    <path d="M 608 220 Q 590 220 590 205 Q 590 190 605 186 Q 600 172 615 164 Q 630 156 648 160 Q 656 150 672 150 Q 688 150 696 160 Q 710 155 722 162 Q 734 168 735 180 Q 745 182 748 192 Q 752 202 748 210 Q 752 220 742 220 Z"
          fill="none" stroke="black" stroke-width="1.5" />
    <text x="668" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">COGNITIVE</text>
    <text x="668" y="206" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">CONTROL</text>
    <!-- Ref 42 -->
    <text x="665" y="150" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">42</text>
    <line x1="665" y1="153" x2="665" y2="160" stroke="black" stroke-width="0.5" />

    <!-- Arrow: Cognitive Control → SNN top right -->
    <path d="M 665 220 L 665 240 L 500 240 L 500 250" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SELF-OBSERVATION (60) — lower right                   -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="590" y="410" width="150" height="60" fill="none" stroke="black" stroke-width="2" />
    <text x="665" y="438" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">SELF-</text>
    <text x="665" y="456" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">OBSERVATION</text>
    <!-- Ref 60 -->
    <text x="665" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">60</text>
    <line x1="665" y1="403" x2="665" y2="410" stroke="black" stroke-width="0.5" />

    <!-- Arrow: SNN right side → down → Self-Observation -->
    <path d="M 540 310 L 620 310 L 620 410" fill="none" stroke="black" stroke-width="2" marker-end="url(#ah)" />

    <!-- Self-Observation feedback: right side → up → back into SNN top -->
    <path d="M 710 410 L 710 270 L 540 270" fill="none" stroke="black" stroke-width="2" marker-end="url(#ah)" />

    <!-- Vertical loop labels -->
    <text x="165" y="440" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black" transform="rotate(-90, 165, 440)">ENERGY LOOP</text>
    <text x="725" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black" transform="rotate(-90, 725, 340)">SELF-OBS LOOP</text>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- LEGEND                                                 -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="200" y="680" width="400" height="55" fill="none" stroke="black" stroke-width="1" />
    <line x1="215" y1="698" x2="275" y2="698" stroke="black" stroke-width="2" />
    <text x="285" y="703" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">Self-Observation (this patent)</text>
    <line x1="215" y1="720" x2="275" y2="720" stroke="black" stroke-width="1.5" stroke-dasharray="6,3" />
    <text x="285" y="725" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">Energy feedback (Patent A)</text>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- FIGURE LABEL                                           -->
    <!-- ══════════════════════════════════════════════════════ -->
    <text x="425" y="920" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="black">FIG. 6</text>

  </g>
</svg>
