<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">6/6</text>

  <!-- Title -->
  <text x="425" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">END-TO-END SIGNAL FLOW</text>
  <text x="425" y="130" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Self-Observation Integration in Complete System</text>

  <!-- ENVIRONMENTAL INPUT (600) -->
  <rect x="150" y="160" width="550" height="60" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="425" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ENVIRONMENTAL INPUT</text>
  <text x="425" y="210" font-family="Courier New, monospace" font-size="14" text-anchor="middle">(Light / Temperature / Pressure)</text>
  <text x="690" y="177" font-family="Arial, sans-serif" font-size="14" text-anchor="end">600</text>

  <!-- Arrow: Environmental to SNN -->
  <line x1="425" y1="220" x2="425" y2="253" stroke="black" stroke-width="2" marker-end="url(#ah)"/>

  <!-- NEUROMORPHIC CORE (SNN) (602) - Bold border -->
  <rect x="150" y="255" width="550" height="100" rx="5" fill="none" stroke="black" stroke-width="3"/>
  <text x="425" y="285" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">NEUROMORPHIC CORE (SNN)</text>
  <text x="425" y="315" font-family="Courier New, monospace" font-size="14" text-anchor="middle">V = V × leak + I_ext + I_refl + I_syn</text>
  <text x="425" y="340" font-family="Courier New, monospace" font-size="14" text-anchor="middle">output = mean(V_1, V_2, ..., V_N)</text>
  <text x="690" y="272" font-family="Arial, sans-serif" font-size="14" text-anchor="end">602</text>

  <!-- Arrows from SNN to row below -->
  <line x1="275" y1="355" x2="275" y2="388" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="575" y1="355" x2="575" y2="388" stroke="black" stroke-width="2" marker-end="url(#ah)"/>

  <!-- SELF-OBSERVATION (604) - Left side -->
  <rect x="150" y="390" width="250" height="100" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="275" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SELF-OBSERVATION</text>
  <text x="275" y="445" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">(Patent B - This Patent)</text>
  <text x="275" y="475" font-family="Courier New, monospace" font-size="14" text-anchor="middle">z^(-1) delay + refl_coeff</text>
  <text x="390" y="407" font-family="Arial, sans-serif" font-size="14" text-anchor="end">604</text>

  <!-- COGNITIVE MODULATION (606) - Right side -->
  <rect x="450" y="390" width="250" height="80" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="575" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">COGNITIVE MODULATION</text>
  <text x="575" y="445" font-family="Courier New, monospace" font-size="14" text-anchor="middle">refl_coeff adjustment</text>
  <text x="575" y="465" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Attention / Intention</text>
  <text x="690" y="407" font-family="Arial, sans-serif" font-size="14" text-anchor="end">606</text>

  <!-- Bidirectional arrow between Self-Obs and Cognitive Mod -->
  <line x1="400" y1="445" x2="448" y2="445" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="450" y1="430" x2="402" y2="430" stroke="black" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Arrow: Cognitive to Motor -->
  <line x1="575" y1="470" x2="575" y2="508" stroke="black" stroke-width="2" marker-end="url(#ah)"/>

  <!-- MOTOR ACTUATION (608) - Right side -->
  <rect x="450" y="510" width="250" height="65" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="575" y="540" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">MOTOR ACTUATION</text>
  <text x="575" y="565" font-family="Courier New, monospace" font-size="14" text-anchor="middle">Servo Control / Response</text>
  <text x="690" y="527" font-family="Arial, sans-serif" font-size="14" text-anchor="end">608</text>

  <!-- Arrow: Motor to Energy Harvesting -->
  <line x1="575" y1="575" x2="575" y2="608" stroke="black" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ENERGY HARVESTING (610) - Right side -->
  <rect x="450" y="610" width="250" height="65" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="575" y="640" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ENERGY HARVESTING</text>
  <text x="575" y="665" font-family="Courier New, monospace" font-size="14" text-anchor="middle">Piezo / Thermal Recovery</text>
  <text x="690" y="627" font-family="Arial, sans-serif" font-size="14" text-anchor="end">610</text>

  <!-- SELF-OBSERVATION LOOP (Patent B) - SHORT DASHES (bold), left side -->
  <line x1="150" y1="440" x2="125" y2="440" stroke="black" stroke-width="3" stroke-dasharray="3,3"/>
  <line x1="125" y1="440" x2="125" y2="305" stroke="black" stroke-width="3" stroke-dasharray="3,3"/>
  <line x1="125" y1="305" x2="148" y2="305" stroke="black" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#ah)"/>
  <text x="113" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="end" transform="rotate(-90, 113, 340)">SELF-OBSERVATION</text>

  <!-- ENERGY LOOP (Patent A) - LONG DASHES, right side -->
  <line x1="700" y1="642" x2="725" y2="642" stroke="black" stroke-width="2" stroke-dasharray="12,6"/>
  <line x1="725" y1="642" x2="725" y2="305" stroke="black" stroke-width="2" stroke-dasharray="12,6"/>
  <line x1="725" y1="305" x2="702" y2="305" stroke="black" stroke-width="2" stroke-dasharray="12,6" marker-end="url(#ah)"/>
  <text x="700" y="475" font-family="Arial, sans-serif" font-size="14" text-anchor="start" transform="rotate(90, 700, 475)">ENERGY FEEDBACK</text>

  <!-- Signal Pathways Legend -->
  <rect x="150" y="710" width="550" height="100" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="425" y="740" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Signal Pathways</text>

  <!-- Short dashes sample -->
  <line x1="180" y1="770" x2="280" y2="770" stroke="black" stroke-width="3" stroke-dasharray="3,3"/>
  <text x="295" y="775" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Short dashes (bold): Self-Observation (this patent)</text>

  <!-- Long dashes sample -->
  <line x1="180" y1="795" x2="280" y2="795" stroke="black" stroke-width="2" stroke-dasharray="12,6"/>
  <text x="295" y="800" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Long dashes: Energy feedback (Patent A)</text>

  <!-- Caption -->
  <text x="425" y="860" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">The self-observation pathway feeds the network's own aggregate state</text>
  <text x="425" y="880" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">back as explicit input at configurable gain (0.0 to 1.0).</text>

  <!-- Figure Label -->
  <text x="425" y="1020" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">FIG. 6</text>
</svg>
