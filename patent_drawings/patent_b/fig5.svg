<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />

  <!-- Sheet number -->
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="black">5/6</text>

  <g transform="translate(0, 50)">

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- ENERGY STATE BAR (66) — horizontal bar with zones      -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="160" y="120" width="530" height="60" fill="none" stroke="black" stroke-width="2" />
    <!-- Zone dividers -->
    <line x1="239" y1="120" x2="239" y2="180" stroke="black" stroke-width="1" />
    <line x1="319" y1="120" x2="319" y2="180" stroke="black" stroke-width="2" />
    <line x1="584" y1="120" x2="584" y2="180" stroke="black" stroke-width="1" />
    <!-- Zone labels -->
    <text x="199" y="156" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">CRIT</text>
    <text x="279" y="156" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">LOW</text>
    <text x="451" y="156" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">NORMAL</text>
    <text x="637" y="156" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">SURPLUS</text>
    <!-- Scale below — axis tick labels with leader lines -->
    <line x1="160" y1="180" x2="160" y2="215" stroke="black" stroke-width="1.5" />
    <line x1="160" y1="215" x2="160" y2="220" stroke="black" stroke-width="0.5" />
    <text x="160" y="232" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">0</text>
    <line x1="239" y1="180" x2="239" y2="215" stroke="black" stroke-width="1.5" />
    <line x1="239" y1="215" x2="239" y2="220" stroke="black" stroke-width="0.5" />
    <text x="239" y="232" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">15</text>
    <line x1="319" y1="180" x2="319" y2="215" stroke="black" stroke-width="1.5" />
    <line x1="319" y1="215" x2="319" y2="220" stroke="black" stroke-width="0.5" />
    <text x="319" y="232" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">30</text>
    <line x1="584" y1="180" x2="584" y2="215" stroke="black" stroke-width="1.5" />
    <line x1="584" y1="215" x2="584" y2="220" stroke="black" stroke-width="0.5" />
    <text x="584" y="232" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">80</text>
    <line x1="690" y1="180" x2="690" y2="215" stroke="black" stroke-width="1.5" />
    <line x1="690" y1="215" x2="690" y2="220" stroke="black" stroke-width="0.5" />
    <text x="690" y="232" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">100</text>
    <!-- Axis label -->
    <text x="425" y="255" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">Energy (mWh)</text>
    <!-- Ref 66 -->
    <text x="700" y="138" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">66</text>
    <line x1="698" y1="138" x2="692" y2="135" stroke="black" stroke-width="0.5" />

    <!-- Arrows down to modulation mapping -->
    <line x1="199" y1="180" x2="199" y2="290" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
    <line x1="279" y1="180" x2="279" y2="290" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
    <line x1="451" y1="180" x2="451" y2="290" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
    <line x1="637" y1="180" x2="637" y2="290" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- MODULATION MAPPING (68)                                -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="160" y="290" width="530" height="60" fill="none" stroke="black" stroke-width="1.5" />
    <text x="425" y="318" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">MODULATION MAPPING</text>
    <!-- Modulation values -->
    <text x="199" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">-0.4</text>
    <text x="279" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">-0.1</text>
    <text x="451" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">0.0</text>
    <text x="637" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">+0.3</text>
    <!-- Ref 68 -->
    <text x="700" y="308" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">68</text>
    <line x1="698" y1="308" x2="692" y2="308" stroke="black" stroke-width="0.5" />

    <!-- Arrow down to coefficient scale -->
    <line x1="425" y1="350" x2="425" y2="400" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- REFLECTION COEFFICIENT SCALE (70)                      -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="160" y="400" width="530" height="60" fill="none" stroke="black" stroke-width="1.5" />
    <text x="425" y="425" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">REFLECTION COEFFICIENT</text>
    <!-- Scale line -->
    <line x1="180" y1="445" x2="670" y2="445" stroke="black" stroke-width="1" />
    <text x="199" y="455" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">0.16</text>
    <text x="279" y="455" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">0.19</text>
    <text x="451" y="455" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">0.20</text>
    <text x="637" y="455" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">0.23</text>
    <!-- Ref 70 -->
    <text x="700" y="418" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">70</text>
    <line x1="698" y1="418" x2="692" y2="418" stroke="black" stroke-width="0.5" />

    <!-- Arrow down to behavioral effects -->
    <line x1="425" y1="460" x2="425" y2="500" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- BEHAVIORAL EFFECTS (72) — table                        -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="160" y="500" width="530" height="190" fill="none" stroke="black" stroke-width="1.5" />
    <text x="425" y="525" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">BEHAVIORAL EFFECTS</text>
    <line x1="160" y1="535" x2="690" y2="535" stroke="black" stroke-width="1" />
    <!-- Column separator -->
    <line x1="300" y1="535" x2="300" y2="690" stroke="black" stroke-width="0.8" />
    <!-- Headers -->
    <text x="230" y="555" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">Coefficient</text>
    <text x="495" y="555" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">Behavior</text>
    <!-- Row 1: CRITICAL -->
    <line x1="160" y1="565" x2="690" y2="565" stroke="black" stroke-width="0.8" />
    <text x="230" y="585" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">0.16</text>
    <text x="495" y="585" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">Reduced (conservation)</text>
    <!-- Row 2: LOW -->
    <line x1="160" y1="595" x2="690" y2="595" stroke="black" stroke-width="0.8" />
    <text x="230" y="615" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">0.19</text>
    <text x="495" y="615" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">Cautious</text>
    <!-- Row 3: NORMAL -->
    <line x1="160" y1="625" x2="690" y2="625" stroke="black" stroke-width="0.8" />
    <text x="230" y="645" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">0.20</text>
    <text x="495" y="645" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">Baseline</text>
    <!-- Row 4: SURPLUS -->
    <line x1="160" y1="655" x2="690" y2="655" stroke="black" stroke-width="0.8" />
    <text x="230" y="675" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">0.23</text>
    <text x="495" y="675" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">Enhanced (exploration)</text>
    <!-- Ref 72 -->
    <text x="700" y="518" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">72</text>
    <line x1="698" y1="518" x2="692" y2="515" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- OPTIONAL EXTENSION ZONE (74)                           -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="160" y="720" width="530" height="40" fill="none" stroke="black" stroke-width="1" stroke-dasharray="5,3" />
    <text x="425" y="745" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">EXTENSION ZONE</text>
    <!-- Ref 74 -->
    <text x="700" y="738" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">74</text>
    <line x1="698" y1="738" x2="692" y2="735" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- FIGURE LABEL                                           -->
    <!-- ══════════════════════════════════════════════════════ -->
    <text x="425" y="920" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="black">FIG. 5</text>

  </g>
</svg>
