<svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792">
  <rect width="100%" height="100%" fill="#fff" />
  <text x="306" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">Sheet 5 of 6</text>

  <!-- 500: Energy State Bar at top -->
  <g transform="translate(100,120)">
    <rect width="412" height="40" fill="none" stroke="#000" stroke-width="2" />
    <!-- Dividers for zones -->
    <line x1="62" y1="0" x2="62" y2="40" stroke="#000" stroke-width="1" />
    <line x1="124" y1="0" x2="124" y2="40" stroke="#000" stroke-width="2" />
    <line x1="330" y1="0" x2="330" y2="40" stroke="#000" stroke-width="1" />
    <!-- Zone labels inside -->
    <text x="31" y="25" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">CRIT</text>
    <text x="93" y="25" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">LOW</text>
    <text x="227" y="25" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">NORMAL</text>
    <text x="371" y="25" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">SURPLUS</text>
    <text x="425" y="25" font-family="Arial" font-size="14" font-weight="normal" fill="#000">500</text>
    <!-- Scale below -->
    <text x="0" y="55" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">0</text>
    <text x="62" y="55" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">15</text>
    <text x="124" y="55" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">30</text>
    <text x="330" y="55" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">80</text>
    <text x="412" y="55" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">100</text>
    <text x="206" y="70" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Energy (mWh)</text>
  </g>

  <!-- Arrows down to modulation mapping -->
  <path d="M131 175v25" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M193 175v25" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M327 175v25" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M471 175v25" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- 502: Modulation Mapping -->
  <rect x="100" y="210" width="412" height="70" rx="5" fill="none" stroke="#000" stroke-width="1.5" />
  <text x="306" y="230" font-family="Arial" font-size="11" text-anchor="middle" fill="#000">MODULATION MAPPING</text>
  <!-- Modulation values -->
  <text x="131" y="260" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">-0.4</text>
  <text x="193" y="260" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">-0.1</text>
  <text x="327" y="260" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">0.0</text>
  <text x="471" y="260" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">+0.3</text>
  <text x="520" y="235" font-family="Arial" font-size="14" font-weight="normal" fill="#000">502</text>

  <!-- Arrows down -->
  <path d="M131 280v35" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M193 280v35" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M327 280v35" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M471 280v35" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- 504: Reflection Coefficient Scale -->
  <rect x="100" y="315" width="412" height="60" rx="5" fill="none" stroke="#000" stroke-width="1.5" />
  <text x="306" y="335" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">REFLECTION COEFFICIENT SCALE</text>
  <!-- Scale line -->
  <line x1="120" y1="355" x2="500" y2="355" stroke="#000" stroke-width="1" />
  <text x="131" y="370" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">0.16</text>
  <text x="193" y="370" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">0.19</text>
  <text x="327" y="370" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">0.20</text>
  <text x="471" y="370" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">0.23</text>
  <text x="520" y="330" font-family="Arial" font-size="14" font-weight="normal" fill="#000">504</text>

  <!-- Arrow down -->
  <path d="M306 375v35" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- 506: Behavioral Effects Table -->
  <rect x="100" y="420" width="412" height="130" rx="5" fill="none" stroke="#000" stroke-width="1.5" />
  <text x="306" y="440" font-family="Arial" font-size="11" text-anchor="middle" fill="#000">BEHAVIORAL EFFECTS</text>
  <line x1="100" y1="450" x2="512" y2="450" stroke="#000" stroke-width="1" />
  <!-- Grid lines -->
  <line x1="200" y1="450" x2="200" y2="550" stroke="#000" stroke-width="0.5" />
  <line x1="100" y1="475" x2="512" y2="475" stroke="#000" stroke-width="0.5" />
  <line x1="100" y1="500" x2="512" y2="500" stroke="#000" stroke-width="0.5" />
  <line x1="100" y1="525" x2="512" y2="525" stroke="#000" stroke-width="0.5" />
  <!-- Headers -->
  <text x="150" y="467" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">refl_coeff</text>
  <text x="356" y="467" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Behavior</text>
  <!-- Row 1 -->
  <text x="150" y="492" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">0.16 (CRIT)</text>
  <text x="356" y="492" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Reduced - conserve cognitive resources</text>
  <!-- Row 2 -->
  <text x="150" y="517" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">0.19 (LOW)</text>
  <text x="356" y="517" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Slightly reduced - cautious operation</text>
  <!-- Row 3 -->
  <text x="150" y="542" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">0.20 (NORM)</text>
  <text x="356" y="542" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Baseline - normal self-observation</text>
  <text x="525" y="435" font-family="Arial" font-size="14" font-weight="normal" fill="#000">506</text>

  <!-- 508: Optional Extension Zone (dashed at bottom) -->
  <rect x="100" y="570" width="412" height="32" rx="5" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4,2" />
  <text x="306" y="590" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Optional Extension Zone (future enhancements)</text>
  <text x="525" y="590" font-family="Arial" font-size="14" font-weight="normal" fill="#000">508</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>

  <text x="306" y="700" font-family="Arial" font-size="18" font-weight="normal" text-anchor="middle" fill="#000">FIG. 5</text>
</svg>
