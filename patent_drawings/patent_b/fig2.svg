<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">2/6</text>

  <!-- Title -->
  <text x="425" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">REFLECTION COEFFICIENT SPECTRUM</text>
  <text x="425" y="130" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Behavioral Effects Across Full Range (0.0 to 1.0)</text>

  <!-- Operational range bracket (0.1 to 0.3) above bar -->
  <text x="260" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">0.1 to 0.3 (typical)</text>
  <line x1="205" y1="188" x2="205" y2="203" stroke="black" stroke-width="2"/>
  <line x1="205" y1="188" x2="315" y2="188" stroke="black" stroke-width="2"/>
  <line x1="315" y1="188" x2="315" y2="203" stroke="black" stroke-width="2"/>

  <!-- Main Spectrum Bar (200) -->
  <rect x="150" y="205" width="550" height="45" rx="0" fill="none" stroke="black" stroke-width="3"/>
  <text x="710" y="223" font-family="Arial, sans-serif" font-size="14" text-anchor="start">200</text>
  <line x1="705" y1="220" x2="700" y2="228" stroke="black" stroke-width="0.5"/>

  <!-- Region dividers inside bar -->
  <line x1="260" y1="205" x2="260" y2="250" stroke="black" stroke-width="2"/>
  <line x1="370" y1="205" x2="370" y2="250" stroke="black" stroke-width="2"/>
  <line x1="535" y1="205" x2="535" y2="250" stroke="black" stroke-width="2"/>

  <!-- Scale markers below bar -->
  <line x1="150" y1="250" x2="150" y2="262" stroke="black" stroke-width="1"/>
  <text x="150" y="280" font-family="Courier New, monospace" font-size="14" text-anchor="middle">0.0</text>
  <line x1="260" y1="250" x2="260" y2="262" stroke="black" stroke-width="1"/>
  <text x="260" y="280" font-family="Courier New, monospace" font-size="14" text-anchor="middle">0.2</text>
  <line x1="370" y1="250" x2="370" y2="262" stroke="black" stroke-width="1"/>
  <text x="370" y="280" font-family="Courier New, monospace" font-size="14" text-anchor="middle">0.4</text>
  <line x1="535" y1="250" x2="535" y2="262" stroke="black" stroke-width="1"/>
  <text x="535" y="280" font-family="Courier New, monospace" font-size="14" text-anchor="middle">0.7</text>
  <line x1="700" y1="250" x2="700" y2="262" stroke="black" stroke-width="1"/>
  <text x="700" y="280" font-family="Courier New, monospace" font-size="14" text-anchor="middle">1.0</text>

  <!-- REGION 1 (202) -->
  <rect x="150" y="320" width="550" height="85" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="165" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start">Region 1 (0.0): No Self-Observation</text>
  <text x="710" y="338" font-family="Arial, sans-serif" font-size="14" text-anchor="start">202</text>
  <line x1="705" y1="335" x2="700" y2="345" stroke="black" stroke-width="0.5"/>
  <text x="165" y="368" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Pure feedforward processing</text>
  <text x="165" y="386" font-family="Courier New, monospace" font-size="14" text-anchor="start">Behavior: System responds only to external input</text>

  <!-- REGION 2 (204) -->
  <rect x="150" y="420" width="550" height="85" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="165" y="445" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start">Region 2 (0.0 - 0.2): Minimal Self-Awareness</text>
  <text x="710" y="438" font-family="Arial, sans-serif" font-size="14" text-anchor="start">204</text>
  <line x1="705" y1="435" x2="700" y2="445" stroke="black" stroke-width="0.5"/>
  <text x="165" y="468" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Slight influence of prior state</text>
  <text x="165" y="486" font-family="Courier New, monospace" font-size="14" text-anchor="start">Behavior: Primarily externally driven</text>

  <!-- REGION 3 (206) - OPERATIONAL -->
  <rect x="150" y="520" width="550" height="100" rx="5" fill="none" stroke="black" stroke-width="3"/>
  <text x="165" y="545" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start">Region 3 (0.2 - 0.4): Balanced Self-Observation</text>
  <text x="530" y="545" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start">OPERATIONAL RANGE</text>
  <text x="710" y="538" font-family="Arial, sans-serif" font-size="14" text-anchor="start">206</text>
  <line x1="705" y1="535" x2="700" y2="545" stroke="black" stroke-width="0.5"/>
  <text x="165" y="568" font-family="Arial, sans-serif" font-size="14" text-anchor="start">External input + meaningful self-reference</text>
  <text x="165" y="591" font-family="Courier New, monospace" font-size="14" text-anchor="start">Default: refl_coeff = 0.2 + modulation x 0.1</text>

  <!-- REGION 4 (208) -->
  <rect x="150" y="635" width="550" height="85" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="165" y="660" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start">Region 4 (0.4 - 0.7): Self-Dominated Processing</text>
  <text x="710" y="653" font-family="Arial, sans-serif" font-size="14" text-anchor="start">208</text>
  <line x1="705" y1="650" x2="700" y2="660" stroke="black" stroke-width="0.5"/>
  <text x="165" y="683" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Internal state dominates</text>
  <text x="165" y="701" font-family="Courier New, monospace" font-size="14" text-anchor="start">Behavior: Risk of echo chamber dynamics</text>

  <!-- REGION 5 (210) -->
  <rect x="150" y="735" width="550" height="85" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="165" y="760" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start">Region 5 (0.7 - 1.0): Self-Absorption</text>
  <text x="710" y="753" font-family="Arial, sans-serif" font-size="14" text-anchor="start">210</text>
  <line x1="705" y1="750" x2="700" y2="760" stroke="black" stroke-width="0.5"/>
  <text x="165" y="783" font-family="Arial, sans-serif" font-size="14" text-anchor="start">External input overwhelmed</text>
  <text x="165" y="801" font-family="Courier New, monospace" font-size="14" text-anchor="start">Behavior: System locks onto its own prior state</text>

  <!-- Arrow indicating increasing self-referential processing -->
  <line x1="180" y1="865" x2="670" y2="865" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="425" y="890" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Increasing self-referential processing</text>

  <!-- Note -->
  <text x="425" y="945" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">The reflection coefficient is the system's self-awareness dial</text>

  <!-- Figure Label -->
  <text x="425" y="1020" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">FIG. 2</text>
</svg>
