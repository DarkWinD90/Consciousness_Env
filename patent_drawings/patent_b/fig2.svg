<svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792">
  <rect width="100%" height="100%" fill="#fff" />
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>
  <text x="306" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">Sheet 2 of 6</text>

  <!-- 200: Main Spectrum Bar (0.0 to 1.0) -->
  <rect x="100" y="150" width="412" height="40" fill="none" stroke="#000" stroke-width="2" />
  <text x="510" y="175" font-family="Arial" font-size="14" font-weight="normal" fill="#000">200</text>

  <!-- Scale markings at bottom -->
  <path d="M100 190v20M180 190v20M260 190v20M380 190v20M512 190v20" stroke="#000" stroke-width="1.5" />
  <text x="100" y="225" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">0.0</text>
  <text x="180" y="225" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">0.2</text>
  <text x="260" y="225" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">0.4</text>
  <text x="380" y="225" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">0.7</text>
  <text x="512" y="225" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">1.0</text>

  <!-- 204: Region 0.0-0.2 (Minimal self-awareness) - dashed -->
  <rect x="100" y="150" width="80" height="40" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="2,2" />
  <text x="140" y="140" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">204</text>
  <text x="140" y="270" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Minimal</text>
  <text x="140" y="282" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">self-awareness</text>

  <!-- 206: Region 0.2-0.4 (OPERATIONAL RANGE - Balanced) - bold -->
  <rect x="180" y="150" width="80" height="40" fill="none" stroke="#000" stroke-width="2" />
  <text x="220" y="140" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">206</text>
  <text x="220" y="270" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">OPERATIONAL</text>
  <text x="220" y="282" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">RANGE</text>
  <text x="220" y="295" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">(Balanced)</text>

  <!-- 208: Region 0.4-0.7 (Self-dominated) - dashed -->
  <rect x="260" y="150" width="120" height="40" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="2,2" />
  <text x="320" y="140" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">208</text>
  <text x="320" y="270" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Self-dominated</text>
  <text x="320" y="282" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">processing</text>

  <!-- 210: Region 0.7-1.0 (Self-absorption) - dashed -->
  <rect x="380" y="150" width="132" height="40" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="2,2" />
  <text x="446" y="140" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">210</text>
  <text x="446" y="270" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Self-absorption</text>

  <!-- 202: Arrow showing direction of increasing self-referential processing -->
  <path d="M100 330h422" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="306" y="350" font-family="Arial" font-size="11" font-style="italic" text-anchor="middle" fill="#000">Increasing self-referential processing</text>
  <text x="306" y="365" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">202</text>

  <!-- 212: Current processing point (vertical dashed line) -->
  <path d="M220 150v60" stroke="#000" stroke-width="1.5" stroke-dasharray="4,2" />
  <text x="220" y="115" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Default: 0.2</text>
  <text x="275" y="240" font-family="Arial" font-size="14" font-weight="normal" fill="#000">212</text>

  <!-- Legend box -->
  <rect x="100" y="400" width="412" height="80" fill="none" stroke="#000" stroke-width="1" />
  <text x="120" y="420" font-family="Arial" font-size="10" fill="#000">reflection_coeff = base_coeff + modulation x sensitivity</text>
  <text x="120" y="435" font-family="Arial" font-size="10" fill="#000">Default: base_coeff = 0.2, sensitivity = 0.1</text>
  <text x="120" y="455" font-family="Arial" font-size="10" fill="#000">Range: 0.1 to 0.3 (within OPERATIONAL zone)</text>
  <text x="120" y="475" font-family="Arial" font-size="10" fill="#000">The reflection coefficient is the system's "self-awareness dial"</text>


  <text x="306" y="700" font-family="Arial" font-size="18" font-weight="normal" text-anchor="middle" fill="#000">FIG. 2</text>
</svg>
