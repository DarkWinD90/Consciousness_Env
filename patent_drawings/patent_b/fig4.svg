<svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792">
  <rect width="100%" height="100%" fill="#fff" />
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>
  <text x="306" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">Sheet 4 of 6</text>

  <!-- 400: SNN Processing Step t (top) -->
  <rect x="150" y="100" width="312" height="60" rx="5" fill="none" stroke="#000" stroke-width="2" />
  <text x="306" y="125" font-family="Arial" font-size="11" text-anchor="middle" fill="#000">SNN PROCESSING STEP t</text>
  <text x="306" y="145" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Membrane dynamics + spikes</text>
  <text x="480" y="115" font-family="Arial" font-size="14" font-weight="normal" fill="#000">400</text>

  <!-- Arrow down from 400 -->
  <path d="M306 160v50" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="320" y="180" font-family="Arial" font-size="10" fill="#000">S(t)</text>

  <!-- 402: STDP Weight Update -->
  <rect x="360" y="200" width="120" height="90" rx="5" fill="none" stroke="#000" stroke-width="1.5" />
  <text x="420" y="220" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">STDP</text>
  <text x="420" y="235" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">WEIGHT</text>
  <text x="420" y="250" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">UPDATE</text>
  <text x="420" y="270" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">A+/A- = 1.2</text>
  <text x="420" y="178" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">402</text>

  <!-- 406: Self-Observation (left) -->
  <rect x="130" y="200" width="120" height="90" rx="5" fill="none" stroke="#000" stroke-width="1.5" />
  <text x="190" y="225" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">SELF-</text>
  <text x="190" y="240" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">OBSERVATION</text>
  <text x="190" y="265" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">O(t) x refl_coeff</text>
  <text x="190" y="178" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">406</text>

  <!-- Arrows from 400 to 402 and 406 -->
  <path d="M380 160v50" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M230 160v50" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Arrow from 402 down to 404 -->
  <path d="M420 290v50" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- 404: Updated Weight Matrix -->
  <rect x="360" y="330" width="120" height="50" rx="5" fill="none" stroke="#000" stroke-width="1.5" />
  <text x="420" y="352" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">UPDATED</text>
  <text x="420" y="367" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">WEIGHTS</text>
  <text x="420" y="400" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">404</text>

  <!-- Feedback loops back to 400 -->
  <!-- 406 feedback loop (left side) -->
  <path d="M130 240h-30V130h60" stroke="#000" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <text x="85" y="185" font-family="Arial" font-size="10" fill="#000" transform="rotate(-90 85 185)">SELF-OBS</text>

  <!-- 404/402 feedback loop (right side) -->
  <path d="M480 355h30V130h-58" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
  <text x="505" y="240" font-family="Arial" font-size="10" fill="#000" transform="rotate(90 505 240)">STDP</text>

  <!-- 408: Key Insight (bottom left dashed) -->
  <rect x="130" y="450" width="160" height="80" rx="5" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4,2" />
  <text x="210" y="470" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">KEY INSIGHT</text>
  <text x="210" y="490" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">STDP strengthens</text>
  <text x="210" y="503" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">causal connections.</text>
  <text x="210" y="520" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Self-obs adds feedback.</text>
  <text x="210" y="550" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">408</text>

  <!-- 410: Validation Results (bottom right dashed) -->
  <rect x="340" y="450" width="160" height="80" rx="5" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4,2" />
  <text x="420" y="470" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">VALIDATION (Phase 8)</text>
  <text x="420" y="490" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">F8.1: Entropy decrease</text>
  <text x="420" y="503" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">2.95 to 2.02 bits</text>
  <text x="420" y="520" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">F8.2: MI = 6.52x (PASS)</text>
  <text x="420" y="550" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">410</text>


  <text x="306" y="700" font-family="Arial" font-size="18" font-weight="normal" text-anchor="middle" fill="#000">FIG. 4</text>
</svg>
