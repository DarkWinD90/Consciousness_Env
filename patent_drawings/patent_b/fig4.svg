<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">4/6</text>

  <!-- Title -->
  <text x="425" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SELF-REFERENTIAL LEARNING LOOP</text>
  <text x="425" y="130" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">(STDP + Self-Observation)</text>

  <!-- SNN PROCESSING STEP t (400) -->
  <rect x="150" y="160" width="550" height="70" rx="5" fill="none" stroke="black" stroke-width="3"/>
  <text x="425" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SNN PROCESSING STEP t</text>
  <text x="425" y="210" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Membrane dynamics + spikes</text>
  <text x="690" y="175" font-family="Arial, sans-serif" font-size="14" text-anchor="end">400</text>

  <!-- Arrow down from SNN to STDP -->
  <line x1="425" y1="230" x2="425" y2="268" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="440" y="255" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Spike Output</text>

  <!-- STDP WEIGHT UPDATE (402) -->
  <rect x="150" y="270" width="550" height="110" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="425" y="295" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">STDP WEIGHT UPDATE</text>
  <text x="425" y="320" font-family="Courier New, monospace" font-size="14" text-anchor="middle">Post fires: W += 0.01 × pre_trace</text>
  <text x="425" y="345" font-family="Courier New, monospace" font-size="14" text-anchor="middle">Pre fires: W -= 0.012 × post_trace</text>
  <text x="425" y="365" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">A-/A+ = 1.2 (stability ratio)</text>
  <text x="690" y="285" font-family="Arial, sans-serif" font-size="14" text-anchor="end">402</text>

  <!-- Arrow down from STDP to Updated Weights -->
  <line x1="425" y1="380" x2="425" y2="418" stroke="black" stroke-width="2" marker-end="url(#ah)"/>

  <!-- UPDATED WEIGHT MATRIX (404) -->
  <rect x="150" y="420" width="550" height="55" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="425" y="445" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">UPDATED WEIGHT MATRIX</text>
  <text x="425" y="465" font-family="Courier New, monospace" font-size="14" text-anchor="middle">W(t+1) bounded to [0.0, 0.5]</text>
  <text x="690" y="435" font-family="Arial, sans-serif" font-size="14" text-anchor="end">404</text>

  <!-- Arrow from Updated Weights to Self-Observation -->
  <line x1="275" y1="475" x2="275" y2="523" stroke="black" stroke-width="2" marker-end="url(#ah)"/>

  <!-- SELF-OBSERVATION (406) - Left side -->
  <rect x="150" y="525" width="250" height="70" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="275" y="550" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SELF-OBSERVATION</text>
  <text x="275" y="575" font-family="Courier New, monospace" font-size="14" text-anchor="middle">O(t) × refl_coeff</text>
  <text x="390" y="540" font-family="Arial, sans-serif" font-size="14" text-anchor="end">406</text>

  <!-- KEY INSIGHT (408) - Right side callout -->
  <rect x="450" y="525" width="250" height="100" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="575" y="550" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">KEY INSIGHT</text>
  <text x="575" y="575" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">STDP strengthens causal</text>
  <text x="575" y="595" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">connections. Self-observation</text>
  <text x="575" y="615" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">adds correlated feedback.</text>
  <text x="690" y="540" font-family="Arial, sans-serif" font-size="14" text-anchor="end">408</text>

  <!-- Self-observation feedback loop (back to SNN) - Bold line -->
  <line x1="150" y1="560" x2="130" y2="560" stroke="black" stroke-width="3"/>
  <line x1="130" y1="560" x2="130" y2="195" stroke="black" stroke-width="3"/>
  <line x1="130" y1="195" x2="148" y2="195" stroke="black" stroke-width="3" marker-end="url(#ah)"/>
  <text x="118" y="380" font-family="Arial, sans-serif" font-size="14" text-anchor="end" transform="rotate(-90, 118, 380)">FEEDBACK LOOP</text>

  <!-- VALIDATION RESULTS (410) - Full width at bottom -->
  <rect x="150" y="660" width="550" height="90" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="425" y="685" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">VALIDATION RESULTS (Phase 8)</text>
  <text x="425" y="710" font-family="Courier New, monospace" font-size="14" text-anchor="middle">F8.1: Entropy 2.95 to 2.02 bits (PASS)</text>
  <text x="425" y="735" font-family="Courier New, monospace" font-size="14" text-anchor="middle">F8.2: STDP MI = 6.52x > 1.20x (PASS)</text>
  <text x="690" y="675" font-family="Arial, sans-serif" font-size="14" text-anchor="end">410</text>

  <!-- Signal Pathways Legend -->
  <rect x="150" y="770" width="550" height="50" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="425" y="795" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Signal Pathways</text>
  <line x1="180" y1="810" x2="270" y2="810" stroke="black" stroke-width="3"/>
  <text x="280" y="815" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Bold: Self-observation feedback loop</text>

  <!-- Figure Label -->
  <text x="425" y="1020" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">FIG. 4</text>
</svg>
