<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />

  <!-- Sheet number -->
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="black">7/7</text>

  <g transform="translate(0, 50)">

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- PRELUDE (82) — encoded input from L1-L3                -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="345" y="100" width="180" height="50" fill="none" stroke="black" stroke-width="1.5" />
    <text x="435" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">PRELUDE</text>
    <!-- Ref 82 -->
    <text x="535" y="118" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">82</text>
    <line x1="533" y1="118" x2="527" y2="118" stroke="black" stroke-width="0.5" />

    <!-- Arrow PRELUDE -> SNN top (encoded input e, ref 84) -->
    <line x1="435" y1="150" x2="435" y2="270" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
    <!-- Ref 84 -->
    <text x="455" y="200" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">84</text>
    <line x1="453" y1="200" x2="437" y2="200" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- INNER LOOP REGION MARKERS (86) — four L-corner brackets-->
    <!-- Dashed stroke; signal paths route freely through gaps  -->
    <!-- Region spans approximately x=180-680, y=240-560        -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- Top-left corner -->
    <line x1="180" y1="285" x2="180" y2="240" stroke="black" stroke-width="1" stroke-dasharray="8,4" />
    <line x1="180" y1="240" x2="240" y2="240" stroke="black" stroke-width="1" stroke-dasharray="8,4" />
    <!-- Top-right corner -->
    <line x1="620" y1="240" x2="680" y2="240" stroke="black" stroke-width="1" stroke-dasharray="8,4" />
    <line x1="680" y1="240" x2="680" y2="285" stroke="black" stroke-width="1" stroke-dasharray="8,4" />
    <!-- Bottom-left corner -->
    <line x1="180" y1="520" x2="180" y2="560" stroke="black" stroke-width="1" stroke-dasharray="8,4" />
    <line x1="180" y1="560" x2="240" y2="560" stroke="black" stroke-width="1" stroke-dasharray="8,4" />
    <!-- Bottom-right corner -->
    <line x1="620" y1="560" x2="680" y2="560" stroke="black" stroke-width="1" stroke-dasharray="8,4" />
    <line x1="680" y1="520" x2="680" y2="560" stroke="black" stroke-width="1" stroke-dasharray="8,4" />
    <!-- Region label -->
    <text x="285" y="234" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="black">INNER LOOP</text>
    <text x="500" y="234" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="black">x T</text>
    <!-- Ref 86 -->
    <text x="565" y="234" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">86</text>
    <line x1="563" y1="234" x2="557" y2="234" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SPIKING NEURAL NETWORK (14) — recurrent block          -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="300" y="270" width="270" height="80" fill="none" stroke="black" stroke-width="2" />
    <text x="435" y="304" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="black">SPIKING NEURAL</text>
    <text x="435" y="324" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="black">NETWORK</text>
    <!-- Ref 14 -->
    <text x="580" y="298" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">14</text>
    <line x1="578" y1="298" x2="572" y2="298" stroke="black" stroke-width="0.5" />

    <!-- Arrow SNN -> HIDDEN STATE -->
    <line x1="435" y1="350" x2="435" y2="380" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- HIDDEN STATE (88) — membrane potential vector          -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="320" y="380" width="230" height="40" fill="none" stroke="black" stroke-width="1.5" />
    <text x="435" y="405" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">HIDDEN STATE</text>
    <!-- Ref 88 -->
    <text x="560" y="395" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">88</text>
    <line x1="558" y1="395" x2="552" y2="395" stroke="black" stroke-width="0.5" />

    <!-- Split paths from HIDDEN STATE bottom -->
    <!-- Left fork to REFLECTION FEEDBACK -->
    <path d="M 370 420 L 370 442 L 330 442 L 330 465" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
    <!-- Right fork to SPIKE ACCUMULATOR -->
    <path d="M 500 420 L 500 442 L 530 442 L 530 465" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- REFLECTION FEEDBACK (90) — applied at every inner iter -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="240" y="465" width="180" height="50" fill="none" stroke="black" stroke-width="1.5" />
    <text x="330" y="487" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">REFLECTION</text>
    <text x="330" y="505" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">FEEDBACK</text>
    <!-- Ref 90 -->
    <text x="430" y="478" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">90</text>
    <line x1="428" y1="478" x2="422" y2="478" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SPIKE ACCUMULATOR (92) — sums spikes across T iters    -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="440" y="465" width="180" height="50" fill="none" stroke="black" stroke-width="1.5" />
    <text x="530" y="487" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">SPIKE</text>
    <text x="530" y="505" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">ACCUMULATOR</text>
    <!-- Ref 92 -->
    <text x="630" y="478" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">92</text>
    <line x1="628" y1="478" x2="622" y2="478" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- ITERATION LOOP (k -> k+1) — feedback re-injection path -->
    <!-- From REFLECTION FEEDBACK left side, up the left side   -->
    <!-- of the SNN, back into SNN top-left.                    -->
    <!-- ══════════════════════════════════════════════════════ -->
    <path d="M 240 490 L 210 490 L 210 290 L 300 290" fill="none" stroke="black" stroke-width="2" marker-end="url(#ah)" />

    <!-- Exit arrow: SPIKE ACCUMULATOR -> OUTPUT GATE (single emission per outer step) -->
    <line x1="530" y1="515" x2="530" y2="620" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- OUTPUT GATE (94) — emits aggregated output once per    -->
    <!-- outer simulation timestep                              -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="440" y="620" width="180" height="50" fill="none" stroke="black" stroke-width="1.5" />
    <text x="530" y="650" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">OUTPUT GATE</text>
    <!-- Ref 94 -->
    <text x="630" y="638" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">94</text>
    <line x1="628" y1="638" x2="622" y2="638" stroke="black" stroke-width="0.5" />

    <!-- Arrow OUTPUT GATE -> CODA -->
    <line x1="530" y1="670" x2="530" y2="720" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- CODA (96) — L5-L6 (servo + harvest) triggered once per -->
    <!-- outer simulation timestep                              -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="440" y="720" width="180" height="50" fill="none" stroke="black" stroke-width="1.5" />
    <text x="530" y="750" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">CODA</text>
    <!-- Ref 96 -->
    <text x="630" y="738" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">96</text>
    <line x1="628" y1="738" x2="622" y2="738" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- FIGURE LABEL                                           -->
    <!-- ══════════════════════════════════════════════════════ -->
    <text x="425" y="920" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="black">FIG. 7</text>

  </g>
</svg>
