<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />

  <!-- Sheet number -->
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="black">1/6</text>

  <g transform="translate(0, 50)">

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- EXTERNAL INPUT (10)                                    -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="310" y="100" width="180" height="50" fill="none" stroke="black" stroke-width="1.5" />
    <text x="400" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">EXTERNAL INPUT</text>
    <!-- Ref 10 -->
    <text x="500" y="118" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">10</text>
    <line x1="498" y1="118" x2="492" y2="118" stroke="black" stroke-width="0.5" />

    <!-- Arrow: External Input → Summing Junction -->
    <line x1="400" y1="150" x2="400" y2="170" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SUMMING JUNCTION (12) — rect with + symbol             -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="360" y="170" width="80" height="50" fill="none" stroke="black" stroke-width="1.5" />
    <text x="400" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">SUM</text>
    <!-- Ref 12 -->
    <text x="450" y="188" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">12</text>
    <line x1="448" y1="188" x2="442" y2="190" stroke="black" stroke-width="0.5" />

    <!-- Arrow: Summing Junction → SNN -->
    <line x1="400" y1="220" x2="400" y2="260" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SPIKING NEURAL NETWORK (14)                            -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="280" y="260" width="240" height="70" fill="none" stroke="black" stroke-width="2" />
    <text x="400" y="302" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="black">SNN</text>
    <!-- Ref 14 -->
    <text x="530" y="288" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">14</text>
    <line x1="528" y1="288" x2="522" y2="288" stroke="black" stroke-width="0.5" />

    <!-- Arrow: SNN → Spike Output -->
    <line x1="400" y1="330" x2="400" y2="370" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SPIKE OUTPUT (16)                                      -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="310" y="370" width="180" height="50" fill="none" stroke="black" stroke-width="1.5" />
    <text x="400" y="400" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">SPIKE OUTPUT</text>
    <!-- Ref 16 -->
    <text x="500" y="388" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">16</text>
    <line x1="498" y1="388" x2="492" y2="388" stroke="black" stroke-width="0.5" />

    <!-- Arrow: Spike Output → Aggregate Output -->
    <line x1="400" y1="420" x2="400" y2="460" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- AGGREGATE OUTPUT (18)                                  -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="310" y="460" width="180" height="50" fill="none" stroke="black" stroke-width="1.5" />
    <text x="400" y="482" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">AGGREGATE</text>
    <text x="400" y="500" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">OUTPUT</text>
    <!-- Ref 18 -->
    <text x="500" y="478" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">18</text>
    <line x1="498" y1="478" x2="492" y2="478" stroke="black" stroke-width="0.5" />

    <!-- Arrow: Aggregate Output → Delay Element -->
    <line x1="400" y1="510" x2="400" y2="550" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- DELAY ELEMENT (20)                                     -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="340" y="550" width="120" height="50" fill="none" stroke="black" stroke-width="1.5" />
    <text x="400" y="580" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">DELAY</text>
    <!-- Ref 20 -->
    <text x="465" y="568" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">20</text>
    <line x1="463" y1="568" x2="460" y2="570" stroke="black" stroke-width="0.5" />

    <!-- Arrow: Delay → Reflection Scaling -->
    <line x1="400" y1="600" x2="400" y2="640" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- REFLECTION SCALING BLOCK (22)                          -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="310" y="640" width="180" height="50" fill="none" stroke="black" stroke-width="1.5" />
    <text x="400" y="662" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">REFLECTION</text>
    <text x="400" y="680" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">SCALING</text>
    <!-- Ref 22 -->
    <text x="500" y="658" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">22</text>
    <line x1="498" y1="658" x2="492" y2="658" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SELF-OBSERVATION FEEDBACK PATH (24) — bold return       -->
    <!-- Routed at x=200 to clear all left-side elements         -->
    <!-- ══════════════════════════════════════════════════════ -->
    <path d="M 310 665 L 200 665 L 200 195 L 360 195" fill="none" stroke="black" stroke-width="2" marker-end="url(#ah)" />
    <!-- Ref 24 -->
    <text x="188" y="430" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">24</text>
    <line x1="191" y1="430" x2="200" y2="430" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- FIGURE LABEL                                           -->
    <!-- ══════════════════════════════════════════════════════ -->
    <text x="425" y="920" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="black">FIG. 1</text>

  </g>
</svg>
