<svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792">
  <rect width="100%" height="100%" fill="#fff" />
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>
  <text x="306" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">Sheet 1 of 6</text>

  <!-- 100: External Input I_ext(t) -->
  <rect x="210" y="100" width="192" height="40" fill="none" stroke="#000" stroke-width="1.5" />
  <text x="306" y="125" font-family="Arial" font-size="11" text-anchor="middle" fill="#000">I_ext(t)</text>
  <text x="410" y="125" font-family="Arial" font-size="14" font-weight="normal" fill="#000">100</text>
  <line x1="408" y1="125" x2="402" y2="125" stroke="black" stroke-width="0.5" />

  <!-- 102: Summing Junction -->
  <circle cx="306" cy="180" r="15" fill="none" stroke="#000" stroke-width="1.5" />
  <path d="M298 180h16M306 172v16" stroke="#000" stroke-width="1.5" />
  <text x="330" y="185" font-family="Arial" font-size="14" font-weight="normal" fill="#000">102</text>
  <line x1="328" y1="185" x2="321" y2="180" stroke="black" stroke-width="0.5" />

  <!-- 104: SNN (N LIF neurons) -->
  <g transform="translate(180,230)">
    <rect width="252" height="60" rx="4" ry="4" fill="none" stroke="#000" stroke-width="2" />
    <circle cx="30" cy="30" r="4" stroke="#000" />
    <circle cx="60" cy="30" r="4" stroke="#000" />
    <circle cx="220" cy="30" r="4" stroke="#000" />
    <path d="M90 30h110" stroke="#000" stroke-dasharray="2,2" />
    <text x="126" y="50" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">N LIF neurons</text>
    <text x="260" y="-10" font-family="Arial" font-size="14" font-weight="normal" fill="#000">104</text>
    <line x1="258" y1="-6" x2="252" y2="0" stroke="black" stroke-width="0.5" />
  </g>

  <!-- 106: Spike Output S(t) -->
  <rect x="340" y="310" width="140" height="25" rx="3" fill="none" stroke="#000" stroke-width="1.5" />
  <text x="410" y="327" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">S(t)</text>
  <text x="490" y="327" font-family="Arial" font-size="14" font-weight="normal" fill="#000">106</text>
  <line x1="488" y1="327" x2="480" y2="327" stroke="black" stroke-width="0.5" />

  <!-- Arrow from SNN to spike output -->
  <path d="M410 290v30" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- 108: Aggregate Output O(t) = mean(V) -->
  <rect x="340" y="345" width="140" height="40" rx="5" fill="none" stroke="#000" stroke-width="1.5" />
  <text x="410" y="362" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">O(t) = mean(V)</text>
  <text x="410" y="378" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">(aggregate)</text>
  <text x="490" y="370" font-family="Arial" font-size="14" font-weight="normal" fill="#000">108</text>
  <line x1="488" y1="370" x2="480" y2="370" stroke="black" stroke-width="0.5" />

  <!-- Arrow from 106 to 108 -->
  <path d="M410 335v20" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- 110: Delay Element z^-1 -->
  <rect x="340" y="410" width="140" height="40" rx="5" fill="none" stroke="#000" stroke-width="1.5" />
  <text x="410" y="435" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">z^-1</text>
  <text x="490" y="435" font-family="Arial" font-size="14" font-weight="normal" fill="#000">110</text>
  <line x1="488" y1="435" x2="480" y2="435" stroke="black" stroke-width="0.5" />

  <!-- Arrow from 108 to 110 -->
  <path d="M410 385v20" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- 112: Reflection Scaling Block (triangle) -->
  <g transform="translate(340,480)">
    <path d="M0 0l40 20-40 20z" fill="none" stroke="#000" stroke-width="1.5" />
    <text x="10" y="24" font-family="Arial" font-size="10" fill="#000">x r</text>
    <text x="50" y="25" font-family="Arial" font-size="14" font-weight="normal" fill="#000">112</text>
    <line x1="48" y1="22" x2="40" y2="20" stroke="black" stroke-width="0.5" />
  </g>

  <!-- Arrow from 110 to 112 -->
  <path d="M380 450v50" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- 114: Self-Observation Feedback Path (bold return path) -->
  <path d="M340 500H150V180h141" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="100" y="340" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(-90 100 340)" fill="#000">114</text>
  <line x1="120" y1="340" x2="150" y2="340" stroke="black" stroke-width="0.5" />
  <text x="130" y="380" font-family="Arial" font-size="10" text-anchor="middle" transform="rotate(-90 130 380)" fill="#000">I_refl</text>

  <!-- Signal flow arrows -->
  <path d="M306 140v25" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M306 195v35" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Arrow marker definition -->

  <text x="306" y="650" font-family="Arial" font-size="18" font-weight="normal" text-anchor="middle" fill="#000">FIG. 1</text>
</svg>
