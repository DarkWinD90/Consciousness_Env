<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />

  <!-- Sheet number -->
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="black">4/6</text>

  <g transform="translate(0, 50)">

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SNN (14) — top center                                  -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="230" y="120" width="390" height="70" fill="none" stroke="black" stroke-width="2" />
    <text x="425" y="162" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="black">SNN</text>
    <!-- Ref 14 -->
    <text x="630" y="148" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">14</text>
    <line x1="628" y1="148" x2="622" y2="148" stroke="black" stroke-width="0.5" />

    <!-- Arrows: SNN → STDP (left) and SNN → Self-Obs (right) -->
    <line x1="320" y1="190" x2="320" y2="250" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
    <line x1="530" y1="190" x2="530" y2="250" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- STDP WEIGHT UPDATE (56) — left side                    -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="230" y="250" width="180" height="70" fill="none" stroke="black" stroke-width="1.5" />
    <text x="320" y="282" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">STDP WEIGHT</text>
    <text x="320" y="300" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">UPDATE</text>
    <!-- Ref 56 -->
    <text x="225" y="268" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">56</text>
    <line x1="228" y1="268" x2="230" y2="270" stroke="black" stroke-width="0.5" />

    <!-- Arrow: STDP → Updated Weights -->
    <line x1="320" y1="320" x2="320" y2="380" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- UPDATED WEIGHT MATRIX (58) — below STDP                -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="230" y="380" width="180" height="60" fill="none" stroke="black" stroke-width="1.5" />
    <text x="320" y="407" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">UPDATED</text>
    <text x="320" y="425" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">WEIGHTS</text>
    <!-- Ref 58 -->
    <text x="225" y="398" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">58</text>
    <line x1="228" y1="398" x2="230" y2="400" stroke="black" stroke-width="0.5" />

    <!-- STDP feedback: Updated Weights → left side → back to SNN left -->
    <line x1="230" y1="410" x2="160" y2="410" stroke="black" stroke-width="1.5" />
    <line x1="160" y1="410" x2="160" y2="155" stroke="black" stroke-width="1.5" />
    <line x1="160" y1="155" x2="230" y2="155" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SELF-OBSERVATION (60) — right side                     -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="440" y="250" width="180" height="70" fill="none" stroke="black" stroke-width="1.5" />
    <text x="530" y="282" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">SELF-</text>
    <text x="530" y="300" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">OBSERVATION</text>
    <!-- Ref 60 -->
    <text x="625" y="268" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">60</text>
    <line x1="623" y1="268" x2="620" y2="270" stroke="black" stroke-width="0.5" />

    <!-- Self-observation feedback: right side → back to SNN right -->
    <line x1="620" y1="285" x2="700" y2="285" stroke="black" stroke-width="2" />
    <line x1="700" y1="285" x2="700" y2="155" stroke="black" stroke-width="2" />
    <line x1="700" y1="155" x2="620" y2="155" stroke="black" stroke-width="2" marker-end="url(#ah)" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- KEY INSIGHT BOX (62) — bottom left                     -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="170" y="520" width="220" height="60" fill="none" stroke="black" stroke-width="1" stroke-dasharray="5,3" />
    <text x="280" y="555" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">KEY INSIGHT</text>
    <!-- Ref 62 -->
    <text x="395" y="538" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">62</text>
    <line x1="393" y1="538" x2="390" y2="540" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- VALIDATION RESULTS (64) — bottom right                 -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="440" y="520" width="220" height="60" fill="none" stroke="black" stroke-width="1" stroke-dasharray="5,3" />
    <text x="550" y="555" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">VALIDATION</text>
    <!-- Ref 64 -->
    <text x="665" y="538" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">64</text>
    <line x1="663" y1="538" x2="660" y2="540" stroke="black" stroke-width="0.5" />

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- FIGURE LABEL                                           -->
    <!-- ══════════════════════════════════════════════════════ -->
    <text x="425" y="920" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="black">FIG. 4</text>

  </g>
</svg>
