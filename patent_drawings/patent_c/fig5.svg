<svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792">
  <rect width="100%" height="100%" fill="#fff" />
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>
  <text x="306" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">Sheet 5 of 7</text>

  <!-- 500: Resynchronization Payload (outer container) -->
  <rect x="100" y="100" width="412" height="420" rx="5" fill="none" stroke="#000" stroke-width="2" />
  <text x="306" y="125" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">RESYNCHRONIZATION PAYLOAD</text>
  <text x="510" y="115" font-family="Arial" font-size="14" font-weight="normal" fill="#000">500</text>
  <line x1="515" y1="115" x2="512" y2="107" stroke="black" stroke-width="0.5" />

  <!-- 502: Summary Statistics Section -->
  <rect x="120" y="140" width="372" height="100" rx="3" fill="none" stroke="#000" stroke-width="1.5" />
  <text x="140" y="160" font-family="Arial" font-size="10" font-weight="bold" fill="#000">502: SUMMARY STATISTICS (always included)</text>
  <line x1="120" y1="168" x2="492" y2="168" stroke="#000" stroke-width="1" />
  <text x="140" y="185" font-family="Arial" font-size="10" fill="#000">steps_autonomous: [integer]</text>
  <text x="140" y="200" font-family="Arial" font-size="10" fill="#000">energy_delta: [float] mWh</text>
  <text x="140" y="215" font-family="Arial" font-size="10" fill="#000">min_energy / max_energy / mean_energy</text>
  <text x="140" y="230" font-family="Arial" font-size="10" fill="#000">total_spikes / mean_spikes_per_step</text>
  <text x="420" y="230" font-family="Arial" font-size="10" fill="#000">~200 bytes</text>

  <!-- Arrow down -->
  <path d="M306 240v30" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- 504: Energy Delta Detail -->
  <rect x="120" y="270" width="160" height="70" rx="3" fill="none" stroke="#000" stroke-width="1.5" />
  <text x="200" y="290" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#000">504: ENERGY DELTA</text>
  <text x="140" y="310" font-family="Arial" font-size="10" fill="#000">energy_start: [float]</text>
  <text x="140" y="325" font-family="Arial" font-size="10" fill="#000">energy_end: [float]</text>
  <text x="290" y="350" font-family="Arial" font-size="14" font-weight="normal" fill="#000">504</text>
  <line x1="286" y1="346" x2="280" y2="340" stroke="black" stroke-width="0.5" />

  <!-- Annotation arrow from 504 -->
  <path d="M280 310h60" stroke="#000" stroke-width="1" marker-end="url(#arrow)" />
  <text x="350" y="315" font-family="Arial" font-size="10" fill="#000">Positive = gained</text>

  <!-- 506: Full Step Buffer Section (dashed - optional) -->
  <rect x="120" y="360" width="372" height="130" rx="3" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="4,2" />
  <text x="140" y="380" font-family="Arial" font-size="10" font-weight="bold" fill="#000">506: FULL STEP BUFFER (optional)</text>
  <line x1="120" y1="388" x2="492" y2="388" stroke="#000" stroke-width="0.8" />
  <text x="140" y="405" font-family="Arial" font-size="10" fill="#000">Step 0: {input, modulation, spikes, energy, temp, pattern}</text>
  <text x="140" y="420" font-family="Arial" font-size="10" fill="#000">Step 1: {input, modulation, spikes, energy, temp, pattern}</text>
  <text x="140" y="435" font-family="Arial" font-size="10" fill="#000">...</text>
  <text x="140" y="450" font-family="Arial" font-size="10" fill="#000">Step N: {input, modulation, spikes, energy, temp, pattern}</text>
  <text x="140" y="470" font-family="Arial" font-size="10" fill="#000">~100 bytes x N steps</text>
  <text x="140" y="483" font-family="Arial" font-size="10" fill="#000">(included when cognitive layer requests history)</text>
  <text x="500" y="350" font-family="Arial" font-size="14" font-weight="normal" fill="#000">506</text>
  <line x1="498" y1="354" x2="492" y2="360" stroke="black" stroke-width="0.5" />

  <!-- Granularity level annotations -->
  <path d="M100 190h-23v-50h23" stroke="#000" stroke-width="1" marker-end="url(#arrow)" fill="none" />
  <text x="50" y="170" font-family="Arial" font-size="9" fill="#000" transform="rotate(-90 50 170)">Level 1: Summary</text>

  <path d="M100 420h-23v50h23" stroke="#000" stroke-width="1" marker-end="url(#arrow)" fill="none" />
  <text x="50" y="455" font-family="Arial" font-size="9" fill="#000" transform="rotate(-90 50 455)">Level 2: Full</text>

  <!-- 508: Decision Diamond -->
  <path d="M306 525l55 40-55 40-55-40z" fill="none" stroke="#000" stroke-width="1.5" />
  <text x="306" y="560" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Full buffer</text>
  <text x="306" y="572" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">requested?</text>
  <text x="306" y="610" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">508</text>
  <line x1="306" y1="604" x2="306" y2="595" stroke="black" stroke-width="0.5" />

  <!-- Arrow from 506 to 508 -->
  <path d="M306 490v40" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Decision outputs -->
  <path d="M256 565H150v30" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" fill="none" />
  <text x="150" y="615" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">NO: Level 1</text>

  <path d="M356 565h106v30" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" fill="none" />
  <text x="462" y="615" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">YES: Level 2</text>


  <text x="306" y="720" font-family="Arial" font-size="18" font-weight="normal" text-anchor="middle" fill="#000">FIG. 5</text>
</svg>
