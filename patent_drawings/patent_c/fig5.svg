<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">5/7</text>

  <!-- Title -->
  <text x="387" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">RESYNCHRONIZATION PAYLOAD STRUCTURE</text>

  <!-- Main Payload Container (500) -->
  <rect x="125" y="170" width="525" height="600" rx="5" fill="none" stroke="black" stroke-width="3"/>
  <text x="635" y="187" font-family="Arial, sans-serif" font-size="14" text-anchor="end">500</text>
  <text x="387" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Resynchronization Payload</text>

  <!-- Summary Statistics Box (502) -->
  <rect x="140" y="230" width="495" height="200" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="620" y="247" font-family="Arial, sans-serif" font-size="14" text-anchor="end">502</text>
  <text x="387" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Summary Statistics (ALWAYS included)</text>
  <text x="387" y="280" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">~200 bytes</text>

  <text x="175" y="310" font-family="Courier New, monospace" font-size="14" text-anchor="start">steps_autonomous: [integer]</text>
  <text x="175" y="332" font-family="Courier New, monospace" font-size="14" text-anchor="start">energy_delta: [float] mWh</text>
  <text x="175" y="354" font-family="Courier New, monospace" font-size="14" text-anchor="start">min_energy: [float] mWh</text>
  <text x="175" y="376" font-family="Courier New, monospace" font-size="14" text-anchor="start">max_energy: [float] mWh</text>
  <text x="175" y="398" font-family="Courier New, monospace" font-size="14" text-anchor="start">mean_energy: [float] mWh</text>
  <text x="175" y="420" font-family="Courier New, monospace" font-size="14" text-anchor="start">total_spikes: [integer]</text>

  <!-- Energy Delta Box (504) -->
  <rect x="140" y="450" width="220" height="100" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="350" y="467" font-family="Arial, sans-serif" font-size="14" text-anchor="end">504</text>
  <text x="250" y="480" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Energy Delta</text>
  <text x="250" y="505" font-family="Courier New, monospace" font-size="14" text-anchor="middle">energy_start: [float]</text>
  <text x="250" y="530" font-family="Courier New, monospace" font-size="14" text-anchor="middle">energy_end: [float]</text>

  <!-- Arrow and annotation -->
  <line x1="360" y1="510" x2="420" y2="510" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="430" y="500" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Positive =</text>
  <text x="430" y="520" font-family="Arial, sans-serif" font-size="14" text-anchor="start">gained energy</text>

  <!-- Full Step Buffer Box (506) -->
  <rect x="140" y="570" width="495" height="180" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="620" y="587" font-family="Arial, sans-serif" font-size="14" text-anchor="end">506</text>
  <text x="387" y="600" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Full Step Buffer (OPTIONAL)</text>
  <text x="387" y="620" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">~100 bytes x N steps</text>

  <text x="175" y="655" font-family="Courier New, monospace" font-size="14" text-anchor="start">Step 0: {input, mod, spikes, energy, temp, pattern}</text>
  <text x="175" y="677" font-family="Courier New, monospace" font-size="14" text-anchor="start">Step 1: {input, mod, spikes, energy, temp, pattern}</text>
  <text x="175" y="699" font-family="Arial, sans-serif" font-size="14" text-anchor="start">. . .</text>
  <text x="175" y="718" font-family="Courier New, monospace" font-size="14" text-anchor="start">Step N: {input, mod, spikes, energy, temp, pattern}</text>
  <text x="175" y="738" font-family="Courier New, monospace" font-size="14" text-anchor="start">Max N = 10,000</text>

  <!-- Decision Diamond (508) — enlarged for clear text -->
  <polygon points="387,800 445,835 387,870 329,835" fill="none" stroke="black" stroke-width="2"/>
  <text x="387" y="840" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Full?</text>
  <text x="387" y="892" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">508</text>

  <!-- Decision branches -->
  <line x1="329" y1="835" x2="200" y2="835" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="265" y="825" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">No: Summary only</text>

  <line x1="445" y1="835" x2="580" y2="835" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="515" y="825" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Yes: Summary + Buffer</text>

  <!-- Figure Label -->
  <text x="387" y="950" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">FIG. 5</text>
</svg>
