<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">6/7</text>

  <!-- Title -->
  <text x="387" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">RECOVERY SCENARIOS</text>

  <!-- Scenario A: Normal Reconnection (600) -->
  <text x="387" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Scenario A: Normal Reconnection</text>
  <text x="660" y="210" font-family="Arial, sans-serif" font-size="14" text-anchor="start">600</text>
  <line x1="658" y1="214" x2="652" y2="220" stroke="black" stroke-width="0.75"/>

  <!-- Timeline A (compressed) -->
  <line x1="125" y1="220" x2="650" y2="220" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="125" y1="200" x2="125" y2="240" stroke="black" stroke-width="2"/>

  <text x="169" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CONNECTED</text>
  <text x="169" y="255" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Claude active</text>
  <line x1="226" y1="200" x2="226" y2="240" stroke="black" stroke-width="2"/>

  <text x="257" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">TIMEOUT</text>
  <text x="257" y="255" font-family="Courier New, monospace" font-size="14" text-anchor="middle">30s</text>
  <line x1="288" y1="200" x2="288" y2="240" stroke="black" stroke-width="2"/>

  <text x="389" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">AUTONOMOUS</text>
  <text x="389" y="255" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Self-regulation</text>
  <line x1="491" y1="200" x2="491" y2="240" stroke="black" stroke-width="2"/>

  <text x="522" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">RESYNC</text>
  <text x="522" y="255" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Buffer tx</text>
  <line x1="553" y1="200" x2="553" y2="240" stroke="black" stroke-width="2"/>

  <text x="601" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CONNECTED</text>
  <text x="601" y="255" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Restored</text>

  <!-- Scenario B: Crash Recovery (602) -->
  <text x="387" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Scenario B: Crash Recovery</text>
  <text x="660" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="start">602</text>
  <line x1="658" y1="344" x2="652" y2="350" stroke="black" stroke-width="0.75"/>

  <!-- Timeline B (compressed) -->
  <line x1="125" y1="350" x2="650" y2="350" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="125" y1="330" x2="125" y2="370" stroke="black" stroke-width="2"/>

  <text x="170" y="325" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">CONNECTED</text>
  <text x="170" y="385" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Normal</text>
  <line x1="230" y1="330" x2="230" y2="370" stroke="black" stroke-width="2"/>

  <text x="272" y="325" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">CRASH</text>
  <text x="272" y="385" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Server dies</text>
  <line x1="315" y1="330" x2="315" y2="370" stroke="black" stroke-width="2"/>

  <text x="368" y="325" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">RESTART</text>
  <text x="368" y="385" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Relaunched</text>
  <line x1="420" y1="330" x2="420" y2="370" stroke="black" stroke-width="2"/>

  <text x="480" y="325" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SNAPSHOT</text>
  <text x="480" y="385" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Load .json</text>
  <line x1="540" y1="330" x2="540" y2="370" stroke="black" stroke-width="2"/>

  <text x="600" y="325" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">CONNECTED</text>
  <text x="600" y="385" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Restored</text>

  <text x="482" y="405" font-family="Courier New, monospace" font-size="14" text-anchor="middle">Max loss: 50 steps</text>

  <!-- Scenario C: Clean Shutdown (604) -->
  <text x="387" y="445" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Scenario C: Clean Shutdown</text>
  <text x="660" y="485" font-family="Arial, sans-serif" font-size="14" text-anchor="start">604</text>
  <line x1="658" y1="489" x2="652" y2="495" stroke="black" stroke-width="0.75"/>

  <!-- Timeline C (compressed) -->
  <line x1="125" y1="495" x2="650" y2="495" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="125" y1="475" x2="125" y2="515" stroke="black" stroke-width="2"/>

  <text x="191" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CONNECTED</text>
  <text x="191" y="530" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Normal operation</text>
  <line x1="270" y1="475" x2="270" y2="515" stroke="black" stroke-width="2"/>

  <text x="350" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">AUTONOMOUS</text>
  <text x="350" y="530" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Fallback active</text>
  <line x1="430" y1="475" x2="430" y2="515" stroke="black" stroke-width="2"/>

  <text x="473" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">EOF</text>
  <text x="473" y="530" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">stdin closed</text>
  <line x1="518" y1="475" x2="518" y2="515" stroke="black" stroke-width="2"/>

  <text x="584" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SHUTDOWN</text>
  <text x="584" y="530" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Final snapshot</text>
  <text x="584" y="550" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Zero data loss</text>

  <!-- Recovery Guarantees Box (606) -->
  <rect x="125" y="580" width="525" height="150" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="635" y="597" font-family="Arial, sans-serif" font-size="14" text-anchor="end">606</text>
  <text x="387" y="610" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Recovery Guarantees</text>

  <text x="155" y="645" font-family="Arial, sans-serif" font-size="12" text-anchor="start">Normal reconnection: Full continuity, resync payload transmitted</text>
  <text x="155" y="668" font-family="Arial, sans-serif" font-size="12" text-anchor="start">Crash recovery: Max 50 steps lost (snapshot every 50 steps)</text>
  <text x="155" y="691" font-family="Arial, sans-serif" font-size="12" text-anchor="start">Clean shutdown: Zero data loss (final snapshot on EOF)</text>
  <text x="155" y="714" font-family="Arial, sans-serif" font-size="12" text-anchor="start">Max autonomous duration: 10,000 steps (~50 hours)</text>

  <!-- Legend -->
  <rect x="115" y="750" width="400" height="40" rx="3" fill="none" stroke="black" stroke-width="1"/>
  <line x1="135" y1="770" x2="215" y2="770" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="225" y="775" font-family="Arial, sans-serif" font-size="14" text-anchor="start">System actively processing</text>

  <!-- Figure Label -->
  <text x="387" y="950" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">FIG. 6</text>
</svg>
