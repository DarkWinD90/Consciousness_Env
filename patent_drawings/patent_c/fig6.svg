<text x="655" y="490" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Zero data loss</text>
<text x="740" y="420" font-family="Arial, sans-serif" font-size="14" text-anchor="start">604</text>
<line x1="738" y1="423" x2="730" y2="430" stroke="black" stroke-width="0.5"/>
<rect x="150" y="510" width="550" height="150" rx="5" fill="none" stroke="black" stroke-width="2"/>
<text x="425" y="535" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Recovery Guarantees</text>
<text x="180" y="565" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Normal reconnection: Full continuity, resync payload transmitted</text>
<text x="180" y="590" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Crash recovery: Max 50 steps lost (snapshot every 50 steps)</text>
<text x="180" y="615" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Clean shutdown: Zero data loss (final snapshot on EOF)</text>
<text x="180" y="640" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Max autonomous duration: 10,000 steps (~50 hours)</text>
<text x="705" y="520" font-family="Arial, sans-serif" font-size="14" text-anchor="start">606</text>
<line x1="703" y1="523" x2="700" y2="535" stroke="black" stroke-width="0.5"/>
<line x1="150" y1="700" x2="250" y2="700" stroke="black" stroke-width="2"/>
<text x="260" y="705" font-family="Arial, sans-serif" font-size="14" text-anchor="start">System actively processing</text>
<line x1="400" y1="700" x2="500" y2="700" stroke="black" stroke-width="2"/>
<text x="510" y="705" font-family="Arial, sans-serif" font-size="14" text-anchor="start">System in transition</text>

<text x="425" y="920" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">FIG. 6</text>
