<svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792">
  <rect width="100%" height="100%" fill="#fff" />
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>
  <text x="306" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">Sheet 6 of 7</text>

  <!-- 600: Normal Reconnection Timeline (top) -->
  <g transform="translate(100,100)">
    <text x="0" y="-10" font-family="Arial" font-size="10" font-weight="bold" fill="#000">600: NORMAL RECONNECTION</text>
    <!-- Timeline bar -->
    <path d="M0 30h400" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)" />
    <!-- Phase boxes -->
    <rect x="0" y="10" width="70" height="40" fill="none" stroke="#000" stroke-width="1.2" />
    <text x="35" y="35" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">CONNECTED</text>
    <rect x="80" y="10" width="60" height="40" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="2,2" />
    <text x="110" y="30" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">TIMEOUT</text>
    <text x="110" y="42" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">30s</text>
    <rect x="150" y="10" width="100" height="40" fill="none" stroke="#000" stroke-width="1.5" />
    <text x="200" y="30" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">AUTONOMOUS</text>
    <text x="200" y="42" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">N steps</text>
    <rect x="260" y="10" width="60" height="40" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4,2" />
    <text x="290" y="35" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">RESYNC</text>
    <rect x="330" y="10" width="70" height="40" fill="none" stroke="#000" stroke-width="1.2" />
    <text x="365" y="35" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">CONNECTED</text>
    <!-- Annotations -->
    <text x="75" y="65" font-family="Arial" font-size="10" fill="#000">Claude silent</text>
    <text x="155" y="65" font-family="Arial" font-size="10" fill="#000">Fallback engages</text>
    <text x="275" y="65" font-family="Arial" font-size="10" fill="#000">resync()</text>
    <text x="408" y="20" font-family="Arial" font-size="14" font-weight="normal" fill="#000">600</text>
  </g>

  <!-- 602: Crash Recovery Timeline (middle) -->
  <g transform="translate(100,220)">
    <text x="0" y="-10" font-family="Arial" font-size="10" font-weight="bold" fill="#000">602: CRASH RECOVERY</text>
    <!-- Timeline bar -->
    <path d="M0 30h400" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)" />
    <!-- Phase boxes -->
    <rect x="0" y="10" width="70" height="40" fill="none" stroke="#000" stroke-width="1.2" />
    <text x="35" y="35" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">CONNECTED</text>
    <!-- Crash indicator (bold X) -->
    <path d="M85 15l20 30M85 45l20-30" stroke="#000" stroke-width="2" />
    <text x="95" y="60" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">CRASH</text>
    <rect x="120" y="10" width="80" height="40" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4,2" />
    <text x="160" y="30" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">RESTART</text>
    <text x="160" y="42" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Process relaunch</text>
    <rect x="210" y="10" width="90" height="40" fill="none" stroke="#000" stroke-width="1.5" />
    <text x="255" y="30" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">SNAPSHOT</text>
    <text x="255" y="42" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Load latest.json</text>
    <rect x="310" y="10" width="90" height="40" fill="none" stroke="#000" stroke-width="1.2" />
    <text x="355" y="35" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">CONNECTED</text>
    <!-- Annotation -->
    <text x="255" y="65" font-family="Arial" font-size="10" fill="#000">Max 50 steps lost</text>
    <text x="408" y="20" font-family="Arial" font-size="14" font-weight="normal" fill="#000">602</text>
  </g>

  <!-- 604: Clean Shutdown Timeline (bottom) -->
  <g transform="translate(100,340)">
    <text x="0" y="-10" font-family="Arial" font-size="10" font-weight="bold" fill="#000">604: CLEAN SHUTDOWN</text>
    <!-- Timeline bar -->
    <path d="M0 30h400" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)" />
    <!-- Phase boxes -->
    <rect x="0" y="10" width="80" height="40" fill="none" stroke="#000" stroke-width="1.2" />
    <text x="40" y="35" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">CONNECTED</text>
    <rect x="90" y="10" width="100" height="40" fill="none" stroke="#000" stroke-width="1.5" />
    <text x="140" y="35" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">AUTONOMOUS</text>
    <rect x="200" y="10" width="80" height="40" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="2,2" />
    <text x="240" y="30" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">EOF</text>
    <text x="240" y="42" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">stdin closed</text>
    <rect x="290" y="10" width="110" height="40" fill="none" stroke="#000" stroke-width="1.5" />
    <text x="345" y="30" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">SHUTDOWN</text>
    <text x="345" y="42" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Final snapshot</text>
    <!-- Annotation -->
    <text x="290" y="65" font-family="Arial" font-size="10" fill="#000">State preserved</text>
    <text x="290" y="77" font-family="Arial" font-size="10" fill="#000">for next session</text>
    <text x="408" y="20" font-family="Arial" font-size="14" font-weight="normal" fill="#000">604</text>
  </g>

  <!-- 606: Recovery Guarantees Box -->
  <rect x="100" y="460" width="412" height="100" rx="5" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4,2" />
  <text x="120" y="480" font-family="Arial" font-size="10" font-weight="bold" fill="#000">606: RECOVERY GUARANTEES</text>
  <line x1="100" y1="490" x2="512" y2="490" stroke="#000" stroke-width="0.8" />
  <!-- Legend items -->
  <path d="M120 510h40" stroke="#000" stroke-width="1.5" />
  <text x="170" y="513" font-family="Arial" font-size="10" fill="#000">Solid line: System actively processing</text>
  <path d="M120 530h40" stroke="#000" stroke-width="1" stroke-dasharray="4,2" />
  <text x="170" y="533" font-family="Arial" font-size="10" fill="#000">Dashed line: System in transition</text>
  <circle cx="140" cy="548" r="5" fill="#000" />
  <text x="170" y="553" font-family="Arial" font-size="10" fill="#000">Bold markers: No data loss at state change</text>
  <text x="510" y="475" font-family="Arial" font-size="14" font-weight="normal" fill="#000">606</text>


  <text x="306" y="720" font-family="Arial" font-size="18" font-weight="normal" text-anchor="middle" fill="#000">FIG. 6</text>
</svg>
