<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="black">3/7</text>

  <!-- Anchor components for axis endpoints -->
  <rect x="155" y="675" width="10" height="10" fill="none" stroke="black" stroke-width="1" />
  <rect x="155" y="145" width="10" height="10" fill="none" stroke="black" stroke-width="1" />
  <rect x="705" y="675" width="10" height="10" fill="none" stroke="black" stroke-width="1" />
  <rect x="235" y="235" width="10" height="10" fill="none" stroke="black" stroke-width="1" />
  <rect x="235" y="675" width="10" height="10" fill="none" stroke="black" stroke-width="1" />
  <rect x="315" y="385" width="10" height="10" fill="none" stroke="black" stroke-width="1" />
  <rect x="315" y="675" width="10" height="10" fill="none" stroke="black" stroke-width="1" />
  <rect x="535" y="235" width="10" height="10" fill="none" stroke="black" stroke-width="1" />
  <rect x="535" y="675" width="10" height="10" fill="none" stroke="black" stroke-width="1" />

  <!-- Graph axes -->
  <!-- 44: Y-axis (Modulation value) -->
  <line x1="160" y1="680" x2="160" y2="150" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
  <text x="145" y="145" font-family="Arial, sans-serif" font-size="14" fill="black">44</text>
  <line x1="157" y1="148" x2="160" y2="155" stroke="black" stroke-width="0.5" />
  <text x="140" y="420" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black" transform="rotate(-90 140 420)">Modulation Value</text>

  <!-- Y-axis tick marks and values -->
  <line x1="152" y1="240" x2="168" y2="240" stroke="black" stroke-width="1" />
  <text x="148" y="245" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">+0.3</text>
  <line x1="152" y1="390" x2="168" y2="390" stroke="black" stroke-width="1" />
  <text x="148" y="395" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">0.0</text>
  <line x1="152" y1="470" x2="168" y2="470" stroke="black" stroke-width="1" />
  <text x="148" y="475" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">-0.1</text>
  <line x1="152" y1="580" x2="168" y2="580" stroke="black" stroke-width="1" />
  <text x="148" y="585" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">-0.4</text>

  <!-- 48: X-axis (Energy mWh) -->
  <line x1="160" y1="680" x2="710" y2="680" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
  <text x="700" y="715" font-family="Arial, sans-serif" font-size="14" fill="black">48</text>
  <line x1="698" y1="712" x2="695" y2="700" stroke="black" stroke-width="0.5" />
  <text x="425" y="735" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">System Energy Level (mWh)</text>

  <!-- X-axis tick marks and values -->
  <line x1="160" y1="675" x2="160" y2="690" stroke="black" stroke-width="1" />
  <text x="160" y="710" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">0</text>
  <line x1="160" y1="703" x2="160" y2="690" stroke="black" stroke-width="0.5" />
  <line x1="240" y1="675" x2="240" y2="690" stroke="black" stroke-width="1" />
  <text x="240" y="710" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">15</text>
  <line x1="320" y1="675" x2="320" y2="690" stroke="black" stroke-width="1" />
  <text x="320" y="710" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">30</text>
  <line x1="540" y1="675" x2="540" y2="690" stroke="black" stroke-width="1" />
  <text x="540" y="710" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">80</text>
  <line x1="680" y1="675" x2="680" y2="690" stroke="black" stroke-width="1" />
  <text x="680" y="710" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">100</text>

  <!-- Vertical threshold lines (dashed) -->
  <line x1="240" y1="240" x2="240" y2="680" stroke="black" stroke-width="0.8" stroke-dasharray="4,4" />
  <line x1="320" y1="390" x2="320" y2="680" stroke="black" stroke-width="0.8" stroke-dasharray="4,4" />
  <line x1="540" y1="240" x2="540" y2="680" stroke="black" stroke-width="0.8" stroke-dasharray="4,4" />

  <!-- Step function curve -->
  <!-- 50: CRITICAL plateau (0-15 mWh, -0.4) -->
  <line x1="160" y1="580" x2="240" y2="580" stroke="black" stroke-width="2.5" />
  <text x="200" y="610" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">CRITICAL</text>
  <text x="200" y="565" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">50</text>
  <line x1="200" y1="568" x2="200" y2="578" stroke="black" stroke-width="0.5" />

  <!-- Step up at 15 -->
  <line x1="240" y1="580" x2="240" y2="470" stroke="black" stroke-width="2.5" />

  <!-- 52: LOW plateau (15-30 mWh, -0.1) -->
  <line x1="240" y1="470" x2="320" y2="470" stroke="black" stroke-width="2.5" />
  <text x="280" y="500" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">LOW</text>
  <text x="280" y="455" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">52</text>
  <line x1="280" y1="458" x2="280" y2="468" stroke="black" stroke-width="0.5" />

  <!-- Step up at 30 -->
  <line x1="320" y1="470" x2="320" y2="390" stroke="black" stroke-width="2.5" />

  <!-- 54: NORMAL plateau (30-80 mWh, 0.0) -->
  <line x1="320" y1="390" x2="540" y2="390" stroke="black" stroke-width="2.5" />
  <text x="430" y="375" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">NORMAL</text>
  <text x="430" y="420" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">54</text>
  <line x1="430" y1="415" x2="430" y2="392" stroke="black" stroke-width="0.5" />

  <!-- Step up at 80 -->
  <line x1="540" y1="390" x2="540" y2="240" stroke="black" stroke-width="2.5" />

  <!-- 56: SURPLUS plateau (80+ mWh, +0.3) -->
  <line x1="540" y1="240" x2="680" y2="240" stroke="black" stroke-width="2.5" />
  <text x="610" y="225" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">SURPLUS</text>
  <text x="610" y="265" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">56</text>
  <line x1="610" y1="260" x2="610" y2="242" stroke="black" stroke-width="0.5" />

  <!-- 46: Behavioral Effects Table (bottom) -->
  <rect x="160" y="770" width="540" height="120" rx="5" fill="none" stroke="black" stroke-width="1" stroke-dasharray="4,2" />
  <text x="185" y="795" font-family="Arial, sans-serif" font-size="14" fill="black">Behavioral Effects:</text>
  <text x="185" y="820" font-family="Arial, sans-serif" font-size="14" fill="black">CRITICAL (-0.4): Maximum conservation - inhibit neural activity</text>
  <text x="185" y="840" font-family="Arial, sans-serif" font-size="14" fill="black">LOW (-0.1): Cautious operation - slightly reduce activity</text>
  <text x="185" y="860" font-family="Arial, sans-serif" font-size="14" fill="black">NORMAL (0.0): Standard autonomous processing</text>
  <text x="185" y="880" font-family="Arial, sans-serif" font-size="14" fill="black">SURPLUS (+0.3): Opportunistic exploration - utilize excess</text>
  <text x="710" y="790" font-family="Arial, sans-serif" font-size="14" fill="black">46</text>
  <line x1="708" y1="790" x2="700" y2="790" stroke="black" stroke-width="0.5" />

  <text x="425" y="980" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="black">FIG. 3</text>
</svg>
