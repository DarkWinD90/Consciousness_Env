<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="black" stroke-width="1"/>
    </pattern>
    <pattern id="hatchLight" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="black" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">3/7</text>
  <g transform="translate(0, 50)">
<text x="425" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ENERGY-AWARE MODULATION CURVE</text>
<line x1="150" y1="600" x2="150" y2="200" stroke="black" stroke-width="2"/>
<text x="115" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" transform="rotate(-90 115 400)">Autonomous Modulation Value</text>
<line x1="150" y1="600" x2="700" y2="600" stroke="black" stroke-width="2"/>
<text x="425" y="650" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">System Energy Level (mWh)</text>
<line x1="145" y1="550" x2="150" y2="550" stroke="black" stroke-width="2"/>
<text x="135" y="555" font-family="Courier New, monospace" font-size="14" text-anchor="end">-0.4</text>
<line x1="150" y1="550" x2="700" y2="550" stroke="black" stroke-width="0.5"/>
<line x1="145" y1="450" x2="150" y2="450" stroke="black" stroke-width="2"/>
<text x="135" y="455" font-family="Courier New, monospace" font-size="14" text-anchor="end">-0.1</text>
<line x1="150" y1="450" x2="700" y2="450" stroke="black" stroke-width="0.5"/>
<line x1="145" y1="400" x2="150" y2="400" stroke="black" stroke-width="2"/>
<text x="135" y="405" font-family="Courier New, monospace" font-size="14" text-anchor="end">0.0</text>
<line x1="150" y1="400" x2="700" y2="400" stroke="black" stroke-width="0.5"/>
<line x1="145" y1="300" x2="150" y2="300" stroke="black" stroke-width="2"/>
<text x="135" y="305" font-family="Courier New, monospace" font-size="14" text-anchor="end">+0.3</text>
<line x1="150" y1="300" x2="700" y2="300" stroke="black" stroke-width="0.5"/>
<line x1="150.0" y1="600" x2="150.0" y2="605" stroke="black" stroke-width="2"/>
<text x="150.0" y="625" font-family="Courier New, monospace" font-size="14" text-anchor="middle">0</text>
<line x1="232.5" y1="600" x2="232.5" y2="605" stroke="black" stroke-width="2"/>
<text x="232.5" y="625" font-family="Courier New, monospace" font-size="14" text-anchor="middle">15</text>
<line x1="315.0" y1="600" x2="315.0" y2="605" stroke="black" stroke-width="2"/>
<text x="315.0" y="625" font-family="Courier New, monospace" font-size="14" text-anchor="middle">30</text>
<line x1="590.0" y1="600" x2="590.0" y2="605" stroke="black" stroke-width="2"/>
<text x="590.0" y="625" font-family="Courier New, monospace" font-size="14" text-anchor="middle">80</text>
<line x1="700.0" y1="600" x2="700.0" y2="605" stroke="black" stroke-width="2"/>
<text x="700.0" y="625" font-family="Courier New, monospace" font-size="14" text-anchor="middle">100</text>
<line x1="150" y1="550" x2="232.5" y2="550" stroke="black" stroke-width="3"/>
<rect x="150" y="550" width="82.5" height="50" fill="url(#hatch)" stroke="none" opacity="0.3"/>
<text x="191.25" y="530" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CRITICAL</text>
<line x1="232.5" y1="550" x2="232.5" y2="450" stroke="black" stroke-width="3"/>
<line x1="232.5" y1="450" x2="315.0" y2="450" stroke="black" stroke-width="3"/>
<text x="273.75" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">LOW</text>
<line x1="315.0" y1="450" x2="315.0" y2="400" stroke="black" stroke-width="3"/>
<line x1="315.0" y1="400" x2="590.0" y2="400" stroke="black" stroke-width="3"/>
<text x="452.5" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">NORMAL</text>
<line x1="590.0" y1="400" x2="590.0" y2="300" stroke="black" stroke-width="3"/>
<line x1="590.0" y1="300" x2="700" y2="300" stroke="black" stroke-width="3"/>
<text x="645.0" y="280" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SURPLUS</text>
<text x="710" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="start">300</text>
<line x1="708" y1="400" x2="700" y2="400" stroke="black" stroke-width="0.5"/>
<rect x="150" y="680" width="550" height="130" rx="5" fill="none" stroke="black" stroke-width="2"/>
<text x="425" y="705" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Behavioral Effects</text>
<text x="200" y="730" font-family="Courier New, monospace" font-size="14" text-anchor="start">&lt; 15 mWh</text>
<text x="350" y="730" font-family="Courier New, monospace" font-size="14" text-anchor="start">mod = -0.4</text>
<text x="450" y="730" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Maximum conservation - inhibit activity</text>
<text x="200" y="750" font-family="Courier New, monospace" font-size="14" text-anchor="start">15-30 mWh</text>
<text x="350" y="750" font-family="Courier New, monospace" font-size="14" text-anchor="start">mod = -0.1</text>
<text x="450" y="750" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Cautious - slightly reduce activity</text>
<text x="200" y="770" font-family="Courier New, monospace" font-size="14" text-anchor="start">30-80 mWh</text>
<text x="350" y="770" font-family="Courier New, monospace" font-size="14" text-anchor="start">mod = 0.0</text>
<text x="450" y="770" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Neutral - standard processing</text>
<text x="200" y="790" font-family="Courier New, monospace" font-size="14" text-anchor="start">&gt; 80 mWh</text>
<text x="350" y="790" font-family="Courier New, monospace" font-size="14" text-anchor="start">mod = 0.3</text>
<text x="450" y="790" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Exploration - utilize surplus</text>
<text x="705" y="690" font-family="Arial, sans-serif" font-size="14" text-anchor="start">302</text>
<line x1="703" y1="690" x2="700" y2="705" stroke="black" stroke-width="0.5"/>

<text x="425" y="920" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">FIG. 3</text>
  </g>
