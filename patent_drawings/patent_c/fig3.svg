<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="black" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">3/7</text>

  <!-- Title -->
  <text x="422" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ENERGY-AWARE MODULATION CURVE</text>

  <!-- Y-axis -->
  <line x1="160" y1="650" x2="160" y2="250" stroke="black" stroke-width="2"/>
  <text x="100" y="450" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" transform="rotate(-90 100 450)">Modulation</text>

  <!-- X-axis -->
  <line x1="160" y1="650" x2="685" y2="650" stroke="black" stroke-width="2"/>
  <text x="422" y="700" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">System Energy Level (mWh)</text>

  <!-- Y-axis tick marks and labels -->
  <line x1="155" y1="600" x2="160" y2="600" stroke="black" stroke-width="2"/>
  <text x="150" y="605" font-family="Courier New, monospace" font-size="14" text-anchor="end">-0.4</text>
  <line x1="160" y1="600" x2="685" y2="600" stroke="black" stroke-width="0.5" stroke-dasharray="3,3"/>

  <line x1="155" y1="500" x2="160" y2="500" stroke="black" stroke-width="2"/>
  <text x="150" y="505" font-family="Courier New, monospace" font-size="14" text-anchor="end">-0.1</text>
  <line x1="160" y1="500" x2="685" y2="500" stroke="black" stroke-width="0.5" stroke-dasharray="3,3"/>

  <line x1="155" y1="450" x2="160" y2="450" stroke="black" stroke-width="2"/>
  <text x="150" y="455" font-family="Courier New, monospace" font-size="14" text-anchor="end">0.0</text>
  <line x1="160" y1="450" x2="685" y2="450" stroke="black" stroke-width="0.5" stroke-dasharray="3,3"/>

  <line x1="155" y1="350" x2="160" y2="350" stroke="black" stroke-width="2"/>
  <text x="150" y="355" font-family="Courier New, monospace" font-size="14" text-anchor="end">+0.3</text>
  <line x1="160" y1="350" x2="685" y2="350" stroke="black" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- X-axis tick marks and labels -->
  <line x1="160" y1="650" x2="160" y2="655" stroke="black" stroke-width="2"/>
  <text x="160" y="675" font-family="Courier New, monospace" font-size="14" text-anchor="middle">0</text>

  <line x1="238" y1="650" x2="238" y2="655" stroke="black" stroke-width="2"/>
  <text x="238" y="675" font-family="Courier New, monospace" font-size="14" text-anchor="middle">15</text>

  <line x1="318" y1="650" x2="318" y2="655" stroke="black" stroke-width="2"/>
  <text x="318" y="675" font-family="Courier New, monospace" font-size="14" text-anchor="middle">30</text>

  <line x1="580" y1="650" x2="580" y2="655" stroke="black" stroke-width="2"/>
  <text x="580" y="675" font-family="Courier New, monospace" font-size="14" text-anchor="middle">80</text>

  <line x1="685" y1="650" x2="685" y2="655" stroke="black" stroke-width="2"/>
  <text x="685" y="675" font-family="Courier New, monospace" font-size="14" text-anchor="middle">100</text>

  <!-- Energy Modulation Curve (300) - Reference numeral outside chart area -->
  <text x="700" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="start">300</text>

  <!-- CRITICAL zone: 0-15 mWh, mod = -0.4 -->
  <line x1="160" y1="600" x2="238" y2="600" stroke="black" stroke-width="3"/>
  <rect x="160" y="600" width="78" height="50" fill="url(#hatch)" stroke="none"/>
  <text x="199" y="580" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CRITICAL</text>

  <!-- Step up at 15 mWh -->
  <line x1="238" y1="600" x2="238" y2="500" stroke="black" stroke-width="3"/>

  <!-- LOW zone: 15-30 mWh, mod = -0.1 -->
  <line x1="238" y1="500" x2="318" y2="500" stroke="black" stroke-width="3"/>
  <text x="278" y="480" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">LOW</text>

  <!-- Step up at 30 mWh -->
  <line x1="318" y1="500" x2="318" y2="450" stroke="black" stroke-width="3"/>

  <!-- NORMAL zone: 30-80 mWh, mod = 0.0 -->
  <line x1="318" y1="450" x2="580" y2="450" stroke="black" stroke-width="3"/>
  <text x="449" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">NORMAL</text>

  <!-- Step up at 80 mWh -->
  <line x1="580" y1="450" x2="580" y2="350" stroke="black" stroke-width="3"/>

  <!-- SURPLUS zone: 80-100 mWh, mod = +0.3 -->
  <line x1="580" y1="350" x2="685" y2="350" stroke="black" stroke-width="3"/>
  <text x="632" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SURPLUS</text>

  <!-- Behavioral Effects Box (302) -->
  <rect x="160" y="730" width="525" height="150" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="670" y="747" font-family="Arial, sans-serif" font-size="14" text-anchor="end">302</text>
  <text x="422" y="755" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Behavioral Effects</text>

  <text x="208" y="783" font-family="Courier New, monospace" font-size="14" text-anchor="start">&lt; 15 mWh</text>
  <text x="351" y="783" font-family="Courier New, monospace" font-size="14" text-anchor="start">mod = -0.4</text>
  <text x="494" y="783" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Maximum conservation</text>

  <text x="208" y="811" font-family="Courier New, monospace" font-size="14" text-anchor="start">15-30 mWh</text>
  <text x="351" y="811" font-family="Courier New, monospace" font-size="14" text-anchor="start">mod = -0.1</text>
  <text x="494" y="811" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Cautious operation</text>

  <text x="208" y="839" font-family="Courier New, monospace" font-size="14" text-anchor="start">30-80 mWh</text>
  <text x="351" y="839" font-family="Courier New, monospace" font-size="14" text-anchor="start">mod = 0.0</text>
  <text x="494" y="839" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Standard processing</text>

  <text x="208" y="867" font-family="Courier New, monospace" font-size="14" text-anchor="start">&gt; 80 mWh</text>
  <text x="351" y="867" font-family="Courier New, monospace" font-size="14" text-anchor="start">mod = +0.3</text>
  <text x="494" y="867" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Exploration enabled</text>

  <!-- Figure Label -->
  <text x="422" y="950" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">FIG. 3</text>
</svg>
