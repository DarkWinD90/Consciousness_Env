<svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792">
  <rect width="100%" height="100%" fill="#fff" />
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>
  <text x="306" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">Sheet 2 of 7</text>

  <!-- 200: CONNECTED state (left, bold outline) -->
  <circle cx="170" cy="220" r="55" fill="none" stroke="#000" stroke-width="2" />
  <text x="170" y="210" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">CONNECTED</text>
  <text x="170" y="225" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Cognitive layer</text>
  <text x="170" y="238" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">active</text>
  <text x="170" y="290" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">200</text>

  <!-- Start indicator pointing to 200 -->
  <path d="M80 220h35" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="102" y="215" font-family="Arial" font-size="10" text-anchor="end" fill="#000">START</text>

  <!-- 202: AUTONOMOUS state (right) -->
  <circle cx="450" cy="220" r="55" fill="none" stroke="#000" stroke-width="1.5" />
  <text x="450" y="205" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">AUTONOMOUS</text>
  <text x="450" y="220" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Fallback active</text>
  <text x="450" y="233" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Self-regulated</text>
  <text x="450" y="290" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">202</text>

  <!-- 204: RECOVERING state (bottom center) -->
  <circle cx="310" cy="420" r="55" fill="none" stroke="#000" stroke-width="1.5" />
  <text x="310" y="410" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">RECOVERING</text>
  <text x="310" y="425" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Resync in</text>
  <text x="310" y="438" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">progress</text>
  <text x="310" y="490" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">204</text>

  <!-- 206: Transition 200 -> 202 (top arrow, timeout) -->
  <path d="M225 200h174" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="310" y="190" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Heartbeat timeout</text>
  <text x="310" y="202" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">(&gt;30s no tool call)</text>
  <text x="310" y="175" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">206</text>

  <!-- 208: Transition 202 -> 204 (diagonal down-left) -->
  <path d="M410 260l-59 124" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" fill="none" />
  <text x="400" y="335" font-family="Arial" font-size="10" fill="#000">resync()</text>
  <text x="400" y="348" font-family="Arial" font-size="10" fill="#000">called</text>
  <text x="420" y="320" font-family="Arial" font-size="14" font-weight="normal" fill="#000">208</text>

  <!-- 210: Transition 204 -> 200 (diagonal up-left) -->
  <path d="M260 385l-64-117" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" fill="none" />
  <text x="185" y="340" font-family="Arial" font-size="10" fill="#000">Resync</text>
  <text x="185" y="352" font-family="Arial" font-size="10" fill="#000">complete</text>
  <text x="175" y="370" font-family="Arial" font-size="14" font-weight="normal" fill="#000">210</text>

  <!-- 212: Direct transition 202 -> 200 (dashed, bottom path) -->
  <path d="M395 250H216" stroke="#000" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrow)" />
  <text x="310" y="265" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">Any tool call (direct reconnect)</text>
  <text x="310" y="280" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#000">212</text>

  <!-- 214: Self-loop on 202 (autonomous steps) -->
  <path d="M495 185c40-25 40 70 0 45" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="480" y="155" font-family="Arial" font-size="10" fill="#000">Each step</text>
  <text x="480" y="167" font-family="Arial" font-size="10" fill="#000">(max 10K)</text>
  <text x="510" y="143" font-family="Arial" font-size="14" font-weight="normal" fill="#000">214</text>

  <!-- 216: State Legend Box -->
  <rect x="130" y="530" width="350" height="90" rx="5" fill="none" stroke="#000" stroke-width="1" />
  <text x="150" y="550" font-family="Arial" font-size="10" fill="#000">State Transition Legend:</text>
  <text x="150" y="570" font-family="Arial" font-size="10" fill="#000">200 CONNECTED: Cognitive layer provides input/modulation</text>
  <text x="150" y="585" font-family="Arial" font-size="10" fill="#000">202 AUTONOMOUS: Self-generated input, energy-aware modulation</text>
  <text x="150" y="600" font-family="Arial" font-size="10" fill="#000">204 RECOVERING: Buffer transmitted, restoring control</text>
  <text x="490" y="545" font-family="Arial" font-size="14" font-weight="normal" fill="#000">216</text>


  <text x="306" y="720" font-family="Arial" font-size="18" font-weight="normal" text-anchor="middle" fill="#000">FIG. 2</text>
</svg>
