<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="black">2/7</text>

  <!-- 26: CONNECTED state (left, bold outline) -->
  <circle cx="250" cy="310" r="75" fill="none" stroke="black" stroke-width="2" />
  <text x="250" y="295" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">CONNECTED</text>
  <text x="250" y="315" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">Cognitive layer</text>
  <text x="250" y="335" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">active</text>
  <text x="250" y="405" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">26</text>
  <line x1="250" y1="398" x2="250" y2="385" stroke="black" stroke-width="0.5" />

  <!-- Start indicator pointing to 26 -->
  <circle cx="120" cy="310" r="5" fill="black" stroke="black" stroke-width="1" />
  <line x1="125" y1="310" x2="175" y2="310" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
  <text x="145" y="300" font-family="Arial" font-size="14" text-anchor="middle" fill="black">START</text>

  <!-- 28: AUTONOMOUS state (right) -->
  <circle cx="620" cy="310" r="75" fill="none" stroke="black" stroke-width="1.5" />
  <text x="620" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">AUTONOMOUS</text>
  <text x="620" y="310" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">Fallback active</text>
  <text x="620" y="330" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">Self-regulated</text>
  <text x="620" y="405" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">28</text>
  <line x1="620" y1="398" x2="620" y2="385" stroke="black" stroke-width="0.5" />

  <!-- 30: RECOVERING state (bottom center) -->
  <circle cx="435" cy="580" r="75" fill="none" stroke="black" stroke-width="1.5" />
  <text x="435" y="565" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">RECOVERING</text>
  <text x="435" y="585" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">Resync in</text>
  <text x="435" y="605" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">progress</text>
  <text x="435" y="675" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">30</text>
  <line x1="435" y1="668" x2="435" y2="655" stroke="black" stroke-width="0.5" />

  <!-- 32: Transition 26 -> 28 (top arrow, timeout) -->
  <line x1="325" y1="280" x2="545" y2="280" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
  <text x="435" y="265" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">Heartbeat timeout</text>
  <text x="435" y="300" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">(&gt;30s no tool call)</text>
  <text x="435" y="245" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">32</text>
  <line x1="435" y1="248" x2="435" y2="260" stroke="black" stroke-width="0.5" />

  <!-- 34: Transition 28 -> 30 (diagonal down-left) -->
  <line x1="565" y1="365" x2="488" y2="527" stroke="black" stroke-width="1.5" fill="none" marker-end="url(#ah)" />
  <text x="555" y="460" font-family="Arial, sans-serif" font-size="14" fill="black">resync()</text>
  <text x="555" y="478" font-family="Arial, sans-serif" font-size="14" fill="black">called</text>
  <text x="580" y="440" font-family="Arial, sans-serif" font-size="14" fill="black">34</text>
  <line x1="578" y1="443" x2="565" y2="455" stroke="black" stroke-width="0.5" />

  <!-- 36: Transition 30 -> 26 (diagonal up-left) -->
  <line x1="370" y1="535" x2="290" y2="375" stroke="black" stroke-width="1.5" fill="none" marker-end="url(#ah)" />
  <text x="270" y="470" font-family="Arial, sans-serif" font-size="14" fill="black">Resync</text>
  <text x="270" y="488" font-family="Arial, sans-serif" font-size="14" fill="black">complete</text>
  <text x="260" y="510" font-family="Arial, sans-serif" font-size="14" fill="black">36</text>
  <line x1="272" y1="507" x2="285" y2="498" stroke="black" stroke-width="0.5" />

  <!-- 38: Direct transition 28 -> 26 (dashed, bottom path) -->
  <line x1="545" y1="345" x2="316" y2="345" stroke="black" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ah)" />
  <text x="435" y="365" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">Any tool call (direct reconnect)</text>
  <text x="435" y="385" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">38</text>
  <line x1="435" y1="378" x2="435" y2="368" stroke="black" stroke-width="0.5" />

  <!-- 40: Self-loop on 28 (autonomous steps) -->
  <path d="M685 265 C730 240, 730 370, 685 345" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
  <text x="700" y="225" font-family="Arial, sans-serif" font-size="14" fill="black">Each step</text>
  <text x="700" y="243" font-family="Arial, sans-serif" font-size="14" fill="black">(max 10K)</text>
  <text x="735" y="210" font-family="Arial, sans-serif" font-size="14" fill="black">40</text>
  <line x1="733" y1="215" x2="725" y2="228" stroke="black" stroke-width="0.5" />

  <!-- 42: State Legend Box -->
  <rect x="175" y="730" width="500" height="120" rx="5" fill="none" stroke="black" stroke-width="1" />
  <text x="200" y="755" font-family="Arial, sans-serif" font-size="14" fill="black">State Transition Legend:</text>
  <text x="200" y="780" font-family="Arial, sans-serif" font-size="14" fill="black">26 CONNECTED: Cognitive layer provides input/modulation</text>
  <text x="200" y="800" font-family="Arial, sans-serif" font-size="14" fill="black">28 AUTONOMOUS: Self-generated input, energy-aware modulation</text>
  <text x="200" y="820" font-family="Arial, sans-serif" font-size="14" fill="black">30 RECOVERING: Buffer transmitted, restoring control</text>
  <text x="685" y="750" font-family="Arial, sans-serif" font-size="14" fill="black">42</text>
  <line x1="683" y1="750" x2="675" y2="750" stroke="black" stroke-width="0.5" />

  <text x="425" y="980" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="black">FIG. 2</text>
</svg>
