<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">2/7</text>

  <!-- Title -->
  <text x="387" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">STATE TRANSITION DIAGRAM</text>

  <!-- ==================== STATES ==================== -->

  <!-- CONNECTED State (200) - bold outline = initial state -->
  <circle cx="200" cy="320" r="70" fill="none" stroke="black" stroke-width="3"/>
  <text x="200" y="295" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">200</text>
  <text x="200" y="315" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CONNECTED</text>
  <text x="200" y="333" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Cognitive layer</text>
  <text x="200" y="348" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">active</text>

  <!-- AUTONOMOUS State (202) -->
  <circle cx="550" cy="320" r="70" fill="none" stroke="black" stroke-width="2"/>
  <text x="550" y="295" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">202</text>
  <text x="550" y="315" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">AUTONOMOUS</text>
  <text x="550" y="333" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Fallback active</text>
  <text x="550" y="348" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Self-regulating</text>

  <!-- RECOVERING State (204) -->
  <circle cx="375" cy="550" r="70" fill="none" stroke="black" stroke-width="2"/>
  <text x="375" y="525" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">204</text>
  <text x="375" y="545" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">RECOVERING</text>
  <text x="375" y="563" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Resync in</text>
  <text x="375" y="578" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">progress</text>

  <!-- ==================== TRANSITIONS ==================== -->

  <!-- Start arrow pointing to CONNECTED -->
  <line x1="100" y1="320" x2="128" y2="320" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="100" y="305" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Start</text>

  <!-- 206: CONNECTED -> AUTONOMOUS (top arrow) -->
  <line x1="270" y1="295" x2="480" y2="295" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="375" y="260" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">206</text>
  <text x="375" y="278" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Heartbeat timeout (>30s)</text>

  <!-- 212: AUTONOMOUS -> CONNECTED (bottom arrow, dashed - direct reconnect) -->
  <line x1="479" y1="345" x2="270" y2="345" stroke="black" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#ah)"/>
  <text x="375" y="375" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">212: Any tool call (heartbeat reset)</text>

  <!-- 208: AUTONOMOUS -> RECOVERING -->
  <line x1="510" y1="380" x2="425" y2="490" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="490" y="420" font-family="Arial, sans-serif" font-size="14" text-anchor="start">208</text>
  <text x="485" y="438" font-family="Arial, sans-serif" font-size="14" text-anchor="start">resync() called</text>

  <!-- 210: RECOVERING -> CONNECTED -->
  <line x1="315" y1="505" x2="235" y2="385" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="255" y="435" font-family="Arial, sans-serif" font-size="14" text-anchor="end">210</text>
  <text x="250" y="453" font-family="Arial, sans-serif" font-size="14" text-anchor="end">Resync complete</text>

  <!-- 214: Self-loop on AUTONOMOUS (step counter) — smooth oval to the right -->
  <path d="M 616 296 C 730 255, 730 385, 616 344" fill="none" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="740" y="305" font-family="Arial, sans-serif" font-size="14" text-anchor="start">214</text>
  <text x="740" y="323" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Each step</text>
  <text x="740" y="341" font-family="Courier New, monospace" font-size="14" text-anchor="start">(max 10,000)</text>

  <!-- ==================== ANNOTATIONS ==================== -->

  <!-- Snapshot annotation near AUTONOMOUS — positioned below transition area -->
  <text x="580" y="460" font-family="Courier New, monospace" font-size="14" text-anchor="middle">Snapshot every 50 steps</text>

  <!-- ==================== LEGEND ==================== -->

  <rect x="125" y="680" width="525" height="120" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="387" y="705" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Transition Summary</text>

  <!-- Left column -->
  <text x="150" y="730" font-family="Arial, sans-serif" font-size="14" text-anchor="start">206: Timeout triggers fallback</text>
  <text x="150" y="750" font-family="Arial, sans-serif" font-size="14" text-anchor="start">208: Explicit resync request</text>
  <text x="150" y="770" font-family="Arial, sans-serif" font-size="14" text-anchor="start">210: Resync completes</text>

  <!-- Right column -->
  <text x="400" y="730" font-family="Arial, sans-serif" font-size="14" text-anchor="start">212: Direct reconnection</text>
  <text x="400" y="750" font-family="Arial, sans-serif" font-size="14" text-anchor="start">214: Autonomous step loop</text>

  <!-- Line style legend -->
  <line x1="150" y1="785" x2="200" y2="785" stroke="black" stroke-width="3"/>
  <text x="210" y="790" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Initial state</text>
  <line x1="320" y1="785" x2="370" y2="785" stroke="black" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="380" y="790" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Direct reconnect</text>

  <!-- Figure Label -->
  <text x="387" y="850" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">FIG. 2</text>
</svg>
