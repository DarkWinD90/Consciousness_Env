<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">2/7</text>

  <!-- Title -->
  <text x="425" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">STATE TRANSITION DIAGRAM</text>

  <!-- CONNECTED State (200) -->
  <circle cx="200" cy="300" r="80" fill="none" stroke="black" stroke-width="3"/>
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">200</text>
  <text x="200" y="295" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CONNECTED</text>
  <text x="200" y="315" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Cognitive layer</text>
  <text x="200" y="335" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">active</text>

  <!-- Start arrow -->
  <line x1="115" y1="300" x2="118" y2="300" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="110" y="305" font-family="Arial, sans-serif" font-size="14" text-anchor="end">Start</text>

  <!-- AUTONOMOUS State (202) -->
  <circle cx="650" cy="300" r="80" fill="none" stroke="black" stroke-width="2"/>
  <text x="650" y="265" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">202</text>
  <text x="650" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">AUTONOMOUS</text>
  <text x="650" y="310" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Fallback active</text>
  <text x="650" y="330" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Self-regulating</text>

  <!-- RECOVERING State (204) -->
  <circle cx="425" cy="550" r="80" fill="none" stroke="black" stroke-width="2"/>
  <text x="425" y="515" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">204</text>
  <text x="425" y="540" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">RECOVERING</text>
  <text x="425" y="560" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Resync in</text>
  <text x="425" y="580" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">progress</text>

  <!-- Transition: CONNECTED -> AUTONOMOUS (206) -->
  <line x1="280" y1="280" x2="568" y2="280" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="425" y="260" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">206</text>
  <text x="425" y="275" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Heartbeat timeout (>30s)</text>

  <!-- Transition: AUTONOMOUS -> RECOVERING (208) -->
  <line x1="610" y1="370" x2="480" y2="490" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="565" y="415" font-family="Arial, sans-serif" font-size="14" text-anchor="start">208</text>
  <text x="560" y="435" font-family="Arial, sans-serif" font-size="14" text-anchor="start">resync() called</text>

  <!-- Transition: RECOVERING -> CONNECTED (210) -->
  <line x1="350" y1="510" x2="220" y2="380" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="265" y="430" font-family="Arial, sans-serif" font-size="14" text-anchor="end">210</text>
  <text x="260" y="450" font-family="Arial, sans-serif" font-size="14" text-anchor="end">Resync complete</text>

  <!-- Self-loop on AUTONOMOUS -->
  <path d="M 680 230 Q 740 230 740 300 Q 740 370 680 370" fill="none" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="770" y="295" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Each step</text>
  <text x="770" y="315" font-family="Courier New, monospace" font-size="14" text-anchor="start">(max 10,000)</text>

  <!-- Legend Box -->
  <rect x="150" y="680" width="550" height="120" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="425" y="705" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Transition Conditions</text>
  <text x="200" y="735" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start">CONNECTED -> AUTONOMOUS:</text>
  <text x="200" y="755" font-family="Arial, sans-serif" font-size="14" text-anchor="start">No tool call for 30 seconds</text>
  <text x="200" y="780" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start">AUTONOMOUS -> RECOVERING:</text>
  <text x="200" y="800" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Cognitive layer calls resync()</text>

  <!-- Figure Label -->
  <text x="425" y="1020" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">FIG. 2</text>
</svg>
