<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="black" stroke-width="1"/>
    </pattern>
    <pattern id="hatchLight" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="black" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">2/7</text>
  <g transform="translate(0, 50)">
<text x="425" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">STATE TRANSITION DIAGRAM</text>
<circle cx="200" cy="250" r="80" fill="none" stroke="black" stroke-width="3"/>
<text x="200" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CONNECTED</text>
<text x="200" y="255" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Cognitive layer</text>
<text x="200" y="275" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">active</text>
<text x="290" y="200" font-family="Arial, sans-serif" font-size="14" text-anchor="start">200</text>
<line x1="288" y1="200" x2="280" y2="220" stroke="black" stroke-width="0.5"/>
<line x1="115" y1="250" x2="120" y2="250" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
<text x="110" y="255" font-family="Arial, sans-serif" font-size="14" text-anchor="end">Start</text>
<circle cx="650" cy="250" r="80" fill="none" stroke="black" stroke-width="2"/>
<text x="650" y="225" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">AUTONOMOUS</text>
<text x="650" y="250" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Fallback active</text>
<text x="650" y="270" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Self-regulating</text>
<text x="740" y="200" font-family="Arial, sans-serif" font-size="14" text-anchor="start">202</text>
<line x1="738" y1="200" x2="730" y2="220" stroke="black" stroke-width="0.5"/>
<circle cx="425" cy="500" r="80" fill="none" stroke="black" stroke-width="2"/>
<text x="425" y="480" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">RECOVERING</text>
<text x="425" y="505" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Resync in</text>
<text x="425" y="525" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">progress</text>
<text x="515" y="450" font-family="Arial, sans-serif" font-size="14" text-anchor="start">204</text>
<line x1="513" y1="453" x2="505" y2="470" stroke="black" stroke-width="0.5"/>
<line x1="280" y1="230" x2="570" y2="230" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
<text x="425" y="210" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Heartbeat timeout (>30s)</text>
<text x="425" y="195" font-family="Arial, sans-serif" font-size="14" text-anchor="start">206</text>
<line x1="440" y1="198" x2="450" y2="210" stroke="black" stroke-width="0.5"/>
<line x1="610" y1="320" x2="480" y2="440" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
<text x="560" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="start">resync() called</text>
<text x="555" y="365" font-family="Arial, sans-serif" font-size="14" text-anchor="start">208</text>
<line x1="565" y1="368" x2="560" y2="385" stroke="black" stroke-width="0.5"/>
<line x1="350" y1="460" x2="220" y2="330" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
<text x="250" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="end">Resync complete</text>
<text x="320" y="380" font-family="Arial, sans-serif" font-size="14" text-anchor="start">210</text>
<line x1="318" y1="383" x2="300" y2="400" stroke="black" stroke-width="0.5"/>
<path d="M 680 180 Q 740 180 740 250 Q 740 320 680 320" fill="none" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
<text x="600" y="250" font-family="Arial, sans-serif" font-size="14" text-anchor="end">Each step</text>
<text x="600" y="270" font-family="Courier New, monospace" font-size="14" text-anchor="end">(max 10,000)</text>
<rect x="150" y="600" width="550" height="150" rx="5" fill="none" stroke="black" stroke-width="2"/>
<text x="425" y="625" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Transition Conditions</text>
<text x="200" y="660" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start">CONNECTED -> AUTONOMOUS:</text>
<text x="200" y="680" font-family="Arial, sans-serif" font-size="14" text-anchor="start">No tool call for 30 seconds</text>
<text x="200" y="710" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start">AUTONOMOUS -> RECOVERING:</text>
<text x="200" y="730" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Cognitive layer calls resync()</text>

<text x="425" y="920" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">FIG. 2</text>
  </g>
