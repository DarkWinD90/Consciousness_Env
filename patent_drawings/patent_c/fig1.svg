<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <rect width="100%" height="100%" fill="white" />
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <text x="425" y="60" font-family="Arial" font-size="14" text-anchor="middle" fill="black">1/7</text>

  <!-- 10: External Cognitive Control Layer (cloud/ellipse at top, dashed) -->
  <ellipse cx="425" cy="170" rx="160" ry="40" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="6,3" />
  <text x="425" y="165" font-family="Arial" font-size="14" text-anchor="middle" fill="black">EXTERNAL COGNITIVE</text>
  <text x="425" y="182" font-family="Arial" font-size="14" text-anchor="middle" fill="black">CONTROL (Claude)</text>
  <text x="620" y="155" font-family="Arial" font-size="14" fill="black">10</text>
  <line x1="618" y1="158" x2="590" y2="170" stroke="black" stroke-width="0.5" />

  <!-- Arrow down from 10 -->
  <line x1="425" y1="210" x2="425" y2="260" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

  <!-- 12: Heartbeat Watchdog -->
  <rect x="310" y="260" width="230" height="65" rx="5" fill="none" stroke="black" stroke-width="1.5" />
  <text x="425" y="285" font-family="Arial" font-size="14" text-anchor="middle" fill="black">HEARTBEAT WATCHDOG</text>
  <text x="425" y="310" font-family="Arial" font-size="14" text-anchor="middle" fill="black">Timeout: 30s | Check: 5s</text>
  <text x="550" y="280" font-family="Arial" font-size="14" fill="black">12</text>
  <line x1="548" y1="283" x2="540" y2="285" stroke="black" stroke-width="0.5" />

  <!-- Left path: Heartbeat active -->
  <path d="M360 325 L360 365 L280 365 L280 430" stroke="black" stroke-width="1.5" fill="none" marker-end="url(#ah)" />
  <text x="240" y="400" font-family="Arial" font-size="14" fill="black">active</text>

  <!-- Right path: Heartbeat timeout (dashed) -->
  <path d="M490 325 L490 365 L570 365 L570 430" stroke="black" stroke-width="1.5" stroke-dasharray="4,2" fill="none" marker-end="url(#ah)" />
  <text x="575" y="400" font-family="Arial" font-size="14" fill="black">timeout</text>

  <!-- 14: Cognitive-Driven Operation (left path) -->
  <rect x="190" y="430" width="180" height="65" rx="5" fill="none" stroke="black" stroke-width="1.5" />
  <text x="280" y="455" font-family="Arial" font-size="14" text-anchor="middle" fill="black">CONNECTED</text>
  <text x="280" y="478" font-family="Arial" font-size="14" text-anchor="middle" fill="black">Claude input</text>
  <text x="380" y="455" font-family="Arial" font-size="14" fill="black">14</text>
  <line x1="378" y1="458" x2="370" y2="460" stroke="black" stroke-width="0.5" />

  <!-- 16: Autonomous Fallback Controller (right path, bold) -->
  <rect x="480" y="430" width="180" height="65" rx="5" fill="none" stroke="black" stroke-width="2" />
  <text x="570" y="455" font-family="Arial" font-size="14" text-anchor="middle" fill="black">AUTONOMOUS</text>
  <text x="570" y="478" font-family="Arial" font-size="14" text-anchor="middle" fill="black">Self-regulated</text>
  <text x="670" y="455" font-family="Arial" font-size="14" fill="black">16</text>
  <line x1="668" y1="458" x2="660" y2="460" stroke="black" stroke-width="0.5" />

  <!-- Arrows from 14 and 16 down -->
  <line x1="280" y1="495" x2="280" y2="610" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />
  <path d="M570 495 L570 520" stroke="black" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ah)" />

  <!-- 18: Step Buffer (from 16) -->
  <rect x="535" y="520" width="70" height="35" rx="3" fill="none" stroke="black" stroke-width="1" />
  <text x="570" y="543" font-family="Arial" font-size="14" text-anchor="middle" fill="black">BUFFER</text>
  <text x="615" y="540" font-family="Arial" font-size="14" fill="black">18</text>
  <line x1="613" y1="543" x2="605" y2="545" stroke="black" stroke-width="0.5" />

  <!-- Arrow from 18 down to 22 -->
  <path d="M570 555 L570 610" stroke="black" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ah)" />

  <!-- 20: Snapshot Store (cylinder, right side of 16) -->
  <ellipse cx="700" cy="470" rx="15" ry="8" fill="none" stroke="black" stroke-width="1.5" />
  <rect x="685" y="470" width="30" height="30" fill="none" stroke="black" stroke-width="1.5" />
  <ellipse cx="700" cy="500" rx="15" ry="8" fill="none" stroke="black" stroke-width="1.5" />
  <text x="720" y="490" font-family="Arial" font-size="14" fill="black">20</text>
  <line x1="718" y1="493" x2="715" y2="495" stroke="black" stroke-width="0.5" />

  <!-- Arrow from 16 to 20 -->
  <line x1="660" y1="462" x2="685" y2="470" stroke="black" stroke-width="1" marker-end="url(#ah)" />

  <!-- 22: SNN + Energy Harvester (large bottom box) -->
  <rect x="170" y="610" width="500" height="100" rx="5" fill="none" stroke="black" stroke-width="1.5" />
  <text x="370" y="635" font-family="Arial" font-size="14" text-anchor="middle" fill="black">SPIKING NEURAL NETWORK + ENERGY HARVESTER</text>
  <text x="370" y="655" font-family="Arial" font-size="14" text-anchor="middle" fill="black">Continuous operation regardless of control source</text>
  <!-- Neurons inside -->
  <circle cx="220" cy="690" r="5" fill="none" stroke="black" stroke-width="1" />
  <circle cx="260" cy="690" r="5" fill="none" stroke="black" stroke-width="1" />
  <circle cx="500" cy="690" r="5" fill="none" stroke="black" stroke-width="1" />
  <path d="M290 690 L470 690" stroke="black" stroke-width="1" stroke-dasharray="2,2" />
  <text x="140" y="735" font-family="Arial" font-size="14" fill="black">22</text>
  <line x1="155" y1="732" x2="170" y2="710" stroke="black" stroke-width="0.5" />

  <!-- 24: Energy Harvester symbol inside 22 -->
  <path d="M570 630 L620 630 M570 650 L620 650 M585 630 L585 650 M605 630 L605 650" stroke="black" stroke-width="1" />
  <text x="640" y="628" font-family="Arial" font-size="14" fill="black">24</text>
  <line x1="638" y1="631" x2="622" y2="640" stroke="black" stroke-width="0.5" />

  <!-- Key annotation -->
  <rect x="170" y="730" width="500" height="55" fill="none" stroke="black" stroke-width="0.8" stroke-dasharray="2,2" />
  <text x="420" y="755" font-family="Arial" font-size="14" text-anchor="middle" fill="black">Seamless transition: SNN continues processing without interruption.</text>
  <text x="420" y="775" font-family="Arial" font-size="14" text-anchor="middle" fill="black">The control source changes; the computation continues.</text>

  <text x="425" y="950" font-family="Arial" font-size="18" text-anchor="middle" fill="black">FIG. 1</text>
</svg>
