<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">1/7</text>

  <!-- Title -->
  <text x="425" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SYSTEM ARCHITECTURE WITH COGNITIVE FALLBACK</text>

  <!-- External Cognitive Control Layer (100) -->
  <ellipse cx="425" cy="210" rx="180" ry="50" fill="none" stroke="black" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="425" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">External Cognitive Control Layer</text>
  <text x="425" y="225" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">(e.g., Claude)</text>
  <text x="550" y="195" font-family="Arial, sans-serif" font-size="14" text-anchor="end">100</text>
  <text x="570" y="195" font-family="Arial, sans-serif" font-size="14" text-anchor="start">May disconnect</text>

  <!-- Arrows from Cognitive Layer to Watchdog -->
  <line x1="350" y1="260" x2="350" y2="318" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="360" y="290" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Modulation</text>
  <text x="360" y="305" font-family="Courier New, monospace" font-size="14" text-anchor="start">(-1.0 to +1.0)</text>

  <line x1="500" y1="260" x2="500" y2="318" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="510" y="290" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Heartbeat</text>
  <text x="510" y="305" font-family="Arial, sans-serif" font-size="14" text-anchor="start">(tool calls)</text>

  <!-- Heartbeat Watchdog (102) -->
  <rect x="300" y="320" width="250" height="100" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="540" y="337" font-family="Arial, sans-serif" font-size="14" text-anchor="end">102</text>
  <text x="425" y="355" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Heartbeat Watchdog</text>
  <text x="425" y="380" font-family="Courier New, monospace" font-size="14" text-anchor="middle">Timeout: 30 seconds</text>
  <text x="425" y="405" font-family="Courier New, monospace" font-size="14" text-anchor="middle">Check interval: ~5 seconds</text>

  <!-- Arrows from Watchdog to Modes -->
  <line x1="350" y1="420" x2="220" y2="478" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="270" y="445" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Heartbeat</text>
  <text x="270" y="460" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">active</text>

  <line x1="500" y1="420" x2="630" y2="478" stroke="black" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#ah)"/>
  <text x="580" y="445" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Timeout</text>
  <text x="580" y="460" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">(>30s)</text>

  <!-- Connected Mode (104) -->
  <rect x="115" y="480" width="210" height="100" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="315" y="497" font-family="Arial, sans-serif" font-size="14" text-anchor="end">104</text>
  <text x="220" y="515" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Connected Mode</text>
  <text x="220" y="540" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Input: Claude-controlled</text>
  <text x="220" y="565" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Mod: Claude-controlled</text>

  <!-- Autonomous Mode (106) -->
  <rect x="540" y="480" width="210" height="100" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="740" y="497" font-family="Arial, sans-serif" font-size="14" text-anchor="end">106</text>
  <text x="645" y="515" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Autonomous Mode</text>
  <text x="645" y="540" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Input: Self-generated</text>
  <text x="645" y="565" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Mod: Energy-aware</text>

  <!-- Arrow from Autonomous to Step Buffer -->
  <line x1="645" y1="580" x2="645" y2="618" stroke="black" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Step Buffer (108) -->
  <rect x="560" y="620" width="90" height="50" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="640" y="637" font-family="Arial, sans-serif" font-size="14" text-anchor="end">108</text>
  <text x="605" y="652" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Step</text>
  <text x="605" y="667" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Buffer</text>

  <!-- Arrow to Snapshot -->
  <line x1="650" y1="645" x2="683" y2="645" stroke="black" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Snapshot (110) -->
  <ellipse cx="720" cy="645" rx="35" ry="22" fill="none" stroke="black" stroke-width="2"/>
  <text x="720" y="640" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">110</text>
  <text x="720" y="655" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Snapshot</text>

  <!-- Arrows down to convergence line -->
  <line x1="220" y1="580" x2="220" y2="720" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="605" y1="670" x2="605" y2="720" stroke="black" stroke-width="2"/>

  <!-- Convergence line -->
  <line x1="220" y1="720" x2="605" y2="720" stroke="black" stroke-width="2"/>

  <!-- Arrow down to SNN -->
  <line x1="425" y1="720" x2="425" y2="758" stroke="black" stroke-width="2" marker-end="url(#ah)"/>

  <!-- SNN + Energy Harvester (112) -->
  <rect x="250" y="760" width="350" height="80" rx="5" fill="none" stroke="black" stroke-width="3"/>
  <text x="590" y="777" font-family="Arial, sans-serif" font-size="14" text-anchor="end">112</text>
  <text x="425" y="795" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Spiking Neural Network</text>
  <text x="425" y="815" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">+ Energy Harvester</text>
  <text x="425" y="835" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Continuous operation regardless of control source</text>

  <!-- Caption -->
  <text x="425" y="890" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">THE SYSTEM NEVER STOPS</text>
  <text x="425" y="910" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">The control source changes; the computation continues</text>

  <!-- Figure Label -->
  <text x="425" y="1020" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">FIG. 1</text>
</svg>
