<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">7/7</text>

  <!-- Title -->
  <text x="425" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">END-TO-END SIGNAL FLOW</text>
  <text x="425" y="130" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Connected vs. Autonomous Operation</text>

  <!-- CONNECTED MODE Section -->
  <text x="130" y="165" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start">CONNECTED MODE</text>

  <!-- Cognitive Layer (700) -->
  <ellipse cx="425" cy="200" rx="120" ry="35" fill="none" stroke="black" stroke-width="2"/>
  <text x="425" y="195" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">700</text>
  <text x="425" y="212" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Cognitive Layer</text>

  <!-- Arrow from Cognitive to Cognitive Mod -->
  <path d="M425,235 Q425,260 490,280" fill="none" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="460" y="260" font-family="Courier New, monospace" font-size="14" text-anchor="start">mod</text>

  <!-- Sensors (702) -->
  <rect x="120" y="280" width="100" height="50" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="210" y="297" font-family="Arial, sans-serif" font-size="14" text-anchor="end">702</text>
  <text x="170" y="310" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Sensors</text>
  <text x="170" y="325" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">(external)</text>

  <!-- Arrow from Sensors to SNN -->
  <line x1="220" y1="305" x2="268" y2="305" stroke="black" stroke-width="2" marker-end="url(#ah)"/>

  <!-- SNN Processing (704) -->
  <rect x="270" y="270" width="120" height="70" rx="5" fill="none" stroke="black" stroke-width="3"/>
  <text x="380" y="287" font-family="Arial, sans-serif" font-size="14" text-anchor="end">704</text>
  <text x="330" y="305" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SNN</text>
  <text x="330" y="325" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Processing</text>

  <!-- Arrow from SNN to Cognitive Mod -->
  <line x1="390" y1="305" x2="438" y2="305" stroke="black" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Cognitive Mod (706) -->
  <rect x="440" y="280" width="100" height="50" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="530" y="297" font-family="Arial, sans-serif" font-size="14" text-anchor="end">706</text>
  <text x="490" y="305" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Cognitive</text>
  <text x="490" y="320" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Mod</text>

  <!-- Arrow from Cognitive Mod to Motor -->
  <line x1="540" y1="305" x2="588" y2="305" stroke="black" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Motor (708) -->
  <rect x="590" y="280" width="60" height="50" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="620" y="297" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">708</text>
  <text x="620" y="315" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Motor</text>

  <!-- Arrow from Motor to Energy -->
  <line x1="650" y1="305" x2="663" y2="305" stroke="black" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Energy Harvest -->
  <rect x="665" y="280" width="60" height="50" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="695" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Energy</text>
  <text x="695" y="318" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Harvest</text>

  <!-- Energy feedback loop (710) -->
  <line x1="695" y1="330" x2="695" y2="360" stroke="black" stroke-width="2"/>
  <line x1="695" y1="360" x2="330" y2="360" stroke="black" stroke-width="2"/>
  <line x1="330" y1="360" x2="330" y2="342" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="520" y="375" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">710 - Energy feedback (Patent A)</text>

  <!-- Disconnection Event -->
  <line x1="115" y1="410" x2="720" y2="410" stroke="black" stroke-width="2"/>
  <text x="425" y="435" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">DISCONNECTION EVENT (heartbeat timeout > 30s)</text>
  <text x="425" y="455" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Seamless transition - no interruption to SNN or Harvester</text>

  <!-- AUTONOMOUS MODE Section -->
  <text x="130" y="490" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start">AUTONOMOUS MODE</text>

  <!-- Autonomous Input Gen (712) -->
  <rect x="120" y="510" width="100" height="70" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="210" y="527" font-family="Arial, sans-serif" font-size="14" text-anchor="end">712</text>
  <text x="170" y="540" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Autonomous</text>
  <text x="170" y="555" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Input Gen</text>
  <text x="170" y="572" font-family="Courier New, monospace" font-size="14" text-anchor="middle">Circadian+Bursts</text>

  <!-- Arrow from Input Gen to SNN -->
  <line x1="220" y1="545" x2="268" y2="545" stroke="black" stroke-width="2" marker-end="url(#ah)"/>

  <!-- SNN Processing (Autonomous) -->
  <rect x="270" y="510" width="120" height="70" rx="5" fill="none" stroke="black" stroke-width="3"/>
  <text x="330" y="540" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SNN</text>
  <text x="330" y="560" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Processing</text>

  <!-- Arrow from SNN to Energy-Aware Self-Mod -->
  <line x1="390" y1="545" x2="438" y2="545" stroke="black" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Energy-Aware Self-Mod (714) -->
  <rect x="440" y="510" width="100" height="70" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="530" y="527" font-family="Arial, sans-serif" font-size="14" text-anchor="end">714</text>
  <text x="490" y="540" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Energy-Aware</text>
  <text x="490" y="555" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Self-Mod</text>
  <text x="490" y="572" font-family="Courier New, monospace" font-size="14" text-anchor="middle">&lt;15:-0.4</text>

  <!-- Arrow from Self-Mod to Motor -->
  <line x1="540" y1="545" x2="588" y2="545" stroke="black" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Motor (Autonomous) -->
  <rect x="590" y="520" width="60" height="50" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="620" y="550" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Motor</text>

  <!-- Arrow from Motor to Energy -->
  <line x1="650" y1="545" x2="663" y2="545" stroke="black" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Energy Harvest (Autonomous) -->
  <rect x="665" y="520" width="60" height="50" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="695" y="540" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Energy</text>
  <text x="695" y="558" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Harvest</text>

  <!-- Buffer (716) -->
  <ellipse cx="330" cy="640" rx="50" ry="25" fill="none" stroke="black" stroke-width="2"/>
  <text x="330" y="635" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">716</text>
  <text x="330" y="650" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Buffer</text>
  <line x1="330" y1="580" x2="330" y2="613" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="340" y="600" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Every step</text>

  <!-- Snapshot (718) -->
  <ellipse cx="450" cy="640" rx="50" ry="25" fill="none" stroke="black" stroke-width="2"/>
  <text x="450" y="635" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">718</text>
  <text x="450" y="650" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Snapshot</text>
  <line x1="380" y1="640" x2="398" y2="640" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="450" y="690" font-family="Courier New, monospace" font-size="14" text-anchor="middle">Every 50 steps</text>

  <!-- Resync path (720) -->
  <line x1="500" y1="640" x2="735" y2="640" stroke="black" stroke-width="2"/>
  <line x1="735" y1="640" x2="735" y2="200" stroke="black" stroke-width="2"/>
  <line x1="735" y1="200" x2="547" y2="200" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="740" y="420" font-family="Courier New, monospace" font-size="14" text-anchor="start">720</text>
  <text x="740" y="440" font-family="Courier New, monospace" font-size="14" text-anchor="start">resync()</text>

  <!-- Signal Pathways Legend -->
  <rect x="150" y="720" width="550" height="110" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="425" y="745" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Signal Pathways</text>

  <line x1="180" y1="770" x2="280" y2="770" stroke="black" stroke-width="2"/>
  <text x="290" y="775" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Forward signal path</text>

  <line x1="180" y1="795" x2="280" y2="795" stroke="black" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="290" y="800" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Energy/control feedback</text>

  <text x="425" y="825" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Core pipeline (SNN, Motor, Harvester) NEVER stops during transition</text>

  <!-- Figure Label -->
  <text x="425" y="1020" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">FIG. 7</text>
</svg>
