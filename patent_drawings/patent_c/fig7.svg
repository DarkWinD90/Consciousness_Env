<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <rect width="100%" height="100%" fill="white" />
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <text x="425" y="60" font-family="Arial" font-size="14" text-anchor="middle" fill="black">7/7</text>
  <text x="425" y="115" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="black">END-TO-END SIGNAL FLOW: CONNECTED vs AUTONOMOUS</text>

  <!-- 10: COGNITIVE LAYER (Claude) - dashed ellipse at top -->
  <ellipse cx="425" cy="155" rx="90" ry="30" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="4,2" />
  <text x="425" y="150" font-family="Arial" font-size="14" text-anchor="middle" fill="black">COGNITIVE</text>
  <text x="425" y="167" font-family="Arial" font-size="14" text-anchor="middle" fill="black">LAYER (Claude)</text>
  <text x="530" y="150" font-family="Arial" font-size="14" fill="black">10</text>
  <line x1="528" y1="153" x2="515" y2="155" stroke="black" stroke-width="0.5" />

  <!-- CONNECTED MODE section label -->
  <text x="120" y="215" font-family="Arial" font-size="14" font-weight="bold" fill="black">CONNECTED MODE:</text>

  <!-- 90: Sensors (environmental input) -->
  <rect x="130" y="240" width="110" height="55" fill="none" stroke="black" stroke-width="1.5" />
  <text x="185" y="262" font-family="Arial" font-size="14" text-anchor="middle" fill="black">SENSORS</text>
  <text x="185" y="282" font-family="Arial" font-size="14" text-anchor="middle" fill="black">(env. input)</text>
  <text x="185" y="315" font-family="Arial" font-size="14" text-anchor="middle" fill="black">90</text>
  <line x1="185" y1="308" x2="185" y2="295" stroke="black" stroke-width="0.5" />

  <!-- 22: SNN CORE (Neuromorphic) -->
  <rect x="300" y="230" width="200" height="75" rx="3" fill="none" stroke="black" stroke-width="2" />
  <text x="400" y="260" font-family="Arial" font-size="14" text-anchor="middle" fill="black">SNN CORE</text>
  <text x="400" y="278" font-family="Arial" font-size="14" text-anchor="middle" fill="black">(Neuromorphic)</text>
  <circle cx="330" cy="292" r="5" fill="none" stroke="black" stroke-width="1" />
  <circle cx="400" cy="292" r="5" fill="none" stroke="black" stroke-width="1" />
  <circle cx="470" cy="292" r="5" fill="none" stroke="black" stroke-width="1" />
  <text x="400" y="325" font-family="Arial" font-size="14" text-anchor="middle" fill="black">22</text>
  <line x1="400" y1="318" x2="400" y2="305" stroke="black" stroke-width="0.5" />

  <!-- 94: MOTOR ACTUATION -->
  <rect x="560" y="240" width="110" height="55" fill="none" stroke="black" stroke-width="1.5" />
  <text x="615" y="262" font-family="Arial" font-size="14" text-anchor="middle" fill="black">MOTOR</text>
  <text x="615" y="282" font-family="Arial" font-size="14" text-anchor="middle" fill="black">ACTUATION</text>
  <text x="615" y="315" font-family="Arial" font-size="14" text-anchor="middle" fill="black">94</text>
  <line x1="615" y1="308" x2="615" y2="295" stroke="black" stroke-width="0.5" />

  <!-- 24: Energy harvester feedback -->
  <path d="M670 270 L670 345 L500 345 L500 305" stroke="black" stroke-width="1.5" stroke-dasharray="6,3" fill="none" marker-end="url(#ah)" />
  <text x="600" y="340" font-family="Arial" font-size="14" text-anchor="middle" fill="black">24</text>
  <line x1="600" y1="343" x2="600" y2="345" stroke="black" stroke-width="0.5" />

  <!-- 92: Cognitive modulation (connected) -->
  <text x="425" y="195" font-family="Arial" font-size="14" text-anchor="middle" fill="black">Cognitive modulation</text>
  <text x="550" y="195" font-family="Arial" font-size="14" fill="black">92</text>
  <line x1="548" y1="198" x2="530" y2="198" stroke="black" stroke-width="0.5" />

  <!-- MODE BOUNDARY -->
  <line x1="110" y1="380" x2="140" y2="380" stroke="black" stroke-width="1.5" stroke-dasharray="8,4" />
  <line x1="700" y1="380" x2="720" y2="380" stroke="black" stroke-width="1.5" stroke-dasharray="8,4" />
  <text x="425" y="378" font-family="Arial" font-size="14" text-anchor="middle" fill="black">--- MODE BOUNDARY ---</text>

  <!-- AUTONOMOUS MODE section label -->
  <text x="120" y="420" font-family="Arial" font-size="14" font-weight="bold" fill="black">AUTONOMOUS MODE (Fallback):</text>

  <!-- 96: Autonomous Input Generator -->
  <rect x="130" y="445" width="110" height="65" fill="none" stroke="black" stroke-width="1.5" />
  <text x="185" y="465" font-family="Arial" font-size="14" text-anchor="middle" fill="black">INPUT GEN</text>
  <text x="185" y="483" font-family="Arial" font-size="14" text-anchor="middle" fill="black">Circadian +</text>
  <text x="185" y="500" font-family="Arial" font-size="14" text-anchor="middle" fill="black">Burst</text>
  <text x="185" y="530" font-family="Arial" font-size="14" text-anchor="middle" fill="black">96</text>
  <line x1="185" y1="523" x2="185" y2="510" stroke="black" stroke-width="0.5" />

  <!-- 98: Energy-Aware Self-Modulation -->
  <rect x="560" y="445" width="110" height="65" fill="none" stroke="black" stroke-width="1.5" />
  <text x="615" y="465" font-family="Arial" font-size="14" text-anchor="middle" fill="black">ENERGY</text>
  <text x="615" y="483" font-family="Arial" font-size="14" text-anchor="middle" fill="black">MODULATION</text>
  <text x="615" y="500" font-family="Arial" font-size="14" text-anchor="middle" fill="black">(4-zone)</text>
  <text x="615" y="530" font-family="Arial" font-size="14" text-anchor="middle" fill="black">98</text>
  <line x1="615" y1="523" x2="615" y2="510" stroke="black" stroke-width="0.5" />

  <!-- 18: State buffer -->
  <ellipse cx="350" cy="580" rx="15" ry="25" fill="none" stroke="black" stroke-width="1" />
  <text x="350" y="575" font-family="Arial" font-size="14" text-anchor="middle" fill="black">BUF</text>
  <text x="350" y="620" font-family="Arial" font-size="14" text-anchor="middle" fill="black">18</text>
  <line x1="350" y1="613" x2="350" y2="605" stroke="black" stroke-width="0.5" />

  <!-- 20: Snapshot writer -->
  <ellipse cx="450" cy="580" rx="15" ry="25" fill="none" stroke="black" stroke-width="1" />
  <text x="450" y="575" font-family="Arial" font-size="14" text-anchor="middle" fill="black">SNP</text>
  <text x="450" y="620" font-family="Arial" font-size="14" text-anchor="middle" fill="black">20</text>
  <line x1="450" y1="613" x2="450" y2="605" stroke="black" stroke-width="0.5" />

  <!-- SIGNAL PATHS - CONNECTED MODE -->
  <!-- Arrow from COGNITIVE (10) down to SENSORS (90) -->
  <path d="M425 185 L425 220 L240 220 L240 240" stroke="black" stroke-width="1.5" fill="none" marker-end="url(#ah)" />

  <!-- Arrow from SENSORS (90) to SNN CORE (22) -->
  <line x1="240" y1="267" x2="300" y2="267" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

  <!-- Arrow from SNN CORE (22) to MOTOR (94) -->
  <line x1="500" y1="267" x2="560" y2="267" stroke="black" stroke-width="1.5" marker-end="url(#ah)" />

  <!-- SIGNAL PATHS - AUTONOMOUS MODE -->
  <!-- Arrow from INPUT GEN (96) to SNN CORE (22) -->
  <path d="M240 477 L280 477 L280 270 L300 270" stroke="black" stroke-width="1.5" fill="none" marker-end="url(#ah)" />

  <!-- Arrow from ENERGY MOD (98) to SNN CORE (22) -->
  <path d="M560 477 L480 477 L480 270 L500 270" stroke="black" stroke-width="1.5" fill="none" marker-end="url(#ah)" />

  <!-- Lines to buffer and snapshot -->
  <line x1="400" y1="305" x2="400" y2="540" stroke="black" stroke-width="1" stroke-dasharray="3,2" />
  <line x1="400" y1="555" x2="365" y2="555" stroke="black" stroke-width="1" marker-end="url(#ah)" />
  <line x1="400" y1="555" x2="435" y2="555" stroke="black" stroke-width="1" marker-end="url(#ah)" />

  <!-- 100: Resync path -->
  <path d="M450 555 L740 555 L740 155 L515 155" stroke="black" stroke-width="1.5" stroke-dasharray="4,2" fill="none" marker-end="url(#ah)" />
  <text x="745" y="400" font-family="Arial" font-size="14" fill="black">100</text>
  <line x1="743" y1="403" x2="740" y2="405" stroke="black" stroke-width="0.5" />
  <text x="715" y="140" font-family="Arial" font-size="14" fill="black">resync()</text>

  <!-- MODE SELECTION LOGIC legend box -->
  <rect x="130" y="660" width="570" height="120" rx="5" fill="none" stroke="black" stroke-width="1" />
  <text x="155" y="685" font-family="Arial" font-size="14" font-weight="bold" fill="black">MODE SELECTION LOGIC:</text>
  <text x="155" y="710" font-family="Arial" font-size="14" fill="black">CONNECTED: Input from sensors (90), modulation from Claude (92)</text>
  <text x="155" y="730" font-family="Arial" font-size="14" fill="black">AUTONOMOUS: Input from generator (96), modulation from energy (98)</text>
  <text x="155" y="750" font-family="Arial" font-size="14" fill="black">Buffer (18) and snapshot (20) active during autonomous mode</text>
  <text x="155" y="770" font-family="Arial" font-size="14" fill="black">Feedback path (100) transmits resync payload on reconnection</text>

  <text x="425" y="950" font-family="Arial" font-size="18" text-anchor="middle" fill="black">FIG. 7</text>
</svg>
