  <text x="680" y="824" font-family="Arial, sans-serif" font-size="14" text-anchor="end">LOW</text>

  <line x1="160" y1="734" x2="685" y2="734" stroke="black" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="150" y="739" font-family="Courier New, monospace" font-size="14" text-anchor="end">80</text>
  <text x="680" y="739" font-family="Arial, sans-serif" font-size="14" text-anchor="end">NORMAL</text>

  <line x1="160" y1="700" x2="685" y2="700" stroke="black" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="150" y="705" font-family="Courier New, monospace" font-size="14" text-anchor="end">100</text>
  <text x="680" y="695" font-family="Arial, sans-serif" font-size="14" text-anchor="end">SURPLUS</text>

  <!-- Energy recovery line (rising from CRITICAL to full) - shifted +35 -->
  <polyline points="160,855 208,840 255,825 303,810 351,795 398,780 446,765 494,750 541,735 589,720 636,705 685,700" fill="none" stroke="black" stroke-width="2"/>

  <!-- Figure Label -->
  <text x="422" y="950" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">FIG. 4</text>
