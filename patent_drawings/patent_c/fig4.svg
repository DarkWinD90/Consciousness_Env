<svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792">
  <rect width="100%" height="100%" fill="#fff" />
  <text x="306" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">Sheet 4 of 7</text>

  <!-- 400: Input Signal Graph (top) -->
  <g transform="translate(100,100)">
    <!-- Axes -->
    <path d="M0 160V0" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M0 160h412" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Y-axis labels -->
    <text x="-10" y="10" font-family="Arial" font-size="9" text-anchor="end" fill="#000">1.0</text>
    <text x="-10" y="80" font-family="Arial" font-size="9" text-anchor="end" fill="#000">0.5</text>
    <text x="-10" y="155" font-family="Arial" font-size="9" text-anchor="end" fill="#000">0.0</text>
    <text x="-35" y="80" font-family="Arial" font-size="9" text-anchor="middle" transform="rotate(-90 -35 80)" fill="#000">Input Value</text>

    <!-- X-axis labels -->
    <text x="0" y="175" font-family="Arial" font-size="9" text-anchor="middle" fill="#000">0</text>
    <text x="206" y="175" font-family="Arial" font-size="9" text-anchor="middle" fill="#000">250</text>
    <text x="412" y="175" font-family="Arial" font-size="9" text-anchor="middle" fill="#000">500</text>
    <text x="206" y="190" font-family="Arial" font-size="9" text-anchor="middle" fill="#000">Autonomous Step Number</text>

    <!-- Sinusoidal base signal (smooth curve) -->
    <path d="M0 80 Q 50 20, 100 80 T 200 80 T 300 80 T 400 80" fill="none" stroke="#000" stroke-width="1.5" />

    <!-- 402: Attention bursts (sharp upward spikes) -->
    <path d="M60 80v-40" stroke="#000" stroke-width="2" />
    <path d="M140 80v-45" stroke="#000" stroke-width="2" />
    <path d="M280 80v-50" stroke="#000" stroke-width="2" />
    <text x="60" y="25" font-family="Arial" font-size="8" text-anchor="middle" fill="#000">burst</text>
    <text x="350" y="30" font-family="Arial" font-size="14" font-weight="normal" fill="#000">402</text>

    <!-- Label -->
    <text x="430" y="80" font-family="Arial" font-size="14" font-weight="normal" fill="#000">400</text>
  </g>

  <!-- 404: Formula Box -->
  <rect x="100" y="310" width="412" height="50" rx="5" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="4,2" />
  <text x="306" y="335" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">input = 0.5 + 0.3 x sin(2 x pi x step / period) + burst</text>
  <text x="306" y="350" font-family="Arial" font-size="9" text-anchor="middle" fill="#000">period = 500 steps | burst probability = 10% | burst amplitude = +0.2</text>
  <text x="525" y="340" font-family="Arial" font-size="14" font-weight="normal" fill="#000">404</text>

  <!-- 406: Energy Recovery Graph (bottom) -->
  <g transform="translate(100,400)">
    <!-- Axes -->
    <path d="M0 200V0" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M0 200h412" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Y-axis labels -->
    <text x="-10" y="10" font-family="Arial" font-size="9" text-anchor="end" fill="#000">100</text>
    <text x="-10" y="50" font-family="Arial" font-size="9" text-anchor="end" fill="#000">80</text>
    <text x="-10" y="110" font-family="Arial" font-size="9" text-anchor="end" fill="#000">30</text>
    <text x="-10" y="140" font-family="Arial" font-size="9" text-anchor="end" fill="#000">15</text>
    <text x="-10" y="195" font-family="Arial" font-size="9" text-anchor="end" fill="#000">0</text>
    <text x="-35" y="100" font-family="Arial" font-size="9" text-anchor="middle" transform="rotate(-90 -35 100)" fill="#000">Energy (mWh)</text>

    <!-- X-axis labels -->
    <text x="206" y="215" font-family="Arial" font-size="9" text-anchor="middle" fill="#000">Autonomous Step Number</text>

    <!-- Zone threshold lines (dashed) -->
    <path d="M0 140h412" stroke="#000" stroke-width="0.8" stroke-dasharray="2,2" />
    <path d="M0 110h412" stroke="#000" stroke-width="0.8" stroke-dasharray="2,2" />
    <path d="M0 50h412" stroke="#000" stroke-width="0.8" stroke-dasharray="2,2" />

    <!-- Zone labels on left -->
    <text x="420" y="170" font-family="Arial" font-size="8" fill="#000">CRIT</text>
    <text x="420" y="125" font-family="Arial" font-size="8" fill="#000">LOW</text>
    <text x="420" y="80" font-family="Arial" font-size="8" fill="#000">NORM</text>
    <text x="420" y="30" font-family="Arial" font-size="8" fill="#000">SURP</text>

    <!-- Recovery trajectory (monotonic curve from 10 mWh to 100 mWh) -->
    <path d="M0 180 L 50 165 L 100 145 L 150 120 L 200 95 L 250 70 L 300 45 L 350 20 L 400 10" fill="none" stroke="#000" stroke-width="2.5" />

    <!-- Label -->
    <text x="430" y="100" font-family="Arial" font-size="14" font-weight="normal" fill="#000">406</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>

  <text x="306" y="720" font-family="Arial" font-size="18" font-weight="normal" text-anchor="middle" fill="#000">FIG. 4</text>
</svg>
