<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">4/7</text>

  <!-- Title -->
  <text x="425" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">AUTONOMOUS INPUT GENERATOR OUTPUT</text>

  <!-- Input Signal Graph (400) -->
  <!-- Y-axis -->
  <line x1="150" y1="450" x2="150" y2="200" stroke="black" stroke-width="2"/>
  <text x="115" y="325" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" transform="rotate(-90 115 325)">Input Value</text>

  <!-- X-axis -->
  <line x1="150" y1="450" x2="700" y2="450" stroke="black" stroke-width="2"/>
  <text x="425" y="490" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Autonomous Step Number</text>

  <!-- Reference numeral 400 -->
  <text x="710" y="325" font-family="Arial, sans-serif" font-size="14" text-anchor="start">400</text>

  <!-- Y-axis tick marks -->
  <line x1="145" y1="450" x2="150" y2="450" stroke="black" stroke-width="2"/>
  <text x="135" y="455" font-family="Courier New, monospace" font-size="14" text-anchor="end">0.0</text>

  <line x1="145" y1="325" x2="150" y2="325" stroke="black" stroke-width="2"/>
  <text x="135" y="330" font-family="Courier New, monospace" font-size="14" text-anchor="end">0.5</text>

  <line x1="145" y1="200" x2="150" y2="200" stroke="black" stroke-width="2"/>
  <text x="135" y="205" font-family="Courier New, monospace" font-size="14" text-anchor="end">1.0</text>

  <!-- X-axis tick marks -->
  <line x1="150" y1="450" x2="150" y2="455" stroke="black" stroke-width="2"/>
  <text x="150" y="475" font-family="Courier New, monospace" font-size="14" text-anchor="middle">0</text>

  <line x1="260" y1="450" x2="260" y2="455" stroke="black" stroke-width="2"/>
  <text x="260" y="475" font-family="Courier New, monospace" font-size="14" text-anchor="middle">100</text>

  <line x1="370" y1="450" x2="370" y2="455" stroke="black" stroke-width="2"/>
  <text x="370" y="475" font-family="Courier New, monospace" font-size="14" text-anchor="middle">200</text>

  <line x1="480" y1="450" x2="480" y2="455" stroke="black" stroke-width="2"/>
  <text x="480" y="475" font-family="Courier New, monospace" font-size="14" text-anchor="middle">300</text>

  <line x1="590" y1="450" x2="590" y2="455" stroke="black" stroke-width="2"/>
  <text x="590" y="475" font-family="Courier New, monospace" font-size="14" text-anchor="middle">400</text>

