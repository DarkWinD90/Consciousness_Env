<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="black">4/7</text>

  <!-- Anchor rects removed: with both graphs' axes now using manual polygon
       caps instead of marker-end (no signal-path classification), the
       endpoint anchors are no longer needed. The boxes were rendering as
       distracting unexplained symbols at axis corners. -->

  <!-- 58: Input Signal Graph (top) -->
  <!-- Axes with manual polygon caps (no marker-end) so they are not
       classified as signal paths; this lets us drop the open-square
       anchor rects that previously needed to receive their arrowhead
       endpoints. Convention shared with patent_c/fig3, fig6, fig7. -->
  <line x1="160" y1="378" x2="160" y2="136" stroke="black" stroke-width="1.5" />
  <polygon points="154 136, 160 122, 166 136" fill="black" stroke="none" />
  <line x1="162" y1="380" x2="674" y2="380" stroke="black" stroke-width="1.5" />
  <polygon points="674 374, 688 380, 674 386" fill="black" stroke="none" />

  <!-- Y-axis labels -->
  <text x="148" y="140" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">1.0</text>
  <text x="148" y="252" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">0.5</text>
  <text x="148" y="375" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="black">0.0</text>
  <text x="115" y="260" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black" transform="rotate(-90 115 260)">Input Value</text>

  <!-- X-axis labels. Wrapped in <g class="axis-label"> so tick numerics
       ("0", "250", "500") are treated as graph-axis ticks rather than
       reference numerals. The "Autonomous Step Number" caption is kept
       inside the same block for proximity but is non-numeric so the
       wrapper has no effect on its classification. -->
  <g class="axis-label">
    <text x="160" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">0</text>
    <line x1="160" y1="393" x2="160" y2="383" stroke="black" stroke-width="0.5" />
    <text x="420" y="415" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">250</text>
    <text x="670" y="415" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">500</text>
    <text x="420" y="435" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">Autonomous Step Number</text>
  </g>

  <!-- Sinusoidal base signal (smooth curve) -->
  <path d="M160 260 Q260 140, 360 260 T560 260 T670 260" fill="none" stroke="black" stroke-width="1.5" />

  <!-- 60: Attention bursts (sharp upward spikes) -->
  <circle cx="240" cy="260" r="3" fill="black" stroke="black" stroke-width="1" />
  <line x1="240" y1="257" x2="240" y2="190" stroke="black" stroke-width="2" />
  <circle cx="350" cy="260" r="3" fill="black" stroke="black" stroke-width="1" />
  <line x1="350" y1="257" x2="350" y2="180" stroke="black" stroke-width="2" />
  <circle cx="530" cy="260" r="3" fill="black" stroke="black" stroke-width="1" />
  <line x1="530" y1="257" x2="530" y2="170" stroke="black" stroke-width="2" />
  <text x="240" y="175" font-family="Arial" font-size="14" text-anchor="middle" fill="black">burst</text>
  <text x="590" y="165" font-family="Arial" font-size="14" fill="black">60</text>
  <line x1="588" y1="168" x2="535" y2="175" stroke="black" stroke-width="0.5" />

  <!-- Label for 58 -->
  <text x="690" y="260" font-family="Arial, sans-serif" font-size="14" fill="black">58</text>
  <line x1="688" y1="263" x2="672" y2="270" stroke="black" stroke-width="0.5" />

  <!-- 62: Formula Box -->
  <rect x="160" y="445" width="530" height="65" rx="5" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="4,2" />
  <text x="425" y="470" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">input = 0.5 + 0.3 x sin(2 x pi x step / period) + burst</text>
  <text x="425" y="495" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">period = 500 steps | burst probability = 10% | burst amplitude = +0.2</text>
  <text x="700" y="475" font-family="Arial, sans-serif" font-size="14" fill="black">62</text>
  <line x1="698" y1="478" x2="690" y2="478" stroke="black" stroke-width="0.5" />

  <!-- 64: Energy Recovery Graph (bottom) -->
  <!-- Axes. Arrowheads are drawn as manual <polygon> caps rather than
       via marker-end so the validator does not treat the axis-end
       points as arrow tips (they terminate in empty space at the graph
       corners, y=890 is below the legend-zone cutoff at y=790 and no
       rect target exists there). The same convention is used by
       patent_a/fig2's axes. -->
  <line x1="160" y1="888" x2="160" y2="560" stroke="black" stroke-width="1.5" />
  <polygon points="154 566, 160 552, 166 566" fill="black" stroke="none" />
  <line x1="162" y1="890" x2="680" y2="890" stroke="black" stroke-width="1.5" />
  <polygon points="674 884, 688 890, 674 896" fill="black" stroke="none" />

  <!-- Y-axis labels. Wrapped in <g class="axis-label"> so the numeric
       ticks (0, 15, 30, 80, 100) are treated as graph-axis ticks rather
       than reference numerals. -->
  <g class="axis-label">
    <text x="148" y="575" font-family="Arial" font-size="14" text-anchor="end" fill="black">100</text>
    <line x1="150" y1="572" x2="158" y2="572" stroke="black" stroke-width="0.5" />
    <text x="148" y="625" font-family="Arial" font-size="14" text-anchor="end" fill="black">80</text>
    <text x="148" y="720" font-family="Arial" font-size="14" text-anchor="end" fill="black">30</text>
    <text x="148" y="775" font-family="Arial" font-size="14" text-anchor="end" fill="black">15</text>
    <text x="148" y="885" font-family="Arial" font-size="14" text-anchor="end" fill="black">0</text>
    <line x1="150" y1="882" x2="158" y2="882" stroke="black" stroke-width="0.5" />
    <text x="130" y="730" font-family="Arial" font-size="14" text-anchor="middle" fill="black" transform="rotate(-90 130 730)">Energy (mWh)</text>
  </g>

  <!-- X-axis label -->
  <text x="420" y="920" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">Autonomous Step Number</text>

  <!-- Zone threshold lines (thin solid to avoid signal path classification) -->
  <line x1="160" y1="775" x2="680" y2="775" stroke="black" stroke-width="0.5" />
  <line x1="160" y1="725" x2="680" y2="725" stroke="black" stroke-width="0.5" />
  <line x1="160" y1="625" x2="680" y2="625" stroke="black" stroke-width="0.5" />

  <!-- Zone labels on right -->
  <text x="680" y="835" font-family="Arial, sans-serif" font-size="14" fill="black">CRIT</text>
  <text x="680" y="750" font-family="Arial, sans-serif" font-size="14" fill="black">LOW</text>
  <text x="680" y="680" font-family="Arial, sans-serif" font-size="14" fill="black">NORM</text>
  <text x="680" y="600" font-family="Arial, sans-serif" font-size="14" fill="black">SURP</text>

  <!-- Recovery trajectory (monotonic curve from 10 mWh to 100 mWh) -->
  <path d="M160 855 L220 830 L280 780 L340 740 L400 690 L460 650 L520 610 L580 585 L640 570 L670 565" fill="none" stroke="black" stroke-width="2.5" />

  <!-- Label for 64 -->
  <text x="690" y="730" font-family="Arial, sans-serif" font-size="14" fill="black">64</text>
  <line x1="688" y1="727" x2="645" y2="700" stroke="black" stroke-width="0.5" />

  <text x="425" y="980" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="black">FIG. 4</text>
</svg>
