  <!-- X-axis -->
  <line x1="160" y1="450" x2="685" y2="450" stroke="black" stroke-width="2"/>
  <text x="422" y="495" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Autonomous Step Number</text>

