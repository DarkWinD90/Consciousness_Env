  <rect width="100%" height="100%" fill="white" />
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">4/7</text>

  <!-- Title -->
  <text x="422" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">AUTONOMOUS INPUT GENERATOR OUTPUT</text>

  <!-- Input Signal Graph (400) -->
  <!-- Y-axis -->
  <line x1="160" y1="450" x2="160" y2="200" stroke="black" stroke-width="2"/>
