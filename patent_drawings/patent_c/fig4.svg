  <line x1="150" y1="819" x2="700" y2="819" stroke="black" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="135" y="824" font-family="Courier New, monospace" font-size="14" text-anchor="end">30</text>
  <text x="130" y="810" font-family="Arial, sans-serif" font-size="14" text-anchor="end">LOW</text>

  <line x1="150" y1="734" x2="700" y2="734" stroke="black" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="135" y="739" font-family="Courier New, monospace" font-size="14" text-anchor="end">80</text>
  <text x="130" y="750" font-family="Arial, sans-serif" font-size="14" text-anchor="end">NORM</text>

  <line x1="150" y1="700" x2="700" y2="700" stroke="black" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="135" y="705" font-family="Courier New, monospace" font-size="14" text-anchor="end">100</text>
  <text x="130" y="716" font-family="Arial, sans-serif" font-size="14" text-anchor="end">SURP</text>

  <!-- Energy recovery line (rising from CRITICAL to full) -->
  <polyline points="150,855 200,840 250,825 300,810 350,795 400,780 450,765 500,750 550,735 600,720 650,705 700,700" fill="none" stroke="black" stroke-width="2"/>

  <!-- Figure Label -->
  <text x="425" y="1020" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">FIG. 4</text>
</svg>
