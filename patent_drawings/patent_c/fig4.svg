  <polyline points="160.0,325.0 165.2,302.3 170.5,284.5 175.7,275.6 181.0,277.4 186.2,289.6 191.5,309.5 196.7,332.8 202.0,354.4 207.2,369.6 212.5,375.0 217.7,369.6 223.0,354.4 228.2,332.8 233.5,309.5 238.7,289.6 244.0,277.4 249.2,275.6 254.5,284.5 259.7,302.3 265.0,325.0 270.2,347.7 275.5,365.5 280.7,374.4 286.0,372.6 291.2,360.4 296.5,340.5 301.7,317.2 307.0,295.6 312.2,280.4 317.5,275.0 322.7,280.4 328.0,295.6 333.2,317.2 338.5,340.5 343.7,360.4 349.0,372.6 354.2,374.4 359.5,365.5 364.7,347.7 370.0,325.0 375.2,302.3 380.5,284.5 385.7,275.6 391.0,277.4 396.2,289.6 401.5,309.5 406.7,332.8 412.0,354.4 417.2,369.6 422.5,375.0 427.7,369.6 433.0,354.4 438.2,332.8 443.5,309.5 448.7,289.6 454.0,277.4 459.2,275.6 464.5,284.5 469.7,302.3 475.0,325.0 480.2,347.7 485.5,365.5 490.7,374.4 496.0,372.6 501.2,360.4 506.5,340.5 511.7,317.2 517.0,295.6 522.2,280.4 527.5,275.0 532.7,280.4 538.0,295.6 543.2,317.2 548.5,340.5 553.7,360.4 559.0,372.6 564.2,374.4 569.5,365.5 574.7,347.7 580.0,325.0 585.2,302.3 590.5,284.5 595.7,275.6 601.0,277.4 606.2,289.6 611.5,309.5 616.7,332.8 622.0,354.4 627.2,369.6 632.5,375.0 637.7,369.6 643.0,354.4 648.2,332.8 653.5,309.5 658.7,289.6 664.0,277.4 669.2,275.6 674.5,284.5 679.7,302.3 685.0,325.0" fill="none" stroke="black" stroke-width="2"/>

  <!-- Burst spike annotation (402) - arrow at sine peak (shifted +35) -->
  <line x1="318" y1="275" x2="318" y2="200" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="332" y="245" font-family="Courier New, monospace" font-size="14" text-anchor="start">+0.3</text>
  <text x="325" y="205" font-family="Arial, sans-serif" font-size="14" text-anchor="start">402</text>
  <text x="360" y="185" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Burst (10% probability)</text>

  <!-- Autonomous Input Formula Box (404) -->
  <rect x="160" y="510" width="525" height="100" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="670" y="527" font-family="Arial, sans-serif" font-size="14" text-anchor="end">404</text>
  <text x="422" y="545" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Autonomous Input Formula</text>
  <text x="422" y="570" font-family="Courier New, monospace" font-size="14" text-anchor="middle">circadian = 0.5 + 0.2 x sin(2pi x t x 3)</text>
  <text x="422" y="595" font-family="Courier New, monospace" font-size="14" text-anchor="middle">burst = 0.3 (with 10% probability per step)</text>

  <!-- Energy Recovery Graph Section -->
  <text x="422" y="650" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Energy Recovery During Autonomous Operation</text>

