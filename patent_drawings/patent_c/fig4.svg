  <polyline points="150.0,325.0 155.5,302.3 161.0,284.5 166.5,275.6 172.0,277.4 177.5,289.6 183.0,309.5 188.5,332.8 194.0,354.4 199.5,369.6 205.0,375.0 210.5,369.6 216.0,354.4 221.5,332.8 227.0,309.5 232.5,289.6 238.0,277.4 243.5,275.6 249.0,284.5 254.5,302.3 260.0,325.0 265.5,347.7 271.0,365.5 276.5,374.4 282.0,372.6 287.5,360.4 293.0,340.5 298.5,317.2 304.0,295.6 309.5,280.4 315.0,275.0 320.5,280.4 326.0,295.6 331.5,317.2 337.0,340.5 342.5,360.4 348.0,372.6 353.5,374.4 359.0,365.5 364.5,347.7 370.0,325.0 375.5,302.3 381.0,284.5 386.5,275.6 392.0,277.4 397.5,289.6 403.0,309.5 408.5,332.8 414.0,354.4 419.5,369.6 425.0,375.0 430.5,369.6 436.0,354.4 441.5,332.8 447.0,309.5 452.5,289.6 458.0,277.4 463.5,275.6 469.0,284.5 474.5,302.3 480.0,325.0 485.5,347.7 491.0,365.5 496.5,374.4 502.0,372.6 507.5,360.4 513.0,340.5 518.5,317.2 524.0,295.6 529.5,280.4 535.0,275.0 540.5,280.4 546.0,295.6 551.5,317.2 557.0,340.5 562.5,360.4 568.0,372.6 573.5,374.4 579.0,365.5 584.5,347.7 590.0,325.0 595.5,302.3 601.0,284.5 606.5,275.6 612.0,277.4 617.5,289.6 623.0,309.5 628.5,332.8 634.0,354.4 639.5,369.6 645.0,375.0 650.5,369.6 656.0,354.4 661.5,332.8 667.0,309.5 672.5,289.6 678.0,277.4 683.5,275.6 689.0,284.5 694.5,302.3 700.0,325.0" fill="none" stroke="black" stroke-width="2"/>

  <!-- Burst spike annotation (402) -->
  <line x1="350" y1="270" x2="350" y2="230" stroke="black" stroke-width="2"/>
  <text x="360" y="225" font-family="Courier New, monospace" font-size="14" text-anchor="start">+0.3</text>
  <text x="500" y="220" font-family="Arial, sans-serif" font-size="14" text-anchor="start">402</text>
  <text x="500" y="240" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Burst (10% probability)</text>

  <!-- Autonomous Input Formula Box (404) -->
  <rect x="150" y="510" width="550" height="100" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="690" y="527" font-family="Arial, sans-serif" font-size="14" text-anchor="end">404</text>
  <text x="425" y="545" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Autonomous Input Formula</text>
  <text x="425" y="570" font-family="Courier New, monospace" font-size="14" text-anchor="middle">circadian = 0.5 + 0.2 x sin(2pi x t x 3)</text>
  <text x="425" y="595" font-family="Courier New, monospace" font-size="14" text-anchor="middle">burst = 0.3 (with 10% probability per step)</text>

  <!-- Energy Recovery Graph Section -->
  <text x="425" y="650" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Energy Recovery During Autonomous Operation</text>

  <!-- Energy graph Y-axis -->
