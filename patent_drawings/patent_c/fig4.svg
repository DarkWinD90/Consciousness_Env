  <text x="265" y="475" font-family="Courier New, monospace" font-size="14" text-anchor="middle">100</text>

  <line x1="370" y1="450" x2="370" y2="455" stroke="black" stroke-width="2"/>
  <text x="370" y="475" font-family="Courier New, monospace" font-size="14" text-anchor="middle">200</text>

