  <polyline points="125.0,325.0 130.2,302.3 135.5,284.5 140.7,275.6 146.0,277.4 151.2,289.6 156.5,309.5 161.7,332.8 167.0,354.4 172.2,369.6 177.5,375.0 182.7,369.6 188.0,354.4 193.2,332.8 198.5,309.5 203.7,289.6 209.0,277.4 214.2,275.6 219.5,284.5 224.7,302.3 230.0,325.0 235.2,347.7 240.5,365.5 245.7,374.4 251.0,372.6 256.2,360.4 261.5,340.5 266.7,317.2 272.0,295.6 277.2,280.4 282.5,275.0 287.7,280.4 293.0,295.6 298.2,317.2 303.5,340.5 308.7,360.4 314.0,372.6 319.2,374.4 324.5,365.5 329.7,347.7 335.0,325.0 340.2,302.3 345.5,284.5 350.7,275.6 356.0,277.4 361.2,289.6 366.5,309.5 371.7,332.8 377.0,354.4 382.2,369.6 387.5,375.0 392.7,369.6 398.0,354.4 403.2,332.8 408.5,309.5 413.7,289.6 419.0,277.4 424.2,275.6 429.5,284.5 434.7,302.3 440.0,325.0 445.2,347.7 450.5,365.5 455.7,374.4 461.0,372.6 466.2,360.4 471.5,340.5 476.7,317.2 482.0,295.6 487.2,280.4 492.5,275.0 497.7,280.4 503.0,295.6 508.2,317.2 513.5,340.5 518.7,360.4 524.0,372.6 529.2,374.4 534.5,365.5 539.7,347.7 545.0,325.0 550.2,302.3 555.5,284.5 560.7,275.6 566.0,277.4 571.2,289.6 576.5,309.5 581.7,332.8 587.0,354.4 592.2,369.6 597.5,375.0 602.7,369.6 608.0,354.4 613.2,332.8 618.5,309.5 623.7,289.6 629.0,277.4 634.2,275.6 639.5,284.5 644.7,302.3 650.0,325.0" fill="none" stroke="black" stroke-width="2"/>

  <!-- Burst spike annotation (402) - arrow at sine peak x=283 (y=275) showing +0.3 amplitude -->
  <line x1="283" y1="275" x2="283" y2="200" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="297" y="245" font-family="Courier New, monospace" font-size="14" text-anchor="start">+0.3</text>
  <text x="297" y="185" font-family="Arial, sans-serif" font-size="14" text-anchor="start">402</text>
  <text x="340" y="185" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Burst (10% probability)</text>

  <!-- Autonomous Input Formula Box (404) -->
  <rect x="125" y="510" width="525" height="100" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="635" y="527" font-family="Arial, sans-serif" font-size="14" text-anchor="end">404</text>
  <text x="387" y="545" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Autonomous Input Formula</text>
  <text x="387" y="570" font-family="Courier New, monospace" font-size="14" text-anchor="middle">circadian = 0.5 + 0.2 x sin(2pi x t x 3)</text>
  <text x="387" y="595" font-family="Courier New, monospace" font-size="14" text-anchor="middle">burst = 0.3 (with 10% probability per step)</text>

  <!-- Energy Recovery Graph Section -->
  <text x="387" y="650" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Energy Recovery During Autonomous Operation</text>

  <!-- Energy graph Y-axis -->
  <line x1="125" y1="870" x2="125" y2="700" stroke="black" stroke-width="2"/>
  <text x="67" y="785" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" transform="rotate(-90 67 785)">Energy (mWh)</text>

  <!-- Energy graph X-axis -->
  <line x1="125" y1="870" x2="650" y2="870" stroke="black" stroke-width="2"/>

  <!-- Reference numeral 406 -->
  <text x="635" y="785" font-family="Arial, sans-serif" font-size="14" text-anchor="end">406</text>

  <!-- Energy level gridlines with labels (scaled) -->
  <line x1="125" y1="844" x2="650" y2="844" stroke="black" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="105" y="849" font-family="Courier New, monospace" font-size="14" text-anchor="end">15</text>
  <text x="640" y="849" font-family="Arial, sans-serif" font-size="14" text-anchor="end">CRITICAL</text>

  <line x1="125" y1="819" x2="650" y2="819" stroke="black" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="105" y="824" font-family="Courier New, monospace" font-size="14" text-anchor="end">30</text>
  <text x="640" y="824" font-family="Arial, sans-serif" font-size="14" text-anchor="end">LOW</text>

  <line x1="125" y1="734" x2="650" y2="734" stroke="black" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="105" y="739" font-family="Courier New, monospace" font-size="14" text-anchor="end">80</text>
  <text x="640" y="739" font-family="Arial, sans-serif" font-size="14" text-anchor="end">NORMAL</text>

  <line x1="125" y1="700" x2="650" y2="700" stroke="black" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="105" y="705" font-family="Courier New, monospace" font-size="14" text-anchor="end">100</text>
  <text x="640" y="705" font-family="Arial, sans-serif" font-size="14" text-anchor="end">SURPLUS</text>

  <!-- Energy recovery line (rising from CRITICAL to full) - scaled x-coords -->
  <polyline points="125,855 173,840 220,825 268,810 316,795 363,780 411,765 459,750 506,735 554,720 601,705 650,700" fill="none" stroke="black" stroke-width="2"/>

  <!-- Figure Label -->
  <text x="387" y="950" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">FIG. 4</text>
</svg>
