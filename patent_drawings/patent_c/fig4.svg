<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">4/7</text>

  <!-- Title -->
  <text x="387" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">AUTONOMOUS INPUT GENERATOR OUTPUT</text>

  <!-- Input Signal Graph (400) -->
  <!-- Y-axis -->
  <line x1="125" y1="450" x2="125" y2="200" stroke="black" stroke-width="2"/>
  <text x="67" y="325" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" transform="rotate(-90 67 325)">Input Value</text>

  <!-- X-axis -->
  <line x1="125" y1="450" x2="650" y2="450" stroke="black" stroke-width="2"/>
  <text x="387" y="508" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Autonomous Step Number</text>

  <!-- Reference numeral 400 — positioned outside graph, right side, centered -->
  <text x="670" y="330" font-family="Arial, sans-serif" font-size="14" text-anchor="start">400</text>

  <!-- Y-axis tick marks -->
  <line x1="120" y1="450" x2="125" y2="450" stroke="black" stroke-width="2"/>
  <text x="110" y="455" font-family="Courier New, monospace" font-size="14" text-anchor="end">0.0</text>

  <line x1="120" y1="325" x2="125" y2="325" stroke="black" stroke-width="2"/>
  <text x="110" y="330" font-family="Courier New, monospace" font-size="14" text-anchor="end">0.5</text>

  <line x1="120" y1="200" x2="125" y2="200" stroke="black" stroke-width="2"/>
  <text x="110" y="205" font-family="Courier New, monospace" font-size="14" text-anchor="end">1.0</text>

  <!-- X-axis tick marks (scaled: 125 + (old-150)*0.9545) -->
  <line x1="125" y1="450" x2="125" y2="455" stroke="black" stroke-width="2"/>
  <text x="125" y="475" font-family="Courier New, monospace" font-size="14" text-anchor="middle">0</text>

  <line x1="230" y1="450" x2="230" y2="455" stroke="black" stroke-width="2"/>
  <text x="230" y="475" font-family="Courier New, monospace" font-size="14" text-anchor="middle">100</text>

  <line x1="335" y1="450" x2="335" y2="455" stroke="black" stroke-width="2"/>
  <text x="335" y="475" font-family="Courier New, monospace" font-size="14" text-anchor="middle">200</text>

  <line x1="440" y1="450" x2="440" y2="455" stroke="black" stroke-width="2"/>
  <text x="440" y="475" font-family="Courier New, monospace" font-size="14" text-anchor="middle">300</text>

  <line x1="545" y1="450" x2="545" y2="455" stroke="black" stroke-width="2"/>
  <text x="545" y="475" font-family="Courier New, monospace" font-size="14" text-anchor="middle">400</text>

  <line x1="650" y1="450" x2="650" y2="455" stroke="black" stroke-width="2"/>
  <text x="650" y="475" font-family="Courier New, monospace" font-size="14" text-anchor="middle">500</text>

