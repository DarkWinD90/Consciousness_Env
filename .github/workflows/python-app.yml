# CI workflow: lint, unit tests, and falsifiable phase validations
# All four phase validation scripts must PASS before any merge to main.

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Test with pytest
      run: |
        pytest

  validate-phases:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Phase 7 — Control Baseline (Claims A-E)
      run: |
        python phases/phase7_control_baseline.py 2>&1 | tee phase7.log
        grep -q "FAIL" phase7.log && exit 1 || true
    - name: Phase 8 — STDP Learning (Claims F8.1-F8.3)
      run: |
        python phases/phase8_stdp.py 2>&1 | tee phase8.log
        grep -q "FAIL" phase8.log && exit 1 || true
    - name: Phase 9 — Predictive Processing (Claims F9.1-F9.3)
      run: |
        python phases/phase9_predictive_processing.py 2>&1 | tee phase9.log
        grep -q "FAIL" phase9.log && exit 1 || true
    - name: Phase 10 — Multi-Modal Integration (Claims F10.1-F10.3)
      run: |
        python phases/phase10_multimodal.py 2>&1 | tee phase10.log
        grep -q "FAIL" phase10.log && exit 1 || true
