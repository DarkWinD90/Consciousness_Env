<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  USPTO-Compliant Patent Drawing Template
  37 CFR 1.84 Requirements:
  - Page: 8.5" x 11" (850x1100 units at 100 DPI)
  - Margins: >= 1" all sides (content x,y >= 100; x <= 750; y <= 1000)
  - Fonts: >= 14pt, Arial only (no formulas, no implementation details)
  - Colors: Black on white only
  - Arrowheads: 6x4 marker, endpoints MUST touch target box edges exactly
  - Signal paths: MUST NOT cross other paths or pass through element boxes
  - Text: Block names + reference numerals only (37 CFR 1.84(o))
-->
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <!-- Standard arrowhead marker -->
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
  </defs>

  <!-- White background -->
  <rect width="100%" height="100%" fill="white" />

  <!-- Sheet number (top center, in margin area) -->
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="black">N/M</text>

  <!-- Main content area (translated down 50 units for header space) -->
  <g transform="translate(0, 50)">

    <!--
      CONTENT RULES:
      - All content: x >= 100, x <= 750, y >= 50 (absolute y >= 100)
      - Text inside boxes: BLOCK NAME only (e.g., "MOTOR", "SENSOR")
      - NO formulas, NO parameter values, NO layer descriptions
      - Reference numerals: even numbers from NUMERAL_REGISTRY.md
      - Each numeral needs a leader line (stroke-width="0.5")
      - Arrow y2/x2 must EXACTLY match target box edge coordinate
      - Signal paths must not cross each other
      - Signal paths must not pass through element boxes
    -->

    <!-- Example: Element box with block name and reference numeral -->
    <rect x="300" y="200" width="250" height="80" fill="none" stroke="black" stroke-width="1.5"/>
    <text x="425" y="245" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="black">BLOCK NAME</text>
    <!-- Ref numeral with leader line -->
    <text x="555" y="210" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="black">14</text>
    <line x1="553" y1="210" x2="550" y2="220" stroke="black" stroke-width="0.5"/>

    <!-- Example: Arrow connecting to next box (y2 MUST equal target box top) -->
    <line x1="425" y1="280" x2="425" y2="350" stroke="black" stroke-width="1.5" marker-end="url(#ah)"/>

    <!-- Figure label (bottom center, bold, 20pt) -->
    <text x="425" y="920" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="black">FIG. N</text>

  </g>
</svg>
