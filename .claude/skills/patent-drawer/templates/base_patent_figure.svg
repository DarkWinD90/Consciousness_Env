<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  USPTO-Compliant Patent Drawing Template
  37 CFR 1.84 Requirements:
  - Page: 8.5" x 11" (850x1100 units at 100 DPI)
  - Margins: >= 1" all sides (content x,y >= 100)
  - Fonts: >= 14pt, Arial or Courier New only
  - Colors: Black on white only
  - Arrowheads: 6x4 marker standard
-->
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100">
  <defs>
    <!-- Standard arrowhead marker -->
    <marker id="ah" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="black" />
    </marker>
    <!-- Optional: Hatching pattern for shaded regions -->
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="black" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- White background -->
  <rect width="100%" height="100%" fill="white" />

  <!-- Sheet number (top center) -->
  <text x="425" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">N/M</text>

  <!-- Main content area (translated down 50 units for header space) -->
  <g transform="translate(0, 50)">

    <!-- Title (bold, centered) -->
    <text x="425" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">FIGURE TITLE HERE</text>

    <!-- === CONTENT AREA === -->
    <!-- All content must have: x >= 100, y >= 50 (100 with transform) -->
    <!-- Right boundary: x <= 750 -->
    <!-- Bottom boundary: y <= 850 (900 with transform) -->

    <!-- Example: Box element with reference numeral -->
    <rect x="300" y="200" width="250" height="100" rx="5" fill="none" stroke="black" stroke-width="2"/>
    <text x="425" y="250" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Component Name</text>
    <text x="555" y="210" font-family="Arial, sans-serif" font-size="14" text-anchor="start">100</text>
    <line x1="553" y1="210" x2="550" y2="225" stroke="black" stroke-width="0.5"/>

    <!-- Example: Arrow with label -->
    <line x1="425" y1="300" x2="425" y2="380" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
    <text x="435" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="start">Signal</text>

    <!-- Example: Code/value in Courier New -->
    <text x="425" y="420" font-family="Courier New, monospace" font-size="14" text-anchor="middle">value = 0.5</text>

    <!-- === END CONTENT AREA === -->

    <!-- Figure label (bottom center, bold, 20pt) -->
    <text x="425" y="920" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">FIG. N</text>

  </g>
</svg>
